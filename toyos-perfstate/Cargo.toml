# A member of the host workspace (root `Cargo.toml`), like toyos-tco: the
# kernel depends on it by path and its tests run on the host, because no QEMU
# CPU has HWP and the arithmetic that decides what a real laptop's CPUs are
# asked for is exactly what a guest cannot exercise.

[package]
name = "toyos-perfstate"
description = "The CPU performance request the kernel declares on an x86-64 CPU with HWP, and the register layouts a reader checks it against."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
