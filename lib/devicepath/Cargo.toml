[package]
name = "toyos-devicepath"
description = "UEFI device paths as bytes: a bounded, validating node walk, the nodes a boot source names, and their text form."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
# A HARDDRIVE node's partition GUID, spelled as every GPT GUID is.
toyos-gpt = { path = "../gpt" }

[lints.rust]
unsafe_code = "forbid"
