# A member of the host workspace (root `Cargo.toml`): usbd links its `Keys`
# through toyos-usbhid, the owners of input link the rest, and its tests run on
# the host.

[package]
name = "toyos-input"
description = "The owner of input's side of every source: one keyboard's held keys, the merge of every source's keys and pointers, and the `input` port's records, each one that does not decode refused by name; pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
