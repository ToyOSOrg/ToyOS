# A member of the host workspace (root `Cargo.toml`), like toyos-gpt: the
# kernel depends on it by path and its tests run on the host,
# with no target-triple juggling. An ELF is bytes somebody else wrote, and every
# one a loader opens crossed a trust boundary — so the parser has to be
# exercised against hostile bytes far more often than a QEMU boot allows.
# `toyos`'s loader (`toyos::dl`) depends on it, so std does, and it is
# published before `toyos` (`build/sdkversion.rs`).

[package]
name = "toyos-elf"
description = "ELF64 decoding of untrusted program images (no_std, no alloc, forbid(unsafe_code))."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ToyOSOrg/ToyOS"

[features]
rustc-dep-of-std = ["core"]

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[dev-dependencies]
# unaligned: an include_bytes! fixture is aligned to 1, and object reads a header in place.
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
