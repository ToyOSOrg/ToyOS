# A member of the host workspace (root `Cargo.toml`): `no_std` so the loader
# can depend on it by path, and its tests run on the host.

[package]
name = "toyos-microcode"
description = "Where on ROOT a CPU's microcode patch is: the name its vendor gives a patch, which the build writes and the loader looks up."
