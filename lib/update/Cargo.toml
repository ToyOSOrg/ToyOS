# A member of the host workspace (root `Cargo.toml`): the bootloader and
# `/system/bin/update` depend on it by path and its tests run on the host. It is
# every decision a signed image, a slot and its record make, so the loader and
# the updater cannot read one format two ways; and a signed package
# repository's format and every decision its client makes, which the publisher
# (`build/publish.rs`) reads its own output back through.

[package]
name = "toyos-update"
description = "A signed image, the slots it installs into, and a signed package repository, with every decision a verifier makes about them, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Signing and deriving a seed's public key, for the host that holds the key.
# Off in the loader and the updater, so no binary on the machine carries a
# path that makes a signature.
sign = ["toyos-crypto/sign"]

[dependencies]
# Ed25519 verification (RFC 8032, small-order keys and non-canonical
# encodings refused), SHA-512 over the signed header as SSHSIG names it, and
# SHA-256 over the sections and a package archive. `no_std`.
toyos-crypto = { path = "../crypto" }
# The calendar a repository document's `expires` is written in, the tree's one.
toyos-wallclock = { path = "../wallclock" }

# The other verifiers the image signature is held against: RustCrypto's
# `verify_strict` and ring's.
[[test]]
name = "ed25519_oracles"
required-features = ["sign"]

[dev-dependencies]
toyos-crypto = { path = "../crypto", features = ["sign"] }
ed25519-dalek = "2.2"
ring = "0.17.14"
