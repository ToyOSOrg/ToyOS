# A member of the host workspace (root `Cargo.toml`): usbd depends on it by
# path and its tests run on the host.

[package]
name = "toyos-usbhid"
description = "USB HID report descriptors read into keyboards and pointers, and their reports into key transitions and pointer reports, every malformed descriptor and report refused by name; pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# One keyboard's held set, and the `input` record a pointer report is bounded
# to.
[dependencies]
toyos-input = { path = "../input" }
toyos-abi = { path = "../../sdk/abi" }
