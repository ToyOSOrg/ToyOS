# A member of the host workspace (root `Cargo.toml`), like toyos-pci: the
# kernel depends on it by path and its tests run on the host.
# What lives here is where a chipset keeps its watchdog and what timer value a
# bound in milliseconds comes to — decisions about which register the kernel
# writes on a real machine, which a guest cannot exercise and a host test can.

[package]
name = "toyos-tco"
description = "Every bound a boot arms and the metal loop waits on, and the chipset watchdogs that hold it: Intel's TCO and AMD's FCH watchdog."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
