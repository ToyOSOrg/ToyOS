# A member of the host workspace (root `Cargo.toml`), like toyos-gpt: the
# kernel and `system/symbolize` depend on it by path and its tests run on the
# host, with no target-triple juggling. What lives here is every pure decision
# a backtrace frame needs that reads no ELF: how much of the record's budget a
# demangled name gets, and the record a killed program's frame is written as.
# Reading an image is `toyos::elf`'s, which the kernel does not link.

[package]
name = "toyos-symbols"
description = "Backtrace frames: budgeting the demangled name, and a killed program's file+offset record (no_std, no alloc, forbid(unsafe_code))."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
rustc-demangle = "0.1"
toyos-abi = { path = "../../sdk/abi" }
toyos-elide = { path = "../elide" }

