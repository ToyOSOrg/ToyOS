# A member of the host workspace (root `Cargo.toml`): the kernel's device
# inventory read whole, which init reads and the host tests.

[package]
name = "toyos-inventory"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
toyos-abi = { path = "../toyos-abi" }

[lints.rust]
warnings = "deny"
