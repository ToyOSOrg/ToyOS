# The one workspace: every crate in this repository but the ones `exclude`
# names, resolved once into the one `Cargo.lock`, built with the one
# `[profile.toyos]` and patched by the one `[patch]` table below. A guest
# build names its package with `-p` and its triple with `--target`, whose
# flags are `.cargo/config.toml`'s; features unify only across the packages one
# `cargo` builds, so a member's features never reach the kernel's or the
# loader's build.
#
# `build/hostws.rs` reds on a `Cargo.toml` in this tree that is neither a member
# nor excluded below with a reason, and says which members a host tests:
# `cargo run -- --ci host` runs every one of those.
#
# `default-members` is the root package alone, so a bare `cargo test` at the
# root is still the QEMU harness and a bare `cargo run` is still the dev loop.
# Naming the whole workspace is the deliberate act.
[workspace]
members = [
    "apps/calc",
    "apps/doom",
    "apps/editor",
    "apps/files",
    "apps/paint",
    "apps/snake",
    "apps/toyfetch",
    "build/root",
    "kernel",
    "kernel/amdvi",
    "kernel/copies",
    "kernel/dma",
    "kernel/gicv3",
    "kernel/its",
    "kernel/loom",
    "kernel/pci",
    "kernel/phys",
    "kernel/proclife",
    "kernel/sim",
    "kernel/smmu",
    "lib/acpi",
    "lib/acpiserver-api",
    "lib/bcachefs",
    "lib/blackbox",
    "lib/blockdev",
    "lib/blockhold",
    "lib/blockring",
    "lib/blockserve",
    "lib/bootmap",
    "lib/crypto",
    "lib/device-memory",
    "lib/devicepath",
    "lib/elf",
    "lib/display-output",
    "lib/edid",
    "lib/elide",
    "lib/fat32",
    "lib/fat32/check",
    "lib/gpt",
    "lib/ieee80211",
    "lib/input",
    "lib/inspect",
    "lib/link",
    "lib/logkeeper-api",
    "lib/logstream",
    "lib/manifest",
    "lib/microcode",
    "lib/parity",
    "lib/pci-claim",
    "lib/quiesce",
    "lib/random",
    "lib/rootimage",
    "lib/scsi",
    "lib/session",
    "lib/ssh",
    "lib/swap",
    "lib/symbols",
    "lib/tco",
    "lib/tmpdir",
    "lib/trace",
    "lib/tsc",
    "lib/usbhid",
    "lib/update",
    "lib/userbound",
    "lib/vdagent",
    "lib/virtio",
    "lib/wallclock",
    "loader",
    "sdk/abi",
    "sdk/filepicker",
    "sdk/font",
    "sdk/icon",
    "sdk/keymap",
    "sdk/libc/arch",
    "sdk/osrelease",
    "sdk/toyos",
    "sdk/window",
    "system/acpiserver",
    "system/acpiserver/aml",
    "system/ax2xx/driver",
    "system/compositor",
    "system/compositor/desktop",
    "system/compositor/virtio-gpu",
    "system/console",
    "system/disks",
    "system/diskserver",
    "system/filepicker",
    "system/fileserver",
    "system/grants",
    "system/host",
    "system/i219",
    "system/i219/driver",
    "system/inspect",
    "system/logkeeper",
    "system/logout",
    "system/netstack",
    "system/netstack/dhcp",
    "system/netstack/dns",
    "system/netstack/ip",
    "system/netstack/mdns",
    "system/netstack/node",
    "system/netstack/shard",
    "system/netstack/shard/tcp",
    "system/netstack/shard/testnet",
    "system/netstack/udp",
    "system/netstack/wire",
    "system/nvme",
    "system/pkg",
    "system/ps2server",
    "system/ps2server/ps2",
    "system/hda",
    "system/hda/driver",
    "system/session",
    "system/shell",
    "system/soundserver",
    "system/soundserver/mixer",
    "system/soundserver/output",
    "system/soundserver/resample",
    "system/soundserver/virtio-sound",
    "system/sshserver",
    "system/supervisor",
    "system/supervisor/lifecycle",
    "system/swap",
    "system/symbolize",
    "system/terminal",
    "system/tgl-display",
    "system/tgl-display/driver",
    "system/toybox",
    "system/toybox/copies",
    "system/trace",
    "system/update",
    "system/update/copies",
    "system/usbd",
    "system/usbd/xhci",
    "system/vdagent",
    "system/vdagent/bridge",
    "system/virtio-net",
    "system/wlan/handshake",
    "tests/guest/hangupholder",
    "tests/guest/inputsink",
    "tests/guest/kernelprobe",
    "tests/guest/metalprobe",
    "tests/guest/osbench",
    "tests/guest/osbench/compare",
    "tests/guest/osbench/lan",
    "tests/guest/osbench/rules",
    "tests/guest/pagerprobe",
    "tests/guest/pciholder",
    "tests/guest/starveling",
    "tests/guest/test-runner",
    "tests/metal",
]
default-members = ["."]
# Everything that keeps its own resolution. Each is excluded for a reason, and
# `build/hostws.rs` holds this list against the tree — an entry that stops naming
# a directory with a `Cargo.toml` under it is a red, so a stale excuse cannot
# outlive what it excused.
exclude = [
    # The Rust compiler/std fork: its own workspaces, its own lockfiles, and a
    # submodule this repository does not resolve for.
    "rust",
    # The C library, built into a sysroot with `--release` and its own
    # `panic = "abort"` profile, which cargo ignores in a member; its lock is one
    # of the sysroot key's inputs (`build/sysroot.rs`).
    "sdk/libc",
    # Guest programs `build/build.rs` builds for `x86_64-unknown-toyos`, each from
    # its own directory but `tls-multi-crate/dep`, its parent's dependency: the
    # first patches memmap2 and `tls-cranelift` target-lexicon, and a `[patch]`
    # is the whole workspace's. Named, and not `tests/` whole, so the gate finds
    # a host test under `tests/` that joined neither list.
    "tests/guest/rust-tests",
    "tests/guest/rust-tests/tls-cranelift",
    "tests/guest/rust-tests/tls-dlopen-lib",
    "tests/guest/rust-tests/tls-lib",
    "tests/guest/rust-tests/tls-multi-crate",
    "tests/guest/rust-tests/tls-multi-crate/dep",
]

[package]
name = "toyos-build"
description = "The build system: toolchain, kernel, bootloader, userland and image, the QEMU harness, CI jobs, and the gates the tree is held to."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# `toyos-flash` and `imgstat` are binaries of this package too, so a bare
# `cargo run` would otherwise be ambiguous — and that command is the dev loop.
default-run = "toyos-build"

[lib]
path = "build/lib.rs"

[[bin]]
name = "toyos-build"
path = "build/main.rs"

[[bin]]
name = "toyos-flash"
path = "build/bin/toyos-flash.rs"

[[bin]]
name = "imgstat"
path = "build/bin/imgstat.rs"

[dependencies]
# The rasterizer the build draws the 8x16 font with, which a guest drawing at
# a scale runs too.
toyos-font = { path = "sdk/font" }
# The SVG subset every shipped icon is held to, read as the guest reads it.
toyos-icon = { path = "sdk/icon" }
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcachefs = { path = "lib/bcachefs" }
toyos-abi = { path = "sdk/abi" }
# What `build::syscall_entry_bytes` finds a staged kernel's entry with: its
# segments, and its symbol table where the kernel's own backtrace finds it.
toyos-elf = { path = "lib/elf" }
toyos-symbols = { path = "lib/symbols" }
# What `build::fpgate` decodes the linked x86-64 kernel with, to refuse an
# instruction that touches the user FP or vector state outside `arch::fpu`:
# rustc refuses no instruction written as `asm!` text, so only the image says.
# A general, widely used x86 decoder in Rust alone, with the CPUID feature and
# register-use tables the refusal needs; the only other decoder at hand,
# `llvm-objdump`, is a C++ tool where a Rust one does the job.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
toyos-fat32 = { path = "lib/fat32" }
# The device `toyos-fat32` writes and reads a volume through: here, the bytes
# being built.
toyos-blockdev = { path = "lib/blockdev" }
# The names the loader looks a CPU's microcode up by, which `microcode` writes
# each patch it splits out of a vendor's file under.
toyos-microcode = { path = "lib/microcode" }
# The two readers `image::certify` judges every published image with. They are
# dependencies of the build rather than of its tests because a flash target is
# not published until they have both passed on it.
toyos-fat32-check = { path = "lib/fat32/check" }
toyos-gpt = { path = "lib/gpt" }
# The `input` port's name and the one program the image may give it to, so the
# gate on every manifest reads what its owners and its source read.
toyos-input = { path = "lib/input" }
toyos-keymap = { path = "sdk/keymap" }
# The form a program's line takes in a boot's log and the port `logkeeper` serves it
# on, so the judges reading the log and `logkeeper` writing it read one declaration.
toyos-logstream = { path = "lib/logstream" }
toyos-manifest = { path = "lib/manifest" }
toyos-osrelease = { path = "sdk/osrelease" }
# The swap port's name and the one program the image may give it to, so the
# gate on every manifest reads what the supervisor reads.
toyos-swap = { path = "lib/swap" }
toyos-session = { path = "lib/session" }
# QEMU's clipboard channel's port name, id and port count, so the launch reads
# the declaration the guest's agent drives.
toyos-vdagent = { path = "lib/vdagent" }
# The watchdog's parameter name, so the gate over `kernel/src/params.rs` reads
# the same constant the kernel and the bootloader do.
toyos-tco = { path = "lib/tco" }
# The one scratch directory, under `$TMPDIR` or, for a socket, `/tmp`: the harness's run takes one, and so does
# every test here; `--ci host` holds the host tests to leaving nothing behind.
toyos-tmpdir = { path = "lib/tmpdir" }
toyos-blackbox = { path = "lib/blackbox" }
# The signed image, the slot table and the signer: `build/signing.rs` signs with
# the same crate the loader and `/system/bin/update` verify with.
toyos-update = { path = "lib/update", features = ["sign"] }
# A throwaway key's seed and every GUID a partition table names, from the
# operating system.
getrandom = "0.3"
# The wallpaper's `powf` and `expf`, in Rust and the same on every host, where
# `f32`'s own call the host's C library and ROOT's UUID is derived from its bytes.
libm = "0.2.16"
# The one `openssh-key-v1` reader and writer, shared with the SSH server's
# host key, and the `SHA256:` fingerprint the owner's key is named by.
toyos-ssh = { path = "lib/ssh" }
# `classify`, so the host reading a log volume and `logkeeper` writing it cannot
# disagree about which files on it are `logkeeper`'s.
toyos-wallclock = { path = "lib/wallclock" }
# Every SHA-256 the build takes (`toyos_build::sha256`), and the TLS provider of
# every request it makes (`release::agent`).
toyos-crypto = { path = "lib/crypto", features = ["std", "rustls-provider"] }
# The provider's types: its random source and its key-exchange groups.
rustls = { version = "0.23.45", default-features = false }
# The toolchain release's tarball, packed in-process (`build/release.rs`): Rust's
# own tar and gzip, where the binaries are hosts' tools.
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Every request the build system makes, GitHub's API and the crates.io index,
# where curl is a host's tool: rustls on toyos-crypto's provider, with webpki's
# roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# The authorities `build::trust_roots` writes to ROOT, as the rustls project
# publishes the Mozilla root program, and the PEM it writes them in.
webpki-root-certs = "1"
pem = "4"

[dev-dependencies]
# The FAT implementation `build/fatformat.rs` is judged against, byte for byte.
fatfs = "0.3.6"
# `USER_TOP`, so the harness judges a held `rsp` against the bound the kernel
# checks every user pointer against and not against a second copy of it.
toyos-userbound = { path = "lib/userbound" }
# The scheduler's quantum and the windows' hold, so the harness judges a boot
# against the constants the kernel schedules by.
kernel = { path = "kernel" }
# The ACPI server's count line, so the judge reads the words the server writes
# and the job that waits for them matches.
acpiserver-api = { path = "lib/acpiserver-api" }
# The metal loop, the suite's command line, and what the metal profile
# derives, times and reads off a boot.
toyos-metal = { path = "tests/metal" }
# The shutdown's stop record: the kernel renders it and the harness reads it
# back off a log, so one declaration is what both sides spell it with.
toyos-quiesce = { path = "lib/quiesce" }
# The parity table `crypto_parity` prints and the judge reads, under one rule.
toyos-parity = { path = "lib/parity" }
# The package energy counter's decode, so the `counters` judge's reading of
# it is osbench's rule and not a second one.
osbench-rules = { path = "tests/guest/osbench/rules" }

[patch.crates-io]
loom = { git = "https://github.com/ToyOSOrg/loom", branch = "toyos" }
# ToyOS's own crates: the forks below depend on these by version so they can be
# consumed as git dependencies (a path escaping the fork's own repo cannot
# resolve once cargo checks it out alone). These redirects keep local builds
# on the working tree.
toyos-abi = { path = "sdk/abi" }
toyos = { path = "sdk/toyos" }
toyos-window = { path = "sdk/window" }
toyos-osrelease = { path = "sdk/osrelease" }
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2-sdk-0.12", package = "getrandom" }
getrandom_03 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.3-sdk-0.12", package = "getrandom" }
getrandom_04 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.4", package = "getrandom" }
mio = { git = "https://github.com/ToyOSOrg/mio", branch = "toyos" }
socket2 = { git = "https://github.com/ToyOSOrg/socket2", branch = "toyos" }
raw-window-handle = { git = "https://github.com/ToyOSOrg/raw-window-handle", branch = "toyos-0.6.2" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0" }
softbuffer = { git = "https://github.com/ToyOSOrg/softbuffer", branch = "toyos-0.4.8" }
winit = { git = "https://github.com/ToyOSOrg/winit", branch = "toyos-0.30.13" }
ring = { git = "https://github.com/ToyOSOrg/ring", branch = "toyos-0.17.14" }
sysinfo = { git = "https://github.com/ToyOSOrg/sysinfo", branch = "toyos-0.39.6" }

# The one profile every guest binary is built with.
# Optimised, because an unoptimised guest mismeasures everything under TCG;
# debug-assertions and overflow-checks on, because fail-fast beats speed here.
# `--release` would turn the last two off silently.
#
# `incremental` stays at the dev default (on), which switches rustc's MIR
# inliner off for every guest crate — LLVM inlines regardless, and a
# non-incremental kernel edit loop measures 4-10x the wall clock. A codegen
# backend with no inliner of its own (cranelift) reopens that trade.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 2

# The test harness is a compute-bound host program, not a debug build of the
# thing under test: it decodes a 2.07 M-pixel screendump per poll and formats a
# 300 MB disk image per boot. No guest is built with this: the kernel, the
# loader and userland take `[profile.toyos]`. `debug` stays on (the dev
# default), so LLDB still works on it.
#
# It reaches every member's host tests rather than the harness alone. Nothing
# fail-fast is traded for it — `opt-level` does not
# touch `debug-assertions`, which cargo still passes as `on` (checked with
# `cargo build -p toyos-fat32 -v`), and rustc derives `overflow-checks` from
# that.
#
# **One member depends on this line for correctness rather than for speed, and
# its own manifest says so at length — this is the other half of that
# citation.** `kernel-loom`'s models run on the 32 KiB coroutine stacks
# `generator` gives loom's threads, with a 4,416-byte `Shard` and kilobyte
# `LogRecord`s passing through them; at `opt-level = 0` the per-temporary copies
# overflow one before the first assertion. Lowering the number here does not
# make those models slower, it stops them running. A member's own `[profile]`
# table cannot rescue it: cargo ignores one in a member, and `build/hostws.rs`
# reds on it.
[profile.dev]
opt-level = 2

[[test]]
name = "toyos-build"
path = "tests/toyos.rs"
harness = false

[[test]]
name = "toyos-checks"
path = "tests/checks.rs"
