# The one workspace: every crate in this repository but the ones `exclude`
# names, resolved once into the one `Cargo.lock`, built with the one
# `[profile.toyos]` and patched by the one `[patch]` table below. A guest
# build names its package with `-p` and its triple with `--target`, whose
# flags are `.cargo/config.toml`'s; features unify only across the packages one
# `cargo` builds, so a member's features never reach the kernel's or the
# loader's build.
#
# `src/hostws.rs` reds on a `Cargo.toml` in this tree that is neither a member
# nor excluded below with a reason, and says which members a host tests:
# `cargo run -- --ci host` runs every one of those.
#
# `default-members` is the root package alone, so a bare `cargo test` at the
# root is still the QEMU harness and a bare `cargo run` is still the dev loop.
# Naming the whole workspace is the deliberate act.
[workspace]
members = [
    "bcachefs",
    "bootloader",
    "kernel",
    "kernel/dma",
    "kernel/gicv3",
    "kernel/loom",
    "kernel/pci",
    "kernel/ps2",
    "kernel/sim",
    "tests/libc-arch",
    "toyos",
    "toyos-abi",
    "toyos-acpi",
    "toyos-blackbox",
    "toyos-blockhold",
    "toyos-blockring",
    "toyos-blockring/transport",
    "toyos-bootmap",
    "toyos-cpuvuln",
    "toyos-device-memory",
    "toyos-dhcp",
    "toyos-dns",
    "toyos-elf",
    "toyos-elide",
    "toyos-fat32",
    "toyos-fat32/check",
    "toyos-gpt",
    "toyos-hda",
    "toyos-i219",
    "toyos-inspect",
    "toyos-its",
    "toyos-keymap",
    "toyos-logstream",
    "toyos-manifest",
    "toyos-microcode",
    "toyos-net-ip",
    "toyos-net-shard",
    "toyos-net-shard/tcp",
    "toyos-net-shard/testnet",
    "toyos-net-udp",
    "toyos-net-wire",
    "toyos-osrelease",
    "toyos-phys",
    "toyos-quiesce",
    "toyos-random",
    "toyos-rootimage",
    "toyos-sha2",
    "toyos-smmu",
    "toyos-ssh",
    "toyos-swap",
    "toyos-symbols",
    "toyos-tco",
    "toyos-tmpdir",
    "toyos-trace",
    "toyos-tsc",
    "toyos-untrusted",
    "toyos-update",
    "toyos-usbhid",
    "toyos-userbound",
    "toyos-virtio",
    "toyos-wallclock",
    "toyos-xhci",
    "toyos-xhci/sim",
    "userland/acpiserver",
    "userland/acpiserver-api",
    "userland/acpiserver/aml",
    "userland/calc",
    "userland/compositor",
    "userland/compositor/desktop",
    "userland/console",
    "userland/diskserver",
    "userland/doom",
    "userland/editor",
    "userland/filepicker",
    "userland/filepicker-api",
    "userland/files",
    "userland/fileserver",
    "userland/host",
    "userland/inspect",
    "userland/kernelprobe",
    "userland/logkeeper",
    "userland/logkeeper-api",
    "userland/metalprobe",
    "userland/netstack",
    "userland/netstack/mdns",
    "userland/netstack/node",
    "userland/paint",
    "userland/pkg",
    "userland/proctest",
    "userland/shell",
    "userland/snake",
    "userland/soundserver",
    "userland/soundserver/mixer",
    "userland/sprite",
    "userland/sshserver",
    "userland/supervisor",
    "userland/swap",
    "userland/symbolize",
    "userland/terminal",
    "userland/test-runner",
    "userland/toybox",
    "userland/toyos-font",
    "userland/toyos-window",
    "userland/trace",
    "userland/update",
    "userland/usbd",
]
default-members = ["."]
# Everything that keeps its own resolution. Each is excluded for a reason, and
# `src/hostws.rs` holds this list against the tree — an entry that stops naming
# a directory with a `Cargo.toml` under it is a red, so a stale excuse cannot
# outlive what it excused.
exclude = [
    # The Rust compiler/std fork: its own workspaces, its own lockfiles, and a
    # submodule this repository does not resolve for.
    "rust",
    # The C library, built into a sysroot with `--release` and its own
    # `panic = "abort"` profile, which cargo ignores in a member; its lock is one
    # of the sysroot key's inputs (`src/sysroot.rs`).
    "userland/libc",
    # Guest programs `src/build.rs` builds for `x86_64-unknown-toyos`, each from
    # its own directory but `tls-multi-crate/dep`, its parent's dependency: the
    # first patches memmap2 and `tls-cranelift` target-lexicon, and a `[patch]`
    # is the whole workspace's. Named, and not `tests/` whole, so the gate finds
    # a host test under `tests/` that joined neither list.
    "tests/toyos-rust-tests",
    "tests/toyos-rust-tests/tls-cranelift",
    "tests/toyos-rust-tests/tls-dlopen-lib",
    "tests/toyos-rust-tests/tls-lib",
    "tests/toyos-rust-tests/tls-multi-crate",
    "tests/toyos-rust-tests/tls-multi-crate/dep",
]

[package]
name = "toyos-build"
description = "The build system: toolchain, kernel, bootloader, userland and image, the QEMU harness, CI jobs, and the gates the tree is held to."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# `src/bin/toyos-metal.rs` is a second binary of this package, so a bare
# `cargo run` would otherwise be ambiguous — and that command is the dev loop.
default-run = "toyos-build"

[dependencies]
fatfs = "0.3.6"
fontdue = "0.9"
gpt = "3.1.0"
libc = "0.2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcachefs = { path = "bcachefs" }
toyos-abi = { path = "toyos-abi" }
# What `build::syscall_entry_bytes` finds a staged kernel's entry with: its
# segments, and its symbol table where the kernel's own backtrace finds it.
toyos-elf = { path = "toyos-elf" }
toyos-symbols = { path = "toyos-symbols" }
toyos-fat32 = { path = "toyos-fat32" }
# The two readers `image::certify` judges every published image with. They are
# dependencies of the build rather than of its tests because a flash target is
# not published until they have both passed on it.
toyos-fat32-check = { path = "toyos-fat32/check" }
toyos-gpt = { path = "toyos-gpt" }
toyos-keymap = { path = "toyos-keymap" }
# The form a program's line takes in a boot's log and the port `logkeeper` serves it
# on, so the judges reading the log and `logkeeper` writing it read one declaration.
toyos-logstream = { path = "toyos-logstream" }
toyos-manifest = { path = "toyos-manifest" }
toyos-osrelease = { path = "toyos-osrelease" }
# The shutdown's stop record: the kernel renders it and this crate reads it back
# off a stick, so one declaration is what both sides spell it with.
toyos-quiesce = { path = "toyos-quiesce" }
# The swap port's name and the one program the image may give it to, so the
# gate on every manifest reads what the supervisor reads.
toyos-swap = { path = "toyos-swap" }
# The watchdog's parameter name, so the gate over `kernel/src/params.rs` reads
# the same constant the kernel and the bootloader do.
toyos-tco = { path = "toyos-tco" }
# The one scratch directory, under `$TMPDIR` or, for a socket, `/tmp`: the harness's run takes one, and so does
# every test here; `--ci host` holds the host tests to leaving nothing behind.
toyos-tmpdir = { path = "toyos-tmpdir" }
toyos-blackbox = { path = "toyos-blackbox" }
# The signed image, the slot table and the signer: `src/signing.rs` signs with
# the same crate the loader and `/system/bin/update` verify with.
toyos-update = { path = "toyos-update", features = ["sign"] }
# A throwaway key's seed, from the operating system. Already resolved here.
getrandom = "0.3"
# The one `openssh-key-v1` reader and writer, shared with the SSH server's
# host key, and the `SHA256:` fingerprint the owner's key is named by.
toyos-ssh = { path = "toyos-ssh" }
# `classify`, so the host reading a log volume and `logkeeper` writing it cannot
# disagree about which files on it are `logkeeper`'s.
toyos-wallclock = { path = "toyos-wallclock" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Every SHA-256 the build takes: `NOTICE`'s record of a committed file, a
# store key, a ROOT's name, a release asset's digest, and the harness's of a
# body a guest fetches over TLS.
toyos-sha2 = { path = "toyos-sha2" }
# The toolchain release's tarball, packed in-process (`src/release.rs`): Rust's
# own tar and gzip, where the binaries are hosts' tools.
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Every request the build system makes, GitHub's API and the crates.io index,
# where curl is a host's tool: rustls on ring, the one TLS provider the tree
# takes (`issues/the-internet-clients-work-unchanged.md`), whose C
# and assembly the host's `cc` compiles.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The commit an image is built from, its time and whether the tree is that
# commit's, where `git` is a host's C tool (`src/build.rs`'s `release`).
gix = { version = "0.88", default-features = false, features = ["status", "sha1"] }
# The authorities `build::trust_roots` writes to ROOT, as the rustls project
# publishes the Mozilla root program, and the PEM it writes them in.
webpki-root-certs = "1"
pem = "4"

[dev-dependencies]
# `USER_TOP`, so the harness judges a held `rsp` against the bound the kernel
# checks every user pointer against and not against a second copy of it.
toyos-userbound = { path = "toyos-userbound" }
# The scheduler's quantum and the windows' hold, so the harness judges a boot
# against the constants the kernel schedules by.
kernel = { path = "kernel" }
# The Bulk-Only phases, so the harness judging a wedge reads the word
# `toyos_xhci::bot::Phase` declares instead of spelling it a second time.
toyos-xhci = { path = "toyos-xhci" }
# The ACPI server's count line, so the judge reads the words the server writes
# and the job that waits for them matches.
acpiserver-api = { path = "userland/acpiserver-api" }
# `common::https`'s server, the peer a guest's HTTPS client is judged
# against, and the authority and certificates it presents, made per run.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"

[patch.crates-io]
loom = { git = "https://github.com/ToyOSOrg/loom", branch = "toyos" }
# ToyOS's own crates: the forks below depend on these by version so they can be
# consumed as git dependencies (a path escaping the fork's own repo cannot
# resolve once cargo checks it out alone). These redirects keep local builds
# on the working tree.
toyos-abi = { path = "toyos-abi" }
toyos = { path = "toyos" }
toyos-window = { path = "userland/toyos-window" }
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2-sdk-0.12", package = "getrandom" }
getrandom_03 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.3-sdk-0.12", package = "getrandom" }
getrandom_04 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.4", package = "getrandom" }
mio = { git = "https://github.com/ToyOSOrg/mio", branch = "toyos" }
tokio = { git = "https://github.com/ToyOSOrg/tokio", branch = "toyos" }
russh = { git = "https://github.com/ToyOSOrg/russh", branch = "toyos" }
russh-cryptovec = { git = "https://github.com/ToyOSOrg/russh", branch = "toyos" }
socket2 = { git = "https://github.com/ToyOSOrg/socket2", branch = "toyos" }
raw-window-handle = { git = "https://github.com/ToyOSOrg/raw-window-handle", branch = "toyos-0.6.2" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0" }
softbuffer = { git = "https://github.com/ToyOSOrg/softbuffer", branch = "toyos-0.4.8" }
winit = { git = "https://github.com/ToyOSOrg/winit", branch = "toyos-0.30.13" }
ring = { git = "https://github.com/ToyOSOrg/ring", branch = "toyos-0.17.14" }

# The one profile every guest binary is built with.
# Optimised, because an unoptimised guest mismeasures everything under TCG;
# debug-assertions and overflow-checks on, because fail-fast beats speed here.
# `--release` would turn the last two off silently.
#
# `incremental` stays at the dev default (on), which switches rustc's MIR
# inliner off for every guest crate — LLVM inlines regardless, and a
# non-incremental kernel edit loop measures 4-10x the wall clock. A codegen
# backend with no inliner of its own (cranelift) reopens that trade.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 2

# The test harness is a compute-bound host program, not a debug build of the
# thing under test: it decodes a 2.07 M-pixel screendump per poll and formats a
# 300 MB disk image per boot. No guest is built with this: the kernel, the
# loader and userland take `[profile.toyos]`. `debug` stays on (the dev
# default), so LLDB still works on it.
#
# It reaches every member's host tests rather than the harness alone. Nothing
# fail-fast is traded for it — `opt-level` does not
# touch `debug-assertions`, which cargo still passes as `on` (checked with
# `cargo build -p toyos-fat32 -v`), and rustc derives `overflow-checks` from
# that.
#
# **One member depends on this line for correctness rather than for speed, and
# its own manifest says so at length — this is the other half of that
# citation.** `kernel-loom`'s models run on the 32 KiB coroutine stacks
# `generator` gives loom's threads, with a 4,416-byte `Shard` and kilobyte
# `LogRecord`s passing through them; at `opt-level = 0` the per-temporary copies
# overflow one before the first assertion. Lowering the number here does not
# make those models slower, it stops them running. A member's own `[profile]`
# table cannot rescue it: cargo ignores one in a member, and `src/hostws.rs`
# reds on it.
[profile.dev]
opt-level = 2

[[test]]
name = "toyos-build"
path = "tests/toyos.rs"
harness = false

[[test]]
name = "toyos-checks"
path = "tests/checks.rs"
