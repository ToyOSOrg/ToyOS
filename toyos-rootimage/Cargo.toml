# A member of the host workspace (root `Cargo.toml`), like toyos-bootmap: the
# bootloader and the kernel depend on it by path and its tests run on the host.
# What lives here is every decision ROOT in memory makes — which partition the
# loader reads, how it reads it off firmware block I/O, and whether the extent
# the kernel is handed is one it may keep — decisions whose only other
# instrument is a real machine's firmware.

[package]
name = "toyos-rootimage"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
