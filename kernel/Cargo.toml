[package]
name = "kernel"
description = "The ToyOS kernel: resource management, scheduling, process lifecycle, filesystem and device arbitration."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Declared, never enabled here: `kernel-loom` compiles `src/sync.rs` into its own
# crate with this on, so the file's atomics and its cell resolve to loom's.
# A kernel build cannot enable it — the kernel does not depend on loom — and it
# is declared only so `cfg` checking knows the name.
loom = []
# Declared, never enabled here, and never enabled by any *kernel* build:
# `kernel-loom` turns it on to remove the two `SeqCst` fences, and
# `kernel/loom/tests/log_wake.rs` must red when it does. A model that has never
# failed proves nothing, and no guest test can stand in for it — on x86 a build
# with either fence removed behaves identically, which is the whole reason the
# obligation is a model.
wake-fence-off = []
# The same for the panic console's published descriptor: `kernel-loom` turns it on
# to drop the publisher's `Release` fence from `seqlock.rs`,
# and `kernel/loom/tests/panic_console_publish.rs` must red — a reader keeping a
# descriptor that is half one publication and half the next.
seqlock-writer-fence-off = []
# The same for the console backend's lock: `kernel-loom` turns it on to build
# `drivers/serial_lock.rs`'s `try_lock` with `then_some`, whose lost exchange
# releases the holder's lock, and `kernel/loom/tests/serial_lock.rs` must red.
serial-try-lock-then-some = []
# The same arrangement for a poll ring's one-shot answer: `kernel-loom` turns it
# on to split `inbox/once.rs`'s exchange into a load and a store, and
# `kernel/loom/tests/poll_once.rs` must red when it does — a poll two posts
# both answer.
poll-fire-load-store = []
# The same for a poll ring's answer: `kernel-loom` turns it on so
# `inbox/polls.rs` answers a fired poll without looking at its object again,
# and `kernel/loom/tests/inbox_answer.rs` must red — a post with nothing to
# read, answered.
post-is-an-answer = []
# The same arrangement, five more times, one per `kernel-loom` model that had
# no control of its own until 2026-08-17. Each is declared here and never
# enabled here; `kernel-loom` turns exactly one on at a time and the named
# model must red. None costs a kernel build — no kernel `cargo test`
# invocation names any of them, for `loom`'s reason.
#
# `src/sync.rs`'s two loads of `now` go `Relaxed`, and `ticket_lock` reds.
lock-acquire-off = []
# `src/sync.rs`'s `owed_fence` is dropped from both sides of `OwedLock`, and
# `owed_lock` reds.
owed-fence-off = []
# `src/sched/reap_gate.rs`'s `raise` store goes `Relaxed`, and `reap_gate`
# reds.
reap-raise-relaxed = []
# `src/shootdown.rs`'s `serve` reads what it owes `Relaxed`, and
# `tlb_shootdown` reds.
shootdown-serve-relaxed = []
# `src/shootdown.rs`'s `served` reads `Relaxed`, and `counters_round` reds.
shootdown-served-relaxed = []
# `src/log/shard.rs`'s publishing store goes `Relaxed`, and `log_record` reds.
log-commit-release-off = []
# `src/log/registry.rs`'s pointer store and load go `Relaxed`, and
# `log_publish` reds.
shard-publish-relaxed = []
# `src/pcidev/record.rs`'s read-modify-writes become a load and a store, so a
# message the ISR records between a reader's two halves is lost, and
# `device_irq` reds. They *are* the record's design, so turning them off reverts
# the whole of what the model claims.
device-irq-lossy = []
# `src/sched/dump_request.rs`'s `take` and `end_report` go `Relaxed`, so the next report
# is unordered against the last one's writes, and `dump_request` reds.
dump-report-relaxed = []
# The same arrangement for the sleep lock's acquire edge, and it is the first
# *contended*-acquire model this tree has: `src/sleeplock.rs`'s two loads of
# `now` — the ones that decide whose turn it is — go `Relaxed`, so the previous
# holder's writes are unordered against the next holder's reads, and
# `kernel/loom/tests/sleep_lock.rs` reds. `Lock::lock`'s spin is unreachable by
# loom (`src/sync.rs`'s `ACQUIRED` says so at the site); a parking acquire has
# no unbounded branch, which is what makes this one modellable at all.
sleeplock-acquire-off = []
# The same arrangement for the CPU roster's publication edge: `src/smp_roster.rs`'s
# `commit` publishes the count with a `Relaxed` store instead of the release the
# slot store needs, so a reader can see a count over an unfilled slot, and
# `kernel/loom/tests/smp_bringup.rs` reds.
roster-commit-relaxed = []
# The same for the release/answer word: `src/smp_roster.rs` grows the base's
# second store back, so a shootdown can see the machine released while it is not
# yet answering, and `kernel/loom/tests/smp_bringup.rs` reds.
smp-ready-split = []
# The scheduler core's loom controls: `kernel-loom` compiles `pure/sched/`
# into its own crate and turns each on, one at a time; declared here only so
# `cfg` checking knows the names.
#
# The doorbell's kick-pending edge in `pure/sched/mailbox.rs`'s
# `Doorbell::ring` goes `Relaxed`, and `kernel/loom/tests/loom_sleep.rs` must
# red — the sleep handshake's own negative control.
doorbell-kick-relaxed = []
# The `SeqCst` fence `pure/sched/cpu.rs`'s `balance_fence` puts between the push
# half's surplus store and its read of a target's SLEEPING bit is weakened, and
# `kernel/loom/tests/loom_push.rs` must red — `Balance::PushOnSurplus`'s own
# negative control.
push-fence-relaxed = []
# `pure/sched/task.rs`'s `begin_commit` goes blind to the notified bit — a post
# landing between a waiter's registration on a watch and its commit is lost —
# and `kernel/loom/tests/loom_watch.rs` must red.
commit-ignores-notify = []
# `pure/sched/task.rs`'s notify answers a post that finds its bits already set
# off a load rather than a read-modify-write, and
# `kernel/loom/tests/loom_watch.rs` must red.
notify-flag-load-only = []
# The two `SeqCst` fences of `pure/sched/watch.rs`'s `Gate` go, and
# `kernel/loom/tests/loom_watch.rs` must red — the stop's store-buffering pair.
gate-fence-off = []
# The staleness test's negative control: `pure/sched/cpu.rs`'s
# `CpuHandle::answering` answers `true` for every CPU under it, which is what
# every path that chooses a CPU believed before it existed. `kernel-sim`'s
# `a_stopped_cpu_stops_taking_work` must red when it is on. No kernel build
# selects it, and one that did would place tasks onto CPUs that never pick
# them up.
placement-ignores-staleness = []
# Compiles the escape hatch `kernel-sim`'s `old_steal_port` needs to re-create
# the OLD scheduler's steal-in-transit algorithm. The simulator enables it; no
# kernel build does.
protocol-port = []
# `pure/pcid/`'s negative control: it reverts `PcidPool` to the bare monotonic
# counter that wrapped at 4095 and reissued a live tag, and the isolation tests
# red under it. Never a default and reached by no kernel build.
counting-allocator = []
# The process lifecycle's controls (`pure/proclife/`), declared for the
# library's own tests and never enabled by any kernel build: each reverts one
# decision to the form this kernel really had, so the host model that refuses
# it is shown able to red at all. `src/ci.rs`'s `CONTROLS` runs each and
# demands the named test's own FAILED line; `src/build.rs`'s
# `every_model_control_is_run` reds on a control declared with no row behind
# it.
#
# `teardown::claim_teardown` stops being exclusive: every arrival wins. An exit
# and a kill then both tear one process down, both retire its threads and both
# publish an exit — which `ProcessObject::publish_exit` asserts against at run
# time, in a guest, on whichever boot the two happen to meet.
# `interleave::tests::an_exit_and_a_kill_never_both_tear_a_process_down` must
# red under this, and it does so in every ordering rather than in one.
mutate-claim-teardown-always-wins = []
# `spawn::admit_thread_insert` stops re-reading the teardown claim, so the
# question is asked once — at the top of `process::spawn_thread`, before the
# TLS block, the kernel stack and the scheduler record are built. Everything
# that makes a thread happens in that window, and teardown claims the process
# under the very lock the insert takes. `interleave::tests::a_published_exit_
# leaves_no_unretired_thread` must red under this.
mutate-spawn-skips-the-insert-recheck = []
# The model's kill waits for its victim's exit before it returns.
# `interleave::tests::two_processes_killing_each_other_both_end` must red under
# this: each killer waits on a process whose thread is inside the other's kill.
mutate-kill-waits-for-its-victims = []
# `teardown::leave` answers `Last` to every thread that leaves a claimed
# process, so the first one out tears it down under its siblings.
# `interleave::tests::an_exit_and_a_kill_never_both_tear_a_process_down` must
# red under this.
mutate-first-out-tears-down = []
# `teardown::leave` marks the last one out dead before its teardown runs, so
# the machine's stop finds nothing running while that teardown frees and logs.
# `interleave::tests::the_last_one_out_is_in_its_process_until_its_teardown_is_done`
# must red under this.
mutate-last-out-leaves-before-its-teardown = []
# `join::collect_zombie` gives up a thread of a process being torn down, whose
# mappings its siblings may still run in.
# `interleave::tests::a_join_racing_the_kill_that_takes_its_target` must red
# under this.
mutate-join-collects-in-a-teardown = []
# `tree::land_child` stops re-reading its place's claim, so a spawn admitted
# before a kill lands unclaimed under the place after the walk read its children.
# `interleave::tests::a_spawn_racing_its_places_kill_leaves_nothing_under_it_and_publishes_it`
# must red under this.
mutate-place-skips-the-insert-recheck = []
# `tree::refuse_child` keeps a failed spawn's hold on its place, which then
# waits for a child that will never be and is never published. The same test
# must red under this.
mutate-refused-spawn-keeps-the-count = []
# `tree::land_child` claims a child landed under a place claimed since its
# admission and answers no thread to retire, so the child runs on claimed, is
# never torn down, and holds its place unpublished.
# `interleave::tests::a_spawn_racing_its_places_kill_leaves_nothing_under_it_and_publishes_it`
# must red under this.
mutate-landed-child-retires-nothing = []
# `tree::teardown_done` publishes an end with its own teardown, whatever is
# still unpublished below it. `interleave::tests::an_exit_publishes_after_every_end_below_it`
# must red under this.
mutate-publish-before-the-children = []
# The model's walk claims everything it owes in one lock section, as a kernel
# that held `PROCESS_TABLE` across its walk would.
# `interleave::tests::a_spawn_under_an_unrelated_process_lands_between_two_claims_of_one_walk`
# must red under this.
mutate-walk-in-one-hold = []
# The model's spawn mints its caller's handle to the child once the spawn has
# landed and its retires are posted, as a kernel that installed it after
# `loader::spawn` returned would: a child claimed as it lands closes its table,
# its own `self` with it, before that.
# `interleave::tests::a_spawn_racing_its_places_kill_leaves_nothing_under_it_and_publishes_it`
# must red under this.
mutate-spawner-handle-after-the-landing = []
# The model's spawn mints its caller's handle to the child under the caller's
# lock and the child's own once that lock is given up, as a kernel whose commit
# installed the one before it minted the other would: another thread of the
# caller closes the only handle the object has.
# `interleave::tests::a_sibling_closing_a_spawns_handle_before_the_spawn_returns`
# must red under this.
mutate-spawner-handle-before-the-childs-own = []
# **Every actuator, and which one is armed comes from the boot parameter.**
# `kernel/src/actuator.rs` declares every one of them with the claim each rests on; this
# name is the whole of what a build decides about them. A kernel without it has
# no arm set, no name and no parser, every accessor is `const fn … { false }`,
# and a constant an actuator moves is still a constant.
#
# Until 2026-08-10 each of these was a cargo feature and therefore a kernel
# build: 45 in a full `cargo test`, ~6.9 s of wall clock and ~29.6 s of CPU
# each after any kernel edit.
boot-actuators = []
# **`SYS_DEBUG` and every actuator reachable through it, and nothing a boot
# runs.** A kernel carrying this boots, schedules, drives its devices and panics
# exactly as a kernel carrying none does; what it has in addition is a syscall
# number that answers, and every action behind it is a state the host cannot
# stage. A kernel *without* it has no debug syscall at all — the number falls to
# the dispatch's default and answers `InvalidArgument`, which is what an
# unassigned number answers.
#
# One name rather than seven, because a feature set is a whole kernel build and
# builds that differ only in which unreachable arm they carry are several builds
# of one kernel. The per-action justification — what nothing else can reach — now
# lives beside each arm in `syscall/dispatch.rs`, which is the file that
# has to stay true when an arm changes.
#
# The one place it is not confined to the match: `arch::tlb::serve_ipi` loads one
# relaxed word per flush. Nothing writes that word except action 12, so a kernel
# carrying this and never asked flushes exactly as one without it — stated rather
# than assumed, because that claim is what makes the split below sound.
#
# **Separate from `boot-actuators` on purpose.** A diagnostic image the owner
# flashes wants `diag-tick`; it must not also gain a debug
# syscall, which is what folding the two into one name would give it.
test-actuators = []
# The debugger's spin gate, and the one thing `--debug` compiles in. Not a boot
# parameter: it would then have to live in the shipping kernel, and what
# `cargo run -- --debug` exists to debug is the kernel an image ships.
debug-wait = []
# The on-target half of the scheduler's invariants.
# Asserts container-vs-state-word agreement and invariant T at the end of every
# scheduler pass (`pure/sched/invariants.rs`), and asserts the pass itself fits
# `kernel::sched::cpu::MAX_PASS_NS` — the term the simulator's invariant I4
# leaves out, because a simulated pass costs nothing.
#
# Off by default because it is not free: each pass gains a walk of this CPU's
# ready queue and parked map plus a second clock read, and that lands on the
# audio path. A bring-up, bisect or bare-metal build wants it; a build being
# measured does not.
sched-check = []
# The longest interrupts-off and preemption-off window each CPU closed since the
# last report, printed beside the IRQ census (`src/windows.rs`). Its own build
# because it reads the counter at every masking transition and every preempt
# count crossing zero, on every entry and exit: a kernel being measured for
# anything else must not carry it.
mask-windows = []
# The stray-write tripwire on the per-CPU `CpuSched` record: a shadow copy of its
# bytes, taken when the driver's exclusive region is left and compared when it is
# next entered, so a word that changed while nothing was allowed to change it is
# reported as an offset, a field, a before and an after. `sched::driver`'s
# `tripwire` module and `kernel::sched::cpu`'s `tripwire` impl block carry the
# argument, and the four deaths it exists for are named there.
#
# **Not `sched-check`, and the distinction is the whole point.** That one asserts
# the scheduler's own invariants, every one of which holds perfectly well over a
# record a stray write has just landed in — the container and the state word
# agree, because the thing that disagreed is a `BTreeMap`'s root pointer or an
# `Option`'s niche. This one asks a question no invariant can: did these bytes
# change while nobody was allowed to change them.
#
# Off by default and never on in a measured build: a copy and a compare of ~300
# bytes at every entry to that region, which is every pass and every
# `running`-peek. It compiles readers and no decision, so a kernel carrying it
# schedules exactly as one without it.
sched-tripwire = []
# The tripwire one layer below `sched-tripwire`: a band of known bytes on each
# side of **every** heap allocation, read back when it is freed and, for the
# running task's kernel stack, at every scheduler pass. `kernel/src/mm/alloc.rs`
# carries the shape and what each side catches.
#
# **What it exists to separate.** `sched-tripwire` measured its subject and
# cleared it — the `CpuSched` byte shadow fired zero times in 7,136 boots, so
# the scheduler's own record is never written from outside and the deaths are in
# the heap its containers hang off. This asks the heap the same question: did
# anything write outside an allocation it owns. The head band is deliberately as
# wide as the request's alignment, so the kernel stacks — the one heap
# allocation this kernel runs a stack on — get 4096 bytes of it. `arch::percpu`
# gives every *idle* stack an unmapped guard page for exactly this reason, and
# says in its own words what the absence costs: an overflow that does not fault
# "used to land in the heap and be found later, somewhere else, as a corrupted
# allocation". Task kernel stacks never got one, because they come out of the
# heap.
#
# Not `dlmalloc/debug`, and that is a measurement rather than a preference:
# Doug Lea's own checker walks all 64 bins and every chunk of every segment at
# the head of every `malloc` and `free` — O(heap) per allocation on a heap that
# reaches several MiB, which is the right oracle at a price a TCG boot storm
# cannot pay.
#
# Not a boot parameter, and the one that could not be: the bands change what
# `GlobalAlloc::alloc` returns, so an allocation minted under one arm and freed
# under the other is a miscomputed base address. A runtime switch would have to
# be a branch at every allocation in the machine.
#
# Off by default and never on in a measured build: every allocation grows by
# `align + 32` bytes and the pass path gains eight reads. No suite builds it —
# it is not in `TEST_SUITE_KERNEL_BUILDS`, so a full run pays nothing for it and
# a boot storm asks for it by name.
heap-tripwire = []
# Read every live band in the heap, at a point of the kernel's choosing rather
# than at the free that may never come. `kernel/src/mm/alloc.rs`'s `sweep`
# carries the walk and why it needs no registry of live allocations.
#
# **It exists because `heap-tripwire` answered too well.** Under it the class
# stopped happening — 7,205 boots against a rate that expected twelve deaths —
# and *no band fired*. That silence separates nothing: a band is read at
# `dealloc` and, for the running task's kernel stack, at every pass, and an
# allocation live from early boot to `compositor: ready` is never freed inside a
# boot, so its band is never read at all. A write the bands absorb and a write
# they displace look identical. This reads them, every 25 ms of guest time, and
# turns "no band fired" into either a named victim or a real negative.
#
# **And it is itself an amplifier, measured.** Same tree, same bands, differing
# only in this feature: 0 deaths in 7,211 boots without it, 9 in 7,040 with it.
# It compiles no decision — what it does is hold `dlmalloc`'s lock on the pass
# path for a walk of every heap page, which is the same shape as
# `sched-tripwire`'s unexplained 7.2x. Two arms being compared must carry the
# same instruments.
heap-sweep = ["heap-tripwire"]
# The two band shapes that separate absorb from displace, one side at a time.
# `kernel/src/mm/alloc.rs`'s `tripwire` module carries the table.
#
# The padding *is* the displacement, so no band can be made zero-width and keep
# its placement — which is why the separation is per side. `notail` leaves the
# slack past every payload byte-for-byte what an unbanded build has, so deaths
# returning under it name a forward overrun. `nohead` puts the payload at the
# bottom of its own chunk and moves the record above it, asking `dlmalloc` for
# the same outer size as the default shape, so deaths returning under it name a
# write below an allocation. The two are one experiment in two arms and refuse
# to build together.
#
# **Measured 2026-08-21, and it answered `displace`.** Against a same-session
# unbanded baseline of 6 deaths in 7,251 boots: `notail` 0/7,011, `nohead`
# 2/7,102, the default shape 0/7,211. Taking the tail slack away was supposed
# to bring the deaths back and took them to zero instead, so the band width is
# not what governs the rate — the layout it happens to produce is.
heap-band-notail = ["heap-tripwire"]
heap-band-nohead = ["heap-tripwire"]
# **Who else is standing on this stack.** The class's first non-random
# fingerprints are both *kernel text* words inside kernel data — a
# `0xffff8000_7cae_3310` written over `MscDevice::block` identically in two
# independent boots, and a task kernel stack holding `stack_top + 16` one word
# above its own top — and a mid-function text address in a data field is a
# return address, which means something executed with that address as its stack
# pointer.
#
# So this asks the two questions a corrupted word cannot answer for itself.
# `sched::driver`'s `check_stack_ownership` compares, at every pass, the two
# words that aim a Ring 3 entry at a stack — `percpu.kernel_rsp` and
# `tss.rsp0` — against the running task's own stack top, and this CPU's `rsp`
# against that stack's bounds; `drivers::xhci::wait::msc`'s `BlockWitness`
# snapshots the one field that has been seen changing inside a single call and
# names the frame, the depth and the value when it does.
#
# Its own build and not a boot parameter, for `heap-tripwire`'s reason turned
# around: the driver half is a comparison on the block path and the scheduler
# half is three comparisons on the pass path, so a kernel carrying it is not
# the kernel a rate was measured on and it has to be in *both* arms of any
# comparison. It compiles no decision — every line is a reader and a panic.
stack-witness = []
# **The seven words, and the pointer to them.** Every instrument this class owns
# asks its question at `hw::check_switch_frame`, which reads `ctx.rsp`, tests it
# and returns it; the frame is popped in `sched::driver::context_switch` a few
# hundred instructions later, past the preempt swap, the TSS handover, a
# `mov cr3` and an FS-base write, and nothing between them tests anything. 18,064
# boots of `stack-witness` say the value the check sees is always sound, and one
# parked guest says the value the `popfq` used was not — a frame at
# `0xffff800000c00640`, inside the per-CPU region, which every check that runs at
# the check would have passed.
#
# So this copies the eight words at the check and compares them from inside
# `context_switch`, one instruction after `mov rsp, rsi` and one before the first
# `pop`, against the stack pointer the machine is standing on. It reads `ctx.rsp`
# there too, and the two are separate claims: that the machine stands on the word
# the check validated, and that nothing wrote the field in the window. They used
# to be one claim, and it did not hold — `Hw::switch` loaded that field **twice**,
# the `mov cr3` between them forbidding the compiler from forwarding the first, so
# the value switched onto was not the value validated. `hw::check_switch_frame`
# now returns the word it validated and there is one load; this is what says so at
# run time.
#
# It turns on `stack-witness` rather than standing alone, and that is a soundness
# requirement and not a preference: the compare is a `call`, whose return address
# lands eight bytes below the frame, so the frame has to be inside a real stack
# before the call happens. `stack-witness`'s third test is what establishes that.
switch-witness = ["stack-witness"]
# The negative controls — `kernel/src/arch/x86_64/hw.rs`'s `switch_witness_mutate` carries
# what each stages. One write per boot, at the ninth switch (`MUTATE_AT`, and
# small because it was measured): `frame` writes the `rbx` slot of a frame the
# check has just validated, and is the control for the instrument — a witness that
# does not fire under it has not been shown to be able to fire at all. `rsp` moves
# the field up by eight after the check, and is the control for the **single
# load**: the switch stands on the validated word, so the report says `THE SAME`
# with the field `CHANGED SINCE THE CHECK`. A switch that re-read the field says
# `MOVED` instead, which is what this tree printed before the load was made one.
switch-witness-mutate-frame = ["switch-witness"]
switch-witness-mutate-rsp = ["switch-witness"]
# **Is this kernel running with the direction flag set.** No gate clears `DF`:
# an interrupt or trap gate clears `TF`, `NT`, `RF`, `VM` and `IF`, and `SYSCALL`
# clears exactly what `IA32_FMASK` names. `compiler_builtins::mem::memmove`'s
# overlapping-copy path is `std` … `rep movsb`/`rep movsq`/`rep movsb` … `cld`,
# three string operations wide with interrupts enabled for all of it — so before
# `arch::entry`'s `cld` a timer tick landing inside a large overlapping copy
# handed the kernel a set `DF`, and every `memcpy`, `memset` and forward
# `memmove` after it wrote the `n` bytes *below* its destination.
#
# `arch::cpu::df_witness` asks at a scheduler pass, at `trap_dispatch` and at
# `syscall_handler`, and panics naming the site. It is the negative control for
# the fix in both directions: on a kernel without the `cld` it fires, and on one
# with it, it must not. Its own build because it is a `pushfq` and a test on three
# hot paths, so a kernel carrying it is not the kernel a rate was measured on.
df-witness = []
# The witness's own control: a `std` one instruction before the reader that must
# refuse it, at `sched::driver::pass`. An instrument that has never fired has not
# been shown able to, and this one fired zero times in 2,463 boots of an
# `entry-df-unclean` kernel — which is a fact about *where* the flag reaches, and
# would be indistinguishable from a broken reader without this.
df-witness-mutate = ["df-witness"]
# **The kernel this tree had before the `cld`**, and the only way to have a
# negative control for it: `arch::entry::ring3_naked_asm` drops the instruction
# and `arch::syscall::init` puts `DF` back out of the `SYSCALL` mask, so a build
# carrying this inherits a set direction flag from whatever it interrupted
# exactly as every kernel before 2026-08-21 did.
#
# It replaces the *behaviour* and not a verdict: everything else about the entry — the pushes, the FP
# bracket, the preempt count, the exit-to-user check — is the shipped one, and
# what is absent is one instruction. A control that flipped an assertion would
# make its own gate vacuous.
#
# Measured 2026-08-21, twelve-wide `bootable.img` boot storms, thirty minutes
# each, `sched-tripwire stack-witness` in both arms, silent deaths counted by
# parking the guest on its reset action and reading the vCPUs over QMP:
# **17 deaths in 7,059 boots with this on, 0 in 7,418 with it off**
# (Poisson, expected 17.86, p = 1.7e-8).
entry-df-unclean = []
# The amplifier's own control, in two arms that differ by one lock.
#
# Two instruments now multiply this class and neither writes anything a machine
# reads: `sched-tripwire`'s byte shadow (7.2x) and `heap-sweep`'s walk (absent
# to baseline). What they share is time spent on the path every scheduler pass
# takes; what only the sweep adds is `dlmalloc`'s lock held across that time.
# Nothing has ever separated the two. `pass-spin` spends `sched::driver`'s
# `HOLD_NS` on the pass path and takes no lock; `heap-lockspin` spends the same
# time holding the same lock the sweep holds. One `HOLD_NS`, two arms, and the
# answer says whether the window this class needs is the lock or the delay.
#
# Neither can be a boot parameter, for the reason none of the instruments above
# can: an arm is a whole kernel, and a branch at the site would put the arm's
# own cost into the arm it is being compared against.
pass-spin = []
heap-lockspin = ["pass-spin"]

[lib]
path = "pure/lib.rs"

# The library's tests run on the host; the binary builds for a bare target only.
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[dependencies]
toyos-abi = { path = "../toyos-abi" }

# The binary's alone, so a host build of the library compiles none of them.
[target.'cfg(target_os = "none")'.dependencies]
bcachefs = { path = "../bcachefs", default-features = false }
toyos-acpi = { path = "../toyos-acpi" }
toyos-dma = { path = "dma" }
toyos-blackbox = { path = "../toyos-blackbox" }
toyos-blockhold = { path = "../toyos-blockhold" }
toyos-bootmap = { path = "../toyos-bootmap" }
toyos-cpuvuln = { path = "../toyos-cpuvuln" }
toyos-fat32 = { path = "../toyos-fat32" }
toyos-elf = { path = "../toyos-elf" }
toyos-gicv3 = { path = "gicv3" }
toyos-gpt = { path = "../toyos-gpt" }
toyos-hda = { path = "../toyos-hda" }
toyos-pci = { path = "pci" }
toyos-tco = { path = "../toyos-tco" }
toyos-tsc = { path = "../toyos-tsc" }
toyos-ps2 = { path = "ps2" }
toyos-rootimage = { path = "../toyos-rootimage" }
toyos-quiesce = { path = "../toyos-quiesce" }
toyos-symbols = { path = "../toyos-symbols" }
toyos-untrusted = { path = "../toyos-untrusted" }
toyos-userbound = { path = "../toyos-userbound" }
