# A member of the host workspace (root `Cargo.toml`), like toyos-userbound and
# toyos-pci: it is pure, it has no dependencies, and its tests run on the host.
#
# What lives here is whether a register access a process named lands inside its
# window. `pcidev` is the only caller; it is a crate rather than a private
# function because the table of refusals costs milliseconds on the host and a
# boot in a guest.

[package]
name = "toyos-register"
description = "Whether a register access a process named lands whole inside its device's window, pure, forbid(unsafe_code)."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
