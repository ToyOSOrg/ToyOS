# A member of the host workspace (root `Cargo.toml`), like toyos-smmu: it is
# pure and its tests run on the host.
#
# What lives here is every word an AMD-Vi unit and its driver exchange. The
# unit decides which memory a device reaches, so a field one bit off is an
# isolation hole no boot shows. Each encoding is held on the host to AMD
# 48882's own field positions, and the kernel's `arch::x86_64::amdvi` is left
# the registers and the memory.

[package]
name = "toyos-amdvi"
description = "AMD-Vi's encodings: device table entries, host page table entries, commands, event records and register fields, pure, forbid(unsafe_code)."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
toyos-phys = { path = "../phys" }
