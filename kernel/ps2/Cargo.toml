# A member of the host workspace (root `Cargo.toml`): the kernel depends on it
# by path and its tests run on the host, with no target-triple juggling.

[package]
name = "toyos-ps2"
description = "PS/2 wire decoding: scancodes and mouse packets in, HID usages and pointer deltas out, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
