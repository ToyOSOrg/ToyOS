# A member of the host workspace (root `Cargo.toml`): the bootloader and
# `/system/bin/update` depend on it by path and its tests run on the host. It is
# every decision a signed image, a slot and its record make, so the loader and
# the updater cannot read one format two ways.

[package]
name = "toyos-update"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Signing, for the host that holds the key. Off in the loader and the updater,
# so no binary on the machine carries a path that makes a signature.
sign = []

[dependencies]
# **The one verifier, and why this one.** `ed25519-dalek` is the Ed25519 the
# Rust ecosystem ships (RustCrypto's `ssh-key` and `russh`, which this tree's
# sshd already runs, verify with it), it is `no_std` without `alloc`, and it
# is already resolved in the userland lockfile at this version. No default
# features: no `std`, no precomputed tables (a verify is one per boot), no
# `zeroize` (the machine holds no secret key). Verified with `verify_strict`,
# which refuses the small-order and non-canonical encodings RFC 8032 §5.1.7
# leaves to the implementation.
ed25519-dalek = { version = "2.2", default-features = false }
# SHA-256 over the sections and SHA-512 over the signed header, as SSHSIG
# names it. Already resolved in every lockfile that builds this crate.
sha2 = { version = "0.10", default-features = false }
