# A member of the host workspace (root `Cargo.toml`), like toyos-i219 and
# toyos-hda: it is pure, and its tests run on the host with no guest and no
# QEMU.
#
# What lives here is what every virtio driver in userland decides before its
# own device type begins — where the device's structures are, what was
# negotiated, what a used-ring element is allowed to say — against two traits
# the driver's program implements one instruction deep. The device is on the
# far side of a trust boundary, so its registers and its used ring have to be
# driven with values no working device would write far more often than a boot
# allows; the specification is the oracle and `stub.rs` is what it is written
# into.

[package]
name = "toyos-virtio"
description = "The virtio 1.2 PCI transport and split virtqueue: every decision a driver makes about them, and none of the instructions that carry them out, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The type a used-ring element's two fields stay in until each has met its
# bound.
toyos-untrusted = { path = "../toyos-untrusted" }
# `Registers` and `DmaBuffers`: the boundary every userland driver is written
# against, and the order of its two barriers.
toyos-device-memory = { path = "../toyos-device-memory" }
