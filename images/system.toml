# sshserver is deliberately not in `[boot] start`. It is built into the image and
# started by hand (`detach /system/bin/sshserver`, so it outlives the shell) on a
# machine that wants remote access: it listens on every interface, so carrying
# it in every boot is a listening port nobody asked for.
# `build/build.rs`'s `no_shipped_boot_config_starts_sshserver` is the gate.

# `assets/soundfont.sf2` is in here and is doom's music: GeneralUser GS cut down
# to the 37 melodic programs and 23 percussion keys `assets/DOOM1.WAD`'s own MUS
# headers select, by `build/soundfont.rs`. `NOTICE` carries its licence, the
# provenance caveat that comes with it, and the zero-byte OPL3 path that may one
# day delete it.
assets = ["assets"]

# **Floors are the machine's protected capacity**: memory held back for a
# control path's job however short every other job runs. Only a job that does
# no ordinary client work gets one: the supervisor and ps2server. A floor
# covers what the job holds as it runs, its 8 MiB main stack's commitment
# among it, and the headroom it needs to keep answering. usbd has none, since
# it drives disks too, so a USB keyboard is not protected
# (`issues/no-physical-memory-fairness.md`).
[supervisor]
memory-floor-mib = 96

# What the supervisor starts at boot. Program keys, not paths, and the order means
# nothing: every port exists before any server runs.
[boot]
# `filepicker` is a `serves` daemon like the three beside it: a machine-wide
# port with one server, started where every other one is. It was called interim
# while the compositor had no way to ask for a program's *declared* authority —
# the launcher gives it one, and starting a service from `[boot] start` is not
# the thing that needed fixing.
start = ["logkeeper", "diskserver", "fileserver", "compositor", "soundserver", "netstack", "filepicker", "acpiserver", "ps2server", "wlan"]

# What every program launched out of `/apps` holds, whatever its own directory
# says. A package is unpacked by `/system/bin/pkg` into a writable directory, so
# a row read out of one would be a directory deciding what the machine hands
# out; this is the image's answer, one for all of them. Connectors only —
# `devices` and `syscap` have no spelling here, so nothing installed claims
# hardware or enters the RT band — and no directory: a package sees its own
# `/apps/<name>` read-only and its own `/home/toy/Apps/<name>`, its `HOME`.
#
# `folder` is the most of a folder of the session's home a package may be
# granted (`/system/bin/grants`), and until a signed package entry carries a
# package's own request it is what every package asks for: read-write, since
# gbae saves beside the ROM it plays.
[apps]
receives = ["compositor", "soundserver", "filepicker"]
folder = "read-write"

# `service = true` makes a row a system service: the supervisor starts it with `HOME` at
# its own `/state/<name>` and makes that directory first. Every other row runs
# with the session user's home, and `state = true` gives it a `/state/<name>`
# beside it. No row's view holds any other part of `/state`.
[programs]
# The installer. It writes under `/apps` because `/apps` is writable to it.
# `/state/pkg` is where the machine's copy of the repository metadata it last
# accepted belongs (`toyos_update::repo::Holder::Machine`).
pkg = { state = true }

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and the console and writes no
# file at all, so a boot config without `logkeeper` is a boot whose `/log` is empty —
# `every_boot_config_runs_logkeeper` is what refuses one. It claims no device, and
# `log` is the port it answers `inspect` on.
[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log"]

# The machine's ACPI fixed hardware: the kernel puts the machine in ACPI mode
# when it mints the `acpi` claim and back when the claim goes, so the SCI,
# the power button and the embedded controller's events are this program's
# while it runs and the firmware's otherwise. The claim also hands it the
# firmware's own access: the kernel makes the AML's reads and writes for it,
# inside the fences of `toyos_userbound::firmware`. `power` is how a press
# stops the machine: through the supervisor, which has `logkeeper` make the
# log whole.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

# `starts` is what the desktop's taskbar and launcher start. `login = true`
# makes it the desktop's login authority: the supervisor opens the desktop
# session as it starts it, and its launches are that session's, so `swap` and
# `update` run from its shell. `prompt` is the layer above every window, which
# `filepicker` alone reaches: serving it makes the session opened for it the
# screen's, whose packages may ask the person at it for a folder. `clipboard` is sent every copy
# made in the session, and `vdagent` alone receives it. `input` is where a source
# of keys and pointer reports reaches the owner of input, which it is.
# `display` sets the mode and the scale, and `toybox` alone receives it, for
# `screen`. `volume` is soundserver's master level and mute, which the volume
# keys set and no other row receives. The display is a virtio-gpu function the
# compositor drives, where the machine has one, and the firmware's framebuffer
# otherwise; `display-output` is where a display driver offers the output it
# scans out and is told each frame composed into it. `jobs` makes each
# program it starts a job of its own, with its own share of the CPU. `power` is
# its stop view's: Esc cancels the machine's stop, Enter forces it.
[programs.compositor]
service = true
serves = ["compositor", "prompt", "clipboard", "input", "display", "display-output"]
receives = ["soundserver", "filepicker", "volume", "power"]
devices = ["pci:03:80:00/1af4:1050", "framebuffer"]
starts = ["terminal", "files", "/apps"]
syscap = ["jobs"]
login = true

# The i8042, driven from userland: its ports and its two lines are this
# program's `isa` claim, and the keys and pointer reports it decodes go to the
# owner of input over `input`, which no other row may receive
# (`build/build.rs`). Started again when it ends other than by exit 0, which it
# says only on a machine with nothing to serve.
[programs.ps2server]
restart = true
receives = ["input"]
devices = ["isa:0060,0064:1,12"]
memory-floor-mib = 24

# `wake-latency` holds every idle CPU to waking within half a period while a
# stream plays, so a CPU in a deep state does not make the mix late.
[programs.soundserver]
service = true
serves = ["soundserver", "volume", "sound-output"]
devices = ["pci:04:01:00/1af4:1059"]
syscap = ["rt", "wake-latency"]

# The Intel HD Audio driver: one process per HDA function the kernel does not
# drive, each walking its own controller's codecs and offering soundserver the
# output it reaches. A machine with display audio beside an analog codec runs
# two, and soundserver plays to the one that offers.
[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

# The Tiger Lake display driver: the T14's iGPU, held for the boot. It keeps
# the firmware's mode and surface, which the compositor draws on through the
# kernel's framebuffer claim, programs the display engine's power and answers
# the compositor's presents on `display-output`. Not started again: the
# claim's release resets the function, which ends the firmware's scan-out
# (`issues/each-gpu-drives-its-displays-from-a-userland-driver.md`).
[programs.tgl-display]
drives = ["pci:03:00:00/8086:9a49"]
receives = ["display-output"]

# The network stack, over every link a NIC driver brings on `link`; it claims
# no device. It serves from the start, links or none.
[programs.netstack]
service = true
serves = ["netstack", "link"]

# The NIC drivers: one process per function a row's parts match, by class,
# vendor and device rather than by slot, holding that function alone and
# bringing its link to netstack, which keeps every connection across a
# link's end. virtio's is started again when it ends other than by exit 0.
[programs.virtio-net]
drives = ["pci:02:00:00/1af4:1041"]
receives = ["link"]
restart = true

# The I219, the T14's onboard NIC, and the 82574, which QEMU's `e1000e` models.
# Not started again: its start resets the part, and over a ring a link change
# left it that reset is not known to be safe
# (`issues/no-machine-has-read-an-intel-nic-across-a-link-change.md`).
[programs.i219]
drives = ["pci:02:00:00/8086:15fc", "pci:02:00:00/8086:10d3"]
receives = ["link"]

# The Wi-Fi supplicant: it alone holds a network's passphrase and runs its
# handshakes, over each radio driver's connection to `radio`. `wifi` is how the
# settings programs ask it to scan, join and leave; only they hold it.
[programs.wlan]
service = true
serves = ["radio", "wifi"]

# The network settings program: `wifi connect <network>` reads the passphrase
# from standard input. A row of its own, so no toybox applet holds `wifi`.
[programs.wifi]
receives = ["wifi"]

# The shared clipboard with QEMU's host: one process per virtio-serial
# function the kernel does not drive (the kernel's console is `1af4:1043` too),
# holding the function its vdagent chardev is on, and the compositor's
# clipboard port. A machine with no such function, the T14 among them, starts
# none.
[programs.vdagent]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["clipboard"]

# A login authority: each authenticated connection opens a login session, and
# its shell, and a command as `shell -c`, is launched in it, the one `update`
# and `swap` below start in.
[programs.sshserver]
service = true
receives = ["netstack"]
starts = ["shell"]
login = true

# A login session's owner: the supervisor starts one for each session it
# opens, and it parents that session's detached apps and signs it out.
[programs.session]

# Its user's login sessions, listed or signed out: the one row the build lets
# receive `session-admin`. `launch logout 3 --force` ends session 3.
[programs.logout]
receives = ["session-admin"]

# The machine's disks and their tables, read: `launch disks`. Nothing here
# lets it change a disk; an authorization that does (`designate:data`) is the
# build's to refuse any row a login can start (`build/build.rs`), until the
# administrative authorization every system change will share exists.
[programs.disks]
authorize = ["tables"]

# `swap` is the authority to replace a running service's binary; the build
# refuses it to any other program (`build/build.rs`). `ssh <machine> swap netstack
# <sha256> <length> < netstack` runs it for a login.
[programs.swap]
receives = ["swap"]

# The idle slot: the slot table and the idle slot's two partitions, which the supervisor
# claims against the ROOT the kernel holds. The build refuses it to any other
# program; the owner's signature on the image is the authority to install it.
# `ssh <machine> update < image` runs it for a login.
[programs.update]
slots = true

# Which folder of the session's home an installed package is granted: the one
# row the build lets receive `grants`, which the supervisor answers from a login
# session alone. `grants add gbae /home/toy/Games` grants one from a shell.
[programs.grants]
receives = ["grants"]

# A name's addresses, asked of netstack's resolver: `netstack` is the whole of what it
# holds.
[programs.host]
receives = ["netstack"]

# The reader of every owner's `inspect` answer: a connector to each owner's
# port, `inventory` for the kernel's `dev.*`, and `counters` and `trace` for its
# `kernel.*`, are the whole of what it can observe. `trace` makes it an admin
# tool: every CPU's frequency and wake-ups are what time other programs.
[programs.inspect]
receives = ["netstack", "soundserver", "log", "compositor"]
syscap = ["inventory", "counters", "trace"]

# The kernel's diary: when every thread in the machine was woken, ran and
# parked, which times every other program, so `trace` is all it holds and it
# is an admin tool.
[programs.trace]
syscap = ["trace"]

# Names a killed program's frames from the file and offset the kernel records:
# it reads the files a record names and holds nothing else.
[programs.symbolize]

# The file picker, and the consent server: `consent` is the supervisor's
# question before a package's launch, which no row receives, and `prompt` the
# layer it asks it in, which no other row may hold (`build/build.rs`).
[programs.filepicker]
service = true
serves = ["filepicker", "consent"]
receives = ["compositor", "prompt"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor"]
starts = ["shell"]

[programs.shell]
receives = ["surface"]
starts = ["toybox", "shell", "terminal", "doom", "snake", "calc", "editor", "paint", "files", "host", "inspect", "pkg", "sshserver", "swap", "toyfetch", "update", "grants", "logout", "disks", "wifi", "/apps"]

[programs.doom]
receives = ["compositor", "soundserver"]

[programs.snake]
receives = ["compositor", "filepicker"]

# calc opens a window and reads nothing off the disk, so a connector to the
# compositor is the whole of its authority.
[programs.calc]
receives = ["compositor"]

# toyfetch reads only what every process may: the machine's ambient header,
# CPUID and `/system/etc/os-release`.
[programs.toyfetch]

[programs.editor]
receives = ["compositor", "filepicker"]

[programs.paint]
receives = ["compositor", "filepicker"]

[programs.files]
receives = ["compositor", "filepicker"]

# `power` is `/system/bin/shutdown`'s and `/system/bin/reboot`'s: the
# connector to the supervisor's port, which has `logkeeper` make the log whole and then stops
# the machine with a `SysCap` no program in the image holds. `roster` is
# `/system/bin/ps`'s. `display` is `/system/bin/screen`'s: the mode and the
# scale, which no other row may set. Each of those is this binary under another name: the supervisor
# resolves the symlink to this row, so the applets are endowed both and nothing
# else in the image is. The row's granularity is the binary, so every other
# applet is endowed both too — the same shape as `soundserver` reaching `ls`.
#
# `free` is the same syscall as `ps` and is named by neither: the machine header
# is ambient and the process roster is not.
[programs.toybox]
receives = ["compositor", "soundserver", "surface", "power", "display"]
syscap = ["roster"]
starts = ["toybox", "shell", "terminal", "doom", "snake", "calc", "editor", "paint", "files", "host", "inspect", "pkg", "sshserver", "swap", "toyfetch", "update", "/apps"]

# Symlinks created on ROOT at build time.
# Keys are ROOT-relative; targets are the guest paths they resolve to.
[symlinks]
"bin/cat" = "/system/bin/toybox"
"bin/cp" = "/system/bin/toybox"
"bin/echo" = "/system/bin/toybox"
"bin/free" = "/system/bin/toybox"
"bin/grep" = "/system/bin/toybox"
"bin/hexdump" = "/system/bin/toybox"
"bin/locale" = "/system/bin/toybox"
"bin/ls" = "/system/bin/toybox"
"bin/mkdir" = "/system/bin/toybox"
"bin/mv" = "/system/bin/toybox"
"bin/ps" = "/system/bin/toybox"
"bin/pwd" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"
"bin/rm" = "/system/bin/toybox"
"bin/screen" = "/system/bin/toybox"
"bin/shutdown" = "/system/bin/toybox"
"bin/stats" = "/system/bin/toybox"
"bin/tone" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: one process per xHCI controller, its sticks offered to the
# block service as disks it serves, its keyboards and pointers reported to the
# owner of input.
[programs.usbd]
drives = ["pci:0c:03:30"]
receives = ["disk", "input"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports. A pager: its readers wait on the pages it
# supplies, which only a row of this file may make a program do.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]
