# netd in front of the T14's I219 with its delivery actuator armed.
#
# A boot whose only reading of the interrupt path is a count of messages cannot
# tell a part nothing made speak from a message that reached no CPU.
# `tests/lantalkcase` arms none of it, so its own record still means the card
# spoke on its own.
#
# Nothing here reaches the internal NVMe. There is no `[disks]` row, and the
# only device any program on this boot claims is the PCI function named below.

[boot]
start = ["logd", "netd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:15fc"]
args = ["--provoke-message"]

[programs.test-runner]
syscap = ["logread"]
