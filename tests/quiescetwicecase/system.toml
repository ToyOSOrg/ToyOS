# The boot `quiesce_refuses_a_second_shutdown` judges.
[boot]
start = ["logd", "blockd", "fsd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

# `power` twice: the connector is how the job has init make the first call,
# and the right is the job's own second call. `logread` because the job reads
# the kernel's word that the first call waits, and `dup` because the runner
# passes the job a duplicate of what it holds.
[programs.test-runner]
receives = ["power"]
args = ["test_rs_quiesce_twice"]
syscap = ["dup", "logread", "power"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
