# A desktop with a shell and soundd: the T14's shape when #172 wedged it.
#
# `tests/desktopcase` has no daemon behind the shell and `tests/testcases` has
# no desktop in front of it, so the machine where a *shell-spawned* audio client
# meets a null sink existed in neither. That machine is this one: the client's
# stdio are pipes to a terminal, the terminal is a compositor surface, and
# soundd has no device.

assets = ["assets"]

[boot]
start = ["logd", "blockd", "fsd", "compositor", "soundd", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its row's authority is `logread`,
# which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and init hands
# it every program's output beside that.
[programs.logd]
service = true
syscap = ["logread"]

[programs.compositor]
service = true
serves = ["compositor"]
receives = ["soundd", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
service = true
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["surface", "launcher"]

[programs.toybox]
receives = ["compositor", "soundd", "surface"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/tone" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
