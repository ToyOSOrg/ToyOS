# A job list whose one job floods test-runner's log ring while `logd` reads
# nothing of that ring: the ring fills, and test-runner's own line after the
# job lands in the slots a child may not take. `logd` reads the ring again
# once init says the machine stops. `log_ring_keeps_the_owners_slots` reads
# the verdict off `/log`.
[boot]
start = ["logd", "blockd", "fsd", "test-runner"]

[programs.logd]
service = true
args = [
    "--stall=test-runner",
    "--stall-until=init: power: the machine stops, and logd makes the log whole first (Reboot)",
]
syscap = ["logread"]

# `power` because the last job ends the machine, asking init.
[programs.test-runner]
receives = ["power"]
args = ["test_rs_log_flood", "reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
