# doom, soundd and the assets doom's music is made of — and the WAD whose demo
# `doom_frames` replays, hashing every tic's frame.
#
# `tests/doomcase` is deliberately asset-free — its actuator synthesises its own
# sound and opens neither the WAD nor the SoundFont — and this one is the
# opposite: what it exists to check is that `assets/soundfont.sf2` and
# `assets/DOOM1.WAD` reach ROOT and that doom finds both. So the two cannot
# share a config, and this one pays 19 MiB of ROOT that no other test should.
#
# No compositor: `/system/bin/doom --music-check` and `--frame-check` never open
# a window.

assets = ["assets"]

[boot]
start = ["logd", "blockd", "fsd", "soundd", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its row's authority is `logread`,
# which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and init hands
# it every program's output beside that.
[programs.logd]
service = true
syscap = ["logread"]

[programs.soundd]
service = true
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# No compositor: `/system/bin/doom --music-check` opens no window. test-runner passes
# its namespace to doom.
# `logread` is the log gate's own: a spawned test binary does not inherit a
# `SysCap` dup, so the gate that reads the kernel's records runs inside
# `test-runner` itself.
[programs.test-runner]
receives = ["soundd"]
syscap = ["logread"]

[programs.doom]
receives = ["soundd"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
