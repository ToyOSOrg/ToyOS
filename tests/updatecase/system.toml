# The machine updates itself, rehearsed in QEMU: sshd runs `update` for the
# host's login with the image on its input, `update` writes the slot this boot
# is not running, and the reboot after it boots that slot — or, where the loader
# refuses it or it dies, the other one. `tests/common/update.rs` stages every
# image and judges every boot.

[boot]
start = ["logd", "blockd", "fsd", "netd", "sshd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:1af4:1041"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

# The idle slot, which init claims against the ROOT the kernel holds; the
# owner's signature on the image is the authority to install it.
[programs.update]
slots = true

[programs.test-runner]
syscap = ["logread"]

# `reboot` is how the host hands the machine to the slot `update` marked.
[programs.toybox]
syscap = ["power"]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
