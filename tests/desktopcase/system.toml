# A desktop with a shell in it: the surface tree at its deepest.
#
# `tests/metalcase` is the desktop the compositor's own tests run on and has
# no shell; this one exists because a key typed here travels the whole tree —
# i8042, kernel, compositor, the terminal's window, the terminal's translator,
# the shell's stdin — and `desktop_locale_detect` is about the branch of that
# path where a child asks the terminal for the transitions instead.
#
# The terminal is in `init` rather than launched with the compositor's Ctrl+N,
# so it is the only window and therefore the focused one from the first frame.

assets = ["assets"]

# The terminal receiving `compositor` is what makes the boot race unrepresentable
# here first: the port exists before either process runs. No soundd or filepicker
# in this config, so nothing receives them.
[boot]
start = ["logd", "compositor", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

[programs.compositor]
serves = ["compositor"]
receives = ["launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

# `compositor` is here and not in the shipping `system.toml`'s shell row, and
# it is what endows `test_rs_window_child`. A harness-injected binary is no
# `[programs]` key, so init can build it nothing; what it gets is what its
# parent moved into it, and a child spawned directly inherits the spawner's
# namespace. So the authority travels with the spawn, which is how a real shell
# will launch a real program — and giving it to the shell here widens exactly
# this config's shell and no other.
[programs.shell]
receives = ["compositor", "surface", "launcher"]

[programs.toybox]
receives = ["compositor", "surface"]

# The winit app the owner closed the window of. `desktop_window_child`
# launches it from the shell; nothing else in this config uses it.
[programs.snake]
receives = ["compositor"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/locale" = "/system/bin/toybox"
