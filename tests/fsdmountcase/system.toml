# The boot `fsd_end_at_mount` judges: DATA's first file server ends once its
# volume is mounted and a connection waits on it, before it accepts one — the
# connection init's own file worker makes for the session home.

[boot]
start = ["logd", "blockd", "fsd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

# `power` because `run shutdown` asks init through the `power` connector, and
# the host reads the DATA partition back once the machine is down.
[programs.test-runner]
receives = ["power"]
syscap = ["dup", "logread", "power"]

[programs.toybox]
receives = ["power"]

[symlinks]
"bin/shutdown" = "/system/bin/toybox"

[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
args = ["--end-at-mount", "data"]
