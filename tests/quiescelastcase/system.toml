# This boot's one job starts the thread and the child the kernel may hold and
# reboots; it asserts nothing itself.
[boot]
start = ["logd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

# `power` because the job ends the machine, asking init.
[programs.test-runner]
receives = ["power"]
args = ["test_rs_quiesce_last"]
