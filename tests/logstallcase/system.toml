# The shared boot's shape with `/system/bin/logd` leaving soundd's log ring
# unread until `test_rs_soundd_log_stall` says the tone has played: the ring
# fills and stays full while it plays, which is the state its mix thread must
# never wait in. `soundd_log_stall` runs it, and reads the verdict off `/log` after
# `run shutdown`.

[boot]
start = ["logd", "blockd", "fsd", "soundd", "test-runner"]

[programs.logd]
service = true
args = [
    "--stall=soundd",
    "--stall-until=soundd_log_stall: the tone has played, and logd may read soundd again",
]
syscap = ["logread"]

[programs.soundd]
service = true
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# `power` is what `run shutdown` asks init through.
[programs.test-runner]
receives = ["soundd", "power"]

[programs.toybox]
receives = ["soundd"]

[symlinks]
"bin/shutdown" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
