# The shared boot's shape with `/system/bin/logkeeper` leaving soundserver's log ring
# unread until `test_rs_soundserver_log_stall` says the tone has played: the ring
# fills and stays full while it plays, which is the state its mix thread must
# never wait in. The `soundserver_log_stall` metal row runs it, and reads the verdict
# off `/log`.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "soundserver", "test-runner"]

[programs.logkeeper]
service = true
args = [
    "--stall=soundserver",
    "--stall-until=soundserver_log_stall: the tone has played, and logkeeper may read soundserver again",
]
syscap = ["logread"]

[programs.soundserver]
service = true
serves = ["soundserver"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.test-runner]
receives = ["soundserver"]

[programs.toybox]
receives = ["soundserver"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
