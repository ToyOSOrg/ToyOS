# The shared boot's shape with `/system/bin/logd` leaving soundd's log ring
# unread until `test_rs_soundd_log_stall` says the tone has played: the ring
# fills and stays full while it plays, which is the state its mix thread must
# never wait in. The `soundd_log_stall` metal row runs it, and reads the verdict
# off `/log`.

[boot]
start = ["logd", "soundd", "test-runner"]

[programs.logd]
service = true
args = [
    "--stall=soundd",
    "--stall-until=soundd_log_stall: the tone has played, and logd may read soundd again",
]
syscap = ["logread"]

[programs.soundd]
service = true
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.test-runner]
receives = ["soundd"]

[programs.toybox]
receives = ["soundd"]
