# `tests/lantalkcase` in front of QEMU's 82574L, the part whose register file
# the T14's I219 has: the rehearsal of that boot on the one machine in reach
# that runs netd's Intel driver. The host reaches it through slirp's forward
# and its listener on the host's loopback; everything else is that boot's.

[boot]
start = ["logd", "blockd", "fsd", "netd", "sshd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]
# What lets `logd` serve this boot's log on the network, to whoever connects:
# without it the log is served on this machine only.
receives = ["netd"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:10d3"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

# The host replaces netd on this boot without rebooting it.
[programs.swap]
receives = ["swap"]

[programs.test-runner]
syscap = ["logread"]

# What `exec` is asked for over the cable. `power` because `reboot` is this
# binary under another name and it is the host's way of handing the machine
# back; `echo` is the command whose answer the host compares.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
