[package]
name = "toyos-metal"
description = "The metal loop that flashes an image to a bench's stick, boots it once and reads back what the boot left; the suite's command line, and what the metal profile derives, times and reads off a boot."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The build system's reading of an image, a boot log and a command line.
toyos-build = { path = "../.." }
# The outside judge of the log partition the boot left on the stick.
toyos-fat32-check = { path = "../../lib/fat32/check" }
toyos-gpt = { path = "../../lib/gpt" }
# A ToyOS volume's magic, which the DATA designation never writes over.
bcachefs = { path = "../../lib/bcachefs" }
# Where the designation's one block waits for the root command that writes it.
toyos-tmpdir = { path = "../../lib/tmpdir" }
toyos-quiesce = { path = "../../lib/quiesce" }
toyos-tco = { path = "../../lib/tco" }

[dev-dependencies]
# The slot table written into the test images `internal::admit` reads.
toyos-update = { path = "../../lib/update" }
