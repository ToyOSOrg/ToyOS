# --- the boot that stops itself on purpose ---
# `deadlinewedge` is the only boot here whose verdict is not `Rebooting.`: every
# CPU stops taking scheduler passes at the shutdown syscall and the kernel's own
# `boot-deadline` is what ends it. Its three ordinary numbers are priced against
# that bound rather than against the runner's, because the runner never reaches
# its own.

[[number]]
name = "boot.deadlinewedge.complete_ms"
unit = "ms"
ceiling = 120000
ceiling_from = "toyos_tco::WEDGE_BOUND_MS — on this boot the kernel's own deadline is what runs from boot, so a later `Boot: complete` is a boot the deadline already reset"
measured = 1198

[[number]]
name = "boot.deadlinewedge.back_secs"
unit = "s"
ceiling = 420
ceiling_from = "toyos_build::metal::return_secs — which now derives from WEDGE_BOUND_MS, the longest watchdog a boot runs under, plus what coming back costs"
measured = 231

[[number]]
name = "boot.deadlinewedge.stick_secs"
unit = "s"
ceiling = 5
ceiling_from = "as boot.jobcase.stick_secs. It is the number this boot owes most: the deadline resets a machine whose USB was stopped by registers alone, and a stick the next host cannot enumerate is what `xhci::stop::before_reset` exists to prevent"
measured = 0

# --- and the one number only this boot measures ---
# How far past its bound the deadline actually fired. The bound is a parameter;
# the expiry is what the poll reached on a machine where every CPU was spinning
# with preemption disabled, so the difference is what that poll costs in the
# state it exists for.

[[number]]
name = "boot.deadlinewedge.deadline_lateness_ms"
unit = "ms"
ceiling = 10000
ceiling_from = "the poll's own cadence: the deadline is read on every timer interrupt and an idle CPU re-arms its LAPIC one-shot per fire, so the lateness is one timer period. That period has not been measured on this machine, and ten seconds — a twelfth of the bound — is the widest true bound before it has been. 153 ms is what it read"
measured = 153

# --- the boot one CPU stops answering on ---
# `hardlockup` is the deaf half of the boot above: the same staged wedge, and
# then one CPU with `IF` clear spinning on a lock another holds and never gives
# back. The boot deadline's poll cannot see it — nothing on that CPU runs to
# poll anything — so what ends this machine is that CPU's own performance-counter
# NMI, and the page it seals names the CPU rather than only the bound. Priced
# against the earlier of the two bounds, which is the one this boot runs under.

[[number]]
name = "boot.hardlockup.complete_ms"
unit = "ms"
ceiling = 60000
ceiling_from = "toyos_tco::HARD_LOCKUP_BOUND_MS — half the deadline and the earlier bound, so a later `Boot: complete` is a boot the detector already reset"
measured = 1200

[[number]]
name = "boot.hardlockup.back_secs"
unit = "s"
ceiling = 420
ceiling_from = "as boot.deadlinewedge.back_secs, toyos_build::metal::return_secs. It is the same wait: this boot ends itself half a bound earlier and then costs the same firmware, loader and Ubuntu as any other"
measured = 170

[[number]]
name = "boot.hardlockup.stick_secs"
unit = "s"
ceiling = 5
ceiling_from = "as boot.deadlinewedge.stick_secs. The reset is written from inside an NMI on a CPU that holds a lock, and `xhci::stop::before_reset` runs there like anywhere else — a stick the next host cannot enumerate is what that would have cost"
measured = 0

# --- and the one number only this boot measures ---
# How far past its bound the counter's sample was when it found the CPU stuck.
# Not the row above's number: what bounds this one is the detector's own sample
# period, not the timer's.

[[number]]
name = "boot.hardlockup.lockup_lateness_ms"
unit = "ms"
ceiling = 2000
ceiling_from = "twice the sample period `kernel/src/hardlockup`'s SAMPLE_NS states, 1000 ms: a CPU is found stuck at the first sample after its bound, so one period is the lateness and a second is the widest a delayed one costs. 4 ms is what it read, which is a sample that landed almost on the bound"
measured = 4

# --- what one member of a job list may cost this machine ---
# **The number the suite sizes its lists by, and judges them against.** The
# runner's bound (`toyos_tco::JOB_BOUND_MS`) runs from boot and ends the whole
# list, not the job it is inside, so a list longer than the bound is a boot
# whose tail members never run — reported as missing records rather than as a
# list nobody sized. `tests/common/metal.rs` derives how many members one boot
# may carry from the ceiling here, and then holds the boot to the same number:
# a list is cut to what its members are priced at, and members slower than their
# price red by name.
#
# Every reading below is run 24's, taken from the interval between successive
# `spawn: /system/bin/…` records on that boot's own log.

[[number]]
name = "list.shared.job_ms"
unit = "ms"
ceiling = 1400
ceiling_from = "845 ms measured (25 members spawned between 1.943 s and 23.066 s on run 24's `shared`), and a ceiling above the widest single member on that boot — test_rs_abuse_elf_loader at 1,358 ms — so one heavy member cannot put the mean over it"
measured = 845

