# `tests/e1000case` with netd's lease probe armed: netd serves the 82574 QEMU
# models for its window, leaves its report on the log volume, and ends with the
# lease's verdict as its exit code. Nothing here receives `netd`, because the
# netd a client would connect to ends inside the boot.

[boot]
start = ["logd", "blockd", "fsd", "netd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:10d3"]
args = ["--exit-with-lease"]

[programs.test-runner]
syscap = ["logread"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
