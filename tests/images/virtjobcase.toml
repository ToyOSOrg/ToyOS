# One CPU and the AArch64 guest's jobs, each a kernelprobe applet or one of the
# suite's binaries the harness puts on ROOT — `test_rs_abuse_readonly_copyout`
# last, because a kernel it fails on rewrites the clock page every reader
# asserts on; each job's line comes only if the kernel kept what that job asks
# about.
[boot]
start = ["logkeeper", "uart", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread", "console"]
serves = ["log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.test-runner]
receives = ["power"]
# `mapprobe`, a pager row, which `test_rs_mapped_file` launches.
starts = ["mapprobe"]
# Four minutes from boot rather than one: a job here may run on an emulated
# CPU, and a job past the bound reboots the guest with the job named.
args = ["--bound-ms=240000", "preempt", "fp_isolation", "first_entry", "unmap_touch", "debug_refused", "test_rs_ring0_timer_in_syscall", "test_rs_random_draws", "test_rs_wall_clock_now", "test_rs_user_copy_faults", "test_rs_vm_map_shares", "test_rs_mapped_file", "test_rs_relro_sealed", "test_rs_abuse_readonly_copyout"]

[programs.kernelprobe]

# A pager whose objects its own children map (`tests/guest/mapprobe`).
[programs.mapprobe]
pager = true

[symlinks]
"bin/preempt" = "/system/bin/kernelprobe"
"bin/fp_isolation" = "/system/bin/kernelprobe"
"bin/first_entry" = "/system/bin/kernelprobe"
"bin/unmap_touch" = "/system/bin/kernelprobe"
"bin/debug_refused" = "/system/bin/kernelprobe"
