
[boot]
start = ["logkeeper", "diskserver", "fileserver", "soundserver", "acpiserver", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logkeeper` is a boot whose `/log` is empty —
# `every_boot_config_runs_logkeeper` is what refuses one.
# It claims no device: its row's authority is `logread`, which is
# `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and the supervisor hands
# it every program's output beside that. `log` is the port it hands a reader
# the log on.
[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log", "log-carrier"]

# The machine's ACPI fixed hardware, as `images/system.toml` serves it: on the T14
# every row of this image runs in ACPI mode, and on q35 the stop tests power off
# on the sleep type it hands the kernel.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

[programs.soundserver]
service = true
serves = ["soundserver", "volume", "sound-output"]
devices = ["pci:04:01:00/1af4:1059"]
syscap = ["rt", "wake-latency"]

# The Intel HD Audio driver: one process per HDA function the kernel does not
# drive, each walking its own controller's codecs and offering soundserver the
# output it reaches. A machine with display audio beside an analog codec runs
# two, and soundserver plays to the one that offers.
[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

# The test estate's authority.
# `device` because five of the guest binaries claim the keyboard or the mouse
# and no manifest row can name them — they are not `[programs]` keys — and `dup`
# because a claim moves and one boot runs several of them.
# `logread` because the log gate reads the kernel's own records and cannot be
# a spawned binary: a `SysCap` dup is not part of the namespace test-runner
# hands down.
# `power` because `endowment_denied` narrows it *away* to prove the two power
# syscalls refuse a capability without it, which a capability that never
# carried it would make vacuous. `run shutdown` does not use it: the applet asks
# the supervisor through the `power` connector, and the supervisor has `logkeeper` make the log whole
# before it stops the machine.
# `roster` because guest binaries read their own of `SYS_SYSINFO`'s per-thread
# entries, which arrive in the same machine-wide answer as every other process's
# and have no narrower question in the ABI. It is
# also what `endowment_denied` narrows *away* to prove the refusal, so an estate
# without it would make that arm vacuous rather than red.
# `counters` and `trace` because `counters_read` reads every counter there is,
# and narrows each away to prove its refusal.
# `volume` because the tone jobs mute soundserver's master and `volume_step`
# steps it.
# `log` because `counters_metal` measures its idle second only once the log
# holds its own line, read back off logkeeper.
# `inventory` because a claim names a PCI function by its arrival, which the
# jobs that claim one read off the inventory.
# `jobs` because `job_fairness` starts each of its workloads as a job of its own.
# `state` because `state_view` holds that a job reaches its row's own
# `/state/test-runner` and nothing else of `/state`.
[programs.test-runner]
state = true
# `pagerprobe`, a pager row, which `a_pager_s_end_answers_its_waiting_holders_gone` launches.
starts = ["pagerprobe"]
receives = ["soundserver", "volume", "power", "log"]
syscap = ["device", "dup", "logread", "power", "roster", "counters", "trace", "inventory", "jobs"]

# A pager a test ends under a waiting reader (`tests/guest/pagerprobe`).
[programs.pagerprobe]
pager = true

[programs.toybox]
receives = ["soundserver"]

[symlinks]
"bin/cat" = "/system/bin/toybox"
"bin/cp" = "/system/bin/toybox"
"bin/echo" = "/system/bin/toybox"
"bin/free" = "/system/bin/toybox"
"bin/grep" = "/system/bin/toybox"
"bin/hexdump" = "/system/bin/toybox"
"bin/ls" = "/system/bin/toybox"
"bin/mkdir" = "/system/bin/toybox"
"bin/mv" = "/system/bin/toybox"
"bin/ps" = "/system/bin/toybox"
"bin/pwd" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"
"bin/rm" = "/system/bin/toybox"
"bin/shutdown" = "/system/bin/toybox"
# The one applet that needs the `soundserver` this image's toybox receives:
# `endowment_denied` holds every other applet's grant of it as declared.
"bin/tone" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free: `usbd_spare` claims the first and
# starts its own usbd on it, holding the claim, its `usb` port and its process.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
