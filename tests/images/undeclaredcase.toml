# A boot no `acpi` claim holder declares on: two `edu` a `drives` row would
# claim, and no acpiserver. `a_claim_before_the_declaration_is_refused_at_once`
# judges the supervisor starting no driver and saying why, and a job's own
# claim of each refused at once.
[boot]
start = ["logkeeper", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.pciholder]
drives = ["pci:00:ff:00/1234:11e8"]

# `device` because the job mints the device set and claims, `dup` because
# test-runner hands a job its capability as a duplicate, and `power` because
# a job list is refused without a way to end the boot.
[programs.test-runner]
receives = ["power"]
syscap = ["device", "dup"]
args = ["test_rs_pci_undeclared"]
