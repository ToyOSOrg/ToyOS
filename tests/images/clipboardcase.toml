# The boot `the_opening_exchange_with_qemus_agent_completes` and
# `the_compositor_drives_the_virtio_gpu` read: the clipboard agent against
# QEMU's own vdagent, with the compositor whose clipboard it watches, on
# `Profile::HeadlessVirtioGpu`, the one virtio machine with a display for the
# compositor to drive.
#
# Its compositor starts at `scale=2`, which neither 1280x800 nor the 1024x768
# the host's resize asks for holds: the desktop is drawn and relaid on the
# flip at the step each mode does hold.
#
# test-runner makes the boot announce itself.

assets = ["assets"]

[boot]
start = ["acpiserver", "logkeeper", "uart", "compositor", "vdagent", "test-runner"]

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it.
[programs.logkeeper]
service = true
syscap = ["logread", "console"]
serves = ["log-carrier", "log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.compositor]
service = true
serves = ["compositor", "prompt", "clipboard", "input", "display", "display-output"]
devices = ["pci:03:80:00/1af4:1050"]
args = ["scale=2"]

# The agent, on the port the driver below hands it.
[programs.vdagent]
service = true
serves = ["vdagent"]
receives = ["clipboard"]

[programs.test-runner]

# Started before every PCI claimant: it declares the memory the root bridges
# decode, which every claim of a PCI function waits for.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

# The virtio-serial driver: the console's port to `logkeeper`, the clipboard's
# to `vdagent`.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier", "vdagent"]
