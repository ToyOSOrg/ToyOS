# The boot `the_opening_exchange_with_qemus_agent_completes` and
# `the_compositor_drives_the_virtio_gpu` read: the clipboard agent against
# QEMU's own vdagent, with the compositor whose clipboard it watches, on
# `Profile::HeadlessVirtioGpu`, the one virtio machine with a display for the
# compositor to drive.
#
# test-runner makes the boot announce itself.

assets = ["assets"]

[boot]
start = ["logkeeper", "compositor", "test-runner"]

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it.
[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.compositor]
service = true
serves = ["compositor", "prompt", "clipboard", "input", "display"]
devices = ["pci:03:80:00/1af4:1050", "keyboard", "mouse"]

# One process per virtio-serial function the kernel does not drive: the
# clipboard's channel, beside the kernel's console.
[programs.vdagent]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["clipboard"]

[programs.test-runner]
