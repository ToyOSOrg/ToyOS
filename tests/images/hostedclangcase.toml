# The boot `hosted_clang_hello` installs ToyOS's own clang and LLD in, by `pkg`
# from the package staged on its ROOT: a ROOT of its own, since the package is
# a hundred megabytes and no other test reads it, and DATA, where `/apps` is.
[boot]
start = ["acpiserver", "logkeeper", "diskserver", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.test-runner]

# The installer the job runs, as `images/system.toml` declares it.
[programs.pkg]

# The block service, the NVMe driver for the disk DATA is on, and the file
# servers.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# Started before every PCI claimant: it declares the memory the root bridges
# decode, which every claim of a PCI function waits for.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]
