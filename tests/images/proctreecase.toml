# The boot `process_tree` runs on: a parent's end takes its children down.
#
# A launcher for test-runner, which it endows every job, because the subtree
# under test has children the supervisor launches; a declared `cat`, which runs
# until its input ends; and a declared shell, whose row lists `toybox` because
# it detaches a `cat`.
#
# `launch_toctou` rides it too: a launch of `toybox` through a link it re-points.
#
# And `app_view`: test-runner's row lists `/apps`, so a job launches the
# package it installed under the image's `[apps]` row and the view an
# installed package is minted, and is refused one named after the `shell` row.
# It grants that package a folder through `grants`, which test-runner's row
# and the shell's list, in the login session test-runner opens for its jobs:
# test-runner is a login authority, so its jobs launch in that session and
# hold its `login` connector.

[boot]
start = ["acpiserver", "logkeeper", "diskserver", "fileserver", "test-runner"]

[apps]
folder = "read-write"

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it: the
# kernel keeps the record ring and writes no file, so such a boot's `/log` is
# empty. It claims no device and serves no port.
[programs.logkeeper]
service = true
syscap = ["logread"]

# `roster` because the guest asks which of its tree still runs, and `dup`
# because test-runner hands each binary a duplicate of its capability.
[programs.test-runner]
syscap = ["dup", "roster"]
starts = ["toybox", "shell", "grants", "/apps"]
login = true

# `roster`, which a child the job spawns itself never holds: a child holding
# it ran under this row, and `launch_toctou` asks which bytes that child was.
[programs.toybox]
syscap = ["roster"]

[programs.shell]
starts = ["toybox", "shell", "grants"]

# The owner of each login session a job opens.
[programs.session]

[programs.grants]
receives = ["grants"]

[symlinks]
"bin/cat" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free for the tests that claim one.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# Started before every PCI claimant: it declares the memory the root bridges
# decode, which every claim of a PCI function waits for.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]
