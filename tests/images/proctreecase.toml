# The boot `process_tree` runs on: a parent's end takes its children down.
#
# A launcher for test-runner, which it endows every job, because the subtree
# under test has children the supervisor launches; a declared `cat`, which runs
# until its input ends; and a declared shell, which a depth chain launches and
# which detaches a `cat`.
#
# `launch_toctou` rides it too: a launch of `toybox` through a link it re-points.
#
# And `launch_authority`: test-runner's row lists `swap` and `update`, which a
# job is refused outside a login session, and not `proctest`, which it is
# refused outright; `toybox`, which opens no session, starts `swap` in the
# session it was launched in: refused in the machine's, started in the one the
# shell opens.
#
# And `fs_share`: a shell test-runner launches opens no session and spends
# test-runner's share of DATA's server; a shell that shell launches is in a
# login session its row opens, which has a share of its own, and so is every
# shell launched down from it, whose `login` row opens none there.
#
# And `app_view`: test-runner's row lists `/apps`, so a job launches the
# package it installed under the image's `[apps]` row and the view an
# installed package is minted, and is refused one named after the `shell` row.
# It grants that package a folder through `grants`, which test-runner's row
# lists, so it is refused in the machine's session, and the shell's, so the
# login session the shell opens is answered.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "test-runner"]

[apps]
folder = "read-write"

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it: the
# kernel keeps the record ring and writes no file, so such a boot's `/log` is
# empty. It claims no device and serves no port.
[programs.logkeeper]
service = true
syscap = ["logread"]

# `roster` because the guest asks which of its tree still runs, and `dup`
# because test-runner hands each binary a duplicate of its capability.
[programs.test-runner]
syscap = ["dup", "roster"]
starts = ["toybox", "shell", "swap", "update", "grants", "/apps"]

# `roster`, which a child the job spawns itself never holds: a child holding
# it ran under this row, and `launch_toctou` asks which bytes that child was.
[programs.toybox]
syscap = ["roster"]
starts = ["swap"]

[programs.shell]
starts = ["toybox", "shell", "grants"]
login = true

[programs.grants]
receives = ["grants"]

[programs.swap]
receives = ["swap"]

[programs.update]
slots = true

[programs.proctest]

[symlinks]
"bin/cat" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
