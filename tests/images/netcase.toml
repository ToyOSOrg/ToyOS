# The one boot that runs netstack with a virtio NIC in front of it, with diskserver's
# NVMe controller and soundserver's virtio-sound beside it: `iommu_virtio_platform`'s
# machine, where every virtio function is a process's claim or a kernel driver's.
#
# netstack serves every link a NIC driver brings, from the start. Every NIC
# driver is here, so whichever NICs the machine has come up with no row
# naming them.
#
# test-runner is here for the same reason it is in metalcase: it makes the boot
# announce itself.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "netstack", "soundserver", "test-runner"]

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it: the
# kernel keeps the record ring and writes no file, so such a boot's `/log` is
# empty. It claims no device and serves no port.
[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log-carrier"]

# netstack over the link a NIC driver brings on `link`; it claims no device.
[programs.netstack]
service = true
serves = ["netstack", "link"]

# The NIC drivers: one process per function a row's parts match, holding that
# function alone; virtio's is started again when it ends other than by exit 0,
# the Intel parts' is not (`images/system.toml`).
[programs.virtio-net]
drives = ["pci:02:00:00/1af4:1041"]
receives = ["link"]
restart = true

[programs.i219]
drives = ["pci:02:00:00/8086:15fc", "pci:02:00:00/8086:10d3"]
receives = ["link"]

[programs.soundserver]
service = true
serves = ["soundserver", "volume", "sound-output"]
devices = ["pci:04:01:00/1af4:1059"]
syscap = ["rt", "wake-latency"]

# A job reaches netstack through test-runner's namespace:
# `netstack_holders_exported_to_children`'s jobs reach the harness through it.
[programs.test-runner]
receives = ["netstack"]

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free for the tests that claim one.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
