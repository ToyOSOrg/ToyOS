# Explicit destructive DATA preparation only. No DATA file server holds the
# partition; only this image's boot-started runner gets raw DATA authority.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "acpiserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log"]

[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

[programs.test-runner]
receives = ["power"]
authorize = ["format:data"]

[programs.disks]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

[programs.fileserver]
restart = true
pager = true
roles = ["log", "boot", "memory"]
receives = ["block"]
