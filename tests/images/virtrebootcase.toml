# The one job returns the machine to firmware.
[boot]
start = ["logkeeper", "uart", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread", "console"]
serves = ["log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.test-runner]
receives = ["power"]
# Four minutes from boot: the job runs on emulated CPUs, and a job past the
# bound reboots the guest with the job named.
args = ["--bound-ms=240000", "reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"
