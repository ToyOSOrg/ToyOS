# The ACPI server's death, judged on the T14 by `acpi_server_death`: the server
# is built into the image and started by nothing but the one job, which holds
# the claim it hands it. A boot that ends itself, as `tests/images/jobcase.toml` does.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log-carrier"]

[programs.acpiserver]

# `device` because the job mints the `acpi` claim the server is handed, and
# `dup` because test-runner hands a job its capability as a duplicate and
# hands none without it; `counters` because `acpi_mediated` reads what the
# boot processor counted of the firmware calls it asked for; `power` because
# the job list ends the machine, asking the supervisor.
#
# `args` as it stands is the guest's: `acpi_mediated_access` and
# `acpi_supply_outlives_holder` boot this file with their probe on ROOT. A
# metal row's job list replaces it.
[programs.test-runner]
receives = ["power"]
syscap = ["device", "dup", "counters"]
args = ["test_rs_acpi_mediated", "reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free for the tests that claim one.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
