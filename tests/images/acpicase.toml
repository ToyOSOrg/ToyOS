# The ACPI server's death, judged on the T14 by `acpi_server_death`: the server
# is built into the image and started by nothing but the one job, which holds
# the claim it hands it. A boot that ends itself, as `tests/images/jobcase.toml` does.
# Nothing here claims a PCI function: the claim's holders declare none of the
# root bridges' memory, so every PCI claim on this boot is refused.
[boot]
start = ["logkeeper", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.acpiserver]

# `device` because the job mints the `acpi` claim the server is handed, and
# `dup` because test-runner hands a job its capability as a duplicate and
# hands none without it; `counters` because `acpi_mediated` reads what the
# boot processor counted of the firmware calls it asked for; `power` because
# the job list ends the machine, asking the supervisor.
#
# `args` as it stands is the guest's: `acpi_mediated_access` and
# `acpi_supply_outlives_holder` boot this file with their probe on ROOT. A
# metal row's job list replaces it.
[programs.test-runner]
receives = ["power"]
syscap = ["device", "dup", "counters"]
args = ["test_rs_acpi_mediated", "reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

# The file servers: the log and the running slot's volume on the disk the
# kernel drives, one process each. No block service: its NVMe claim would wait
# on a declaration no holder here makes.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
