# The `acpi` claim's own holders: jobs that claim it, starting with the first,
# on a boot the ACPI server is built into and started by nothing but a job
# (`acpi_mediated_access` and the rows beside it). A boot that ends itself, as
# `tests/images/jobcase.toml` does. No row holds the claim, so none declares
# the root bridges' memory before the supervisor's own claims, and nothing
# here claims a PCI function: the boot has no storage, and on the T14 its log
# has no way to its stick
# (`issues/the-acpi-servers-death-has-no-readback-on-the-t14.md`).
[boot]
start = ["logkeeper", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.acpiserver]

# `device` because the job mints the `acpi` claim the server is handed, and
# `dup` because test-runner hands a job its capability as a duplicate and
# hands none without it; `counters` because `acpi_mediated` reads what the
# boot processor counted of the firmware calls it asked for; `power` because
# the job list ends the machine, asking the supervisor.
#
# `args` as it stands is the guest's: `acpi_mediated_access` and
# `acpi_supply_outlives_holder` boot this file with their probe on ROOT. A
# metal row's job list replaces it.
[programs.test-runner]
receives = ["power"]
syscap = ["device", "dup", "counters"]
args = ["test_rs_acpi_mediated", "reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"
