# The boot `osbench` measures ToyOS on, for a comparison with the same program
# on the bench's own Linux (`tests/guest/osbench`).
#
# Only what a job list needs to run and to reach the log on the boot stick: no
# compositor, sound, ACPI server or network, so little but the measurement asks
# for a CPU.
#
# The runner's capability carries `jobs`, for the fairness run that starts each
# workload as a job of its own, and `dup`, to hand it down.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.test-runner]
receives = ["power"]
args = ["osbench_system", "osbench_sched", "osbench_fair", "reboot"]
syscap = ["jobs", "dup"]

[programs.osbench]

[programs.toybox]

[symlinks]
"bin/osbench_system" = "/system/bin/osbench"
"bin/osbench_sched" = "/system/bin/osbench"
"bin/osbench_fair" = "/system/bin/osbench"
"bin/reboot" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per such controller, reading its own table and
# offering its disk to the block service. QEMU's controller alone, so a metal
# boot leaves the bench's own NVMe disk to its firmware.
[programs.nvme]
drives = ["pci:01:08:02/1b36:0010"]
receives = ["disk"]

# The USB driver, one process per boot controller: QEMU's `nec-usb-xhci`, the
# T14's 00:14.0 and the AMD bench's 03:00.3. QEMU's spare, the T14's Type-C
# controller and the AMD bench's 03:00.4 stay free for the tests that claim
# them.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30/8086:a0ed", "pci:0c:03:30/1022:1639@03:00.3"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
