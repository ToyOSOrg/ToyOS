# soundserver, netstack and sshserver are here for exactly the reason they have no device:
# their graceful exit is half of what this config certifies.
# sshserver is the one whose absence *is* the device absence — it has no device of
# its own and reaches the machine's shape only through netstack.
# test-runner makes the boot announce itself, so the harness waits for a
# marker instead of guessing from pixels — and it is what lets an in-guest
# binary run on the machine shape that gets flashed.

assets = ["assets"]

[boot]
start = ["logkeeper", "diskserver", "fileserver", "compositor", "soundserver", "netstack", "sshserver", "test-runner", "ps2server"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logkeeper` is a boot whose `/log` is empty —
# `every_boot_config_runs_logkeeper` is what refuses one.
# It claims no device: its row's authority is `logread`, which is
# `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and the supervisor hands
# it every program's output beside that. `log` is the port it hands a reader
# the log on.
[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log"]

[programs.compositor]
service = true
serves = ["compositor", "prompt", "clipboard", "input", "display"]
receives = ["soundserver"]
devices = ["framebuffer"]

[programs.soundserver]
service = true
serves = ["soundserver", "volume", "sound-output"]
devices = ["pci:04:01:00/1af4:1059"]
syscap = ["rt"]

# The Intel HD Audio driver: one process per HDA function the kernel does not
# drive, each walking its own controller's codecs and offering soundserver the
# output it reaches. A machine with display audio beside an analog codec runs
# two, and soundserver plays to the one that offers.
[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

# netstack holds the NIC's PCI function and drives it: the virtqueues, the register
# window and the interrupt are its own, and the kernel keeps only the claim.
[programs.netstack]
service = true
serves = ["netstack"]
devices = ["pci:02:00:00/1af4:1041"]

[programs.sshserver]
service = true
receives = ["netstack"]

# The i8042, driven from userland: its ports and its two lines are this
# program's `isa` claim, and the keys and pointer reports it decodes go to the
# owner of input over `input`, which no other row may receive
# (`build/build.rs`). Started again when it ends other than by exit 0, which it
# says only on a machine with nothing to serve.
[programs.ps2server]
restart = true
receives = ["input"]
devices = ["isa:0060,0064:1,12"]


# The union its guest binaries need on this machine shape; `log` is what
# `ps2server_hold` reads ps2server's probe off.
[programs.test-runner]
receives = ["compositor", "soundserver", "netstack", "log"]
syscap = ["logread"]

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver, one process per boot controller: QEMU's `nec-usb-xhci`, the
# T14's 00:14.0 and the AMD bench's 03:00.3. QEMU's spare, the T14's Type-C
# controller and the AMD bench's 03:00.4 stay free for the tests that claim
# them.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30/8086:a0ed", "pci:0c:03:30/1022:1639@03:00.3"]
receives = ["disk", "input"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
