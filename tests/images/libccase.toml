# The boot `libc_children` runs libc's C programs on: each starts children of
# its own, `echo` among them, and `system` and `popen` run their commands by
# `/system/bin/shell -c`; and `/tmp`'s file server, whose file
# `spawn_served_stdout` puts at the stdout `system`'s child inherits.
[boot]
start = ["acpiserver", "logkeeper", "uart", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread", "console"]
serves = ["log-carrier", "log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

# `roster` for `libc_read_restarts`, which orders a child's end after its
# own read is parked by the kernel's roster, and `dup` to hand it on.

[programs.test-runner]
syscap = ["dup", "roster"]

[programs.toybox]

[programs.shell]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/cat" = "/system/bin/toybox"

# It declares the memory the root bridges decode: the supervisor starts a PCI
# driver only once the device set says the declaration is held.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

[programs.fileserver]
restart = true
pager = true
roles = ["memory"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
