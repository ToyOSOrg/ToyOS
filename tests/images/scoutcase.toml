# Measurement scout, not for landing: tests/images/benchcase.toml without
# netstack, so the T14's I219 stays as firmware left it, for `osbench scout`
# (`tests/guest/osbench/src/energy.rs`).
[boot]
start = ["logkeeper", "diskserver", "fileserver", "acpiserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

# ACPI mode, as a shipped image and the bench's Linux run it. In the legacy
# mode the T14's firmware hands over, it stops every CPU for 4.5 ms every 2.2 s
# (`issues/the-t14s-firmware-interrupts-every-cpu-every-2-2-s-under-toyos.md`).
# Started before `test-runner`, so its claim's enable precedes every job.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

# The order `osbench all` runs the groups in. The bound is the metal row's, its
# 465 s on the 60 s every list has (`tests/toyos.rs`), restated for a boot of
# this config built without the row; a derived metal config states its own.
[programs.test-runner]
receives = ["power"]
syscap = ["jobs", "counters", "trace", "roster", "inventory", "dup"]
args = [
    "--bound-ms=525000",
    "osbench_boot",
    "osbench_identity",
    "osbench_system",
    "osbench_sched",
    "osbench_fair",
    "osbench_files",
    "osbench_ipc",
    "osbench_net",
    "osbench_procs",
    "osbench_mem",
    "osbench_time",
    "osbench_work",
    "osbench_tail",
    "osbench_nvme",
    "osbench_persist",
    "osbench_crunch",
    "reboot",
]

[programs.osbench]

[programs.toybox]

[symlinks]
"bin/osbench_boot" = "/system/bin/osbench"
"bin/osbench_identity" = "/system/bin/osbench"
"bin/osbench_energy" = "/system/bin/osbench"
"bin/osbench_scout" = "/system/bin/osbench"
"bin/osbench_display_scout" = "/system/bin/osbench"
"bin/osbench_system" = "/system/bin/osbench"
"bin/osbench_sched" = "/system/bin/osbench"
"bin/osbench_fair" = "/system/bin/osbench"
"bin/osbench_files" = "/system/bin/osbench"
"bin/osbench_ipc" = "/system/bin/osbench"
"bin/osbench_net" = "/system/bin/osbench"
"bin/osbench_procs" = "/system/bin/osbench"
"bin/osbench_mem" = "/system/bin/osbench"
"bin/osbench_time" = "/system/bin/osbench"
"bin/osbench_work" = "/system/bin/osbench"
"bin/osbench_tail" = "/system/bin/osbench"
"bin/osbench_nvme" = "/system/bin/osbench"
"bin/osbench_lan" = "/system/bin/osbench"
"bin/osbench_internet" = "/system/bin/osbench"
"bin/osbench_crunch" = "/system/bin/osbench"
"bin/osbench_persist" = "/system/bin/osbench"
"bin/reboot" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free for the tests that claim one.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
