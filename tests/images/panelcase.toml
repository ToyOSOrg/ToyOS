# The boot `screen_fatal_halt_composited` reads the panel of: a compositor
# holding the scanout when the kernel dies, on `Profile::Metal`'s machine.
#
# Not tests/images/metalcase.toml: that image's sshserver is most of what it compiles, and
# no guest speaks SSH.

assets = ["assets"]

[boot]
start = ["acpiserver", "logkeeper", "uart", "compositor"]

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it.
[programs.logkeeper]
service = true
syscap = ["logread"]
serves = ["log-carrier", "log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.compositor]
service = true
serves = ["compositor", "prompt", "clipboard", "input", "display", "display-output"]
devices = ["framebuffer"]

# Started before every PCI claimant: it declares the memory the root bridges
# decode, which every claim of a PCI function waits for.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
