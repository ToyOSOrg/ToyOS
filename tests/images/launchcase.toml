# The boot `a_launch_gives_each_unsent_stdio_slot_a_null` runs
# `launch_unsent_stdio` on: test-runner's row starts `toybox`, so every job
# holds a launcher, and `cat` and `echo` are links to it, so a spawn of
# either is a launch.
[boot]
start = ["acpiserver", "logkeeper", "uart", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread", "console"]
serves = ["log-carrier", "log-wire"]
holds = ["log-origins"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.test-runner]
starts = ["toybox"]

[programs.toybox]

[symlinks]
"bin/cat" = "/system/bin/toybox"
"bin/echo" = "/system/bin/toybox"

# It declares the memory the root bridges decode: the supervisor starts a PCI
# driver only once the device set says the declaration is held.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]

# The virtio-serial driver, for the VM's console alone: this image runs no agent.
[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]
