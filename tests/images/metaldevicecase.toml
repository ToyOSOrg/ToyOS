# The device suite's boot: one job per number the T14 is asked for, and then
# the machine back to firmware.
#
# The shape is `tests/images/jobcase.toml`'s — a job list is the only way a boot ends on a
# machine whose console reaches nobody — with `metalprobe` behind it. Each job
# exits with its measurement as its exit code, and the kernel's own
# `exit: <name> pid=N code=N cpu=Nms` record is what carries it off the stick.
#
# No compositor: the framebuffer jobs claim the display themselves, and a claim
# is minted for one holder. soundserver and the hda driver *are* here, with no
# client: on this machine the controller is real, and its codec walk and
# output-path choice are the only exercise of `toyos-hda` that hardware can
# give.
[boot]
start = ["acpiserver", "logkeeper", "diskserver", "fileserver", "soundserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.soundserver]
service = true
serves = ["soundserver", "volume", "sound-output"]
syscap = ["rt", "wake-latency"]

# The Intel HD Audio driver: one process per HDA function the kernel does not
# drive, each walking its own controller's codecs and offering soundserver the
# output it reaches. A machine with display audio beside an analog codec runs
# two, and soundserver plays to the one that offers.
[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

# `device` because every framebuffer job mints its own claim and no manifest row
# can name what a spawned job holds; `dup` because the capability is handed down
# to each job in turn. `power` is the connector the last job asks the supervisor through
# to hand the machine back.
#
# **The order is by where the bound's expiry may land.** One bound covers the
# whole list (`toyos_tco::JOB_BOUND_MS`, measured from boot) and its expiry is a
# machine reset, so the question is not which job would be lost but which job
# the reset would land inside. A reset inside a transfer is what a mass-storage
# device does not survive, so the two that move bytes across one run first,
# where the bound has its whole span left, and the three whose span is a memory
# copy run after them.
[programs.test-runner]
args = ["usbwrite", "usbread", "fbcheck", "fbfill", "fbread", "reboot"]
receives = ["soundserver", "power"]
syscap = ["device", "dup"]

[programs.metalprobe]

[programs.toybox]

[symlinks]
"bin/fbcheck" = "/system/bin/metalprobe"
"bin/fbfill" = "/system/bin/metalprobe"
"bin/fbread" = "/system/bin/metalprobe"
"bin/usbwrite" = "/system/bin/metalprobe"
"bin/usbread" = "/system/bin/metalprobe"
"bin/reboot" = "/system/bin/toybox"

# The block service: every disk a driver offers on `disk`, listed and opened
# for the clients `block` grants, each session handed to its disk's driver.
# Started again when it ends; its drivers connect again and offer again.
[programs.diskserver]
service = true
restart = true
serves = ["block", "disk"]

# The NVMe driver: one process per NVMe controller, whatever its maker, reading
# its own table and offering its disk to the block service. Another system's
# partitions on that disk are reached by no grant (`toyos_supervisor::storage`).
[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

# The USB driver: QEMU's `nec-usb-xhci`, and the controller firmware booted
# through where that is an xHCI, which on a bench booted off its NVMe is none.
# Every other xHCI controller stays free for the tests that claim one.
[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

# The file servers: DATA, the log and the boot volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
pager = true
roles = ["data", "log", "boot"]
receives = ["block"]

# Started before every PCI claimant: it declares the memory the root bridges
# decode, which every claim of a PCI function waits for.
[programs.acpiserver]
service = true
devices = ["acpi"]
receives = ["power"]
