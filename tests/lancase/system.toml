# The one boot that runs netd in front of the ThinkPad T14's own NIC.
#
# A directory of its own for the reason `tests/e1000case` is one: a program that
# names a card the machine does not have costs an `init:` refusal line on every
# boot of the config that does, and no machine has both.
#
# Nothing here reaches the internal NVMe. There is no `[disks]` row, and the
# only device any program on this boot claims is the PCI function named below.

[boot]
start = ["logd", "blockd", "fsd", "netd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:15fc"]

[programs.test-runner]
syscap = ["logread"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
