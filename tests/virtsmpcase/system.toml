# Every CPU the machine names, and the one job whose premise is more than one
# CPU: a page unmapped beside a thread that is still reading it. Then the
# machine powers off, every CPU but one turned off first.
[boot]
start = ["logd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.test-runner]
receives = ["power"]
# Four minutes from boot: every job here runs on emulated CPUs, and a job past
# the bound reboots the guest with the job named.
args = ["--bound-ms=240000", "unmap_touch", "shutdown"]

[programs.toybox]

[symlinks]
"bin/unmap_touch" = "/system/bin/toybox"
"bin/shutdown" = "/system/bin/toybox"
