# The boot the served log is judged on (`tests/common/logstream.rs`'s
# `E1000E`): netd in front of QEMU's 82574L, whose register file the T14's
# I219 has, `logd` serving the log through it, and a test-runner that can
# `run shutdown`, so every verdict is read off a volume the guest closed itself.

[boot]
start = ["logd", "blockd", "fsd", "netd", "test-runner"]

# `receives = ["netd"]` is what lets `logd` serve this boot's log on the
# network.
[programs.logd]
service = true
syscap = ["logread"]
receives = ["netd"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:10d3"]

# `power` is what `run shutdown` asks init through.
[programs.test-runner]
receives = ["netd", "power"]

[programs.toybox]

[symlinks]
"bin/shutdown" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
