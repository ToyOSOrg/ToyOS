# The T14 answering the development host over its own cable: netd serving the
# I219 for as long as the boot lasts, `logd` serving the boot's log to whoever
# connects, and sshd taking a command — `reboot` among them, which is how the
# host hands the machine back.
#
# `tests/e1000talkcase` is the same boot in front of QEMU's 82574; the two
# differ by the one `devices` row, because a program that names a card the
# machine does not have costs an `init:` refusal line on every boot, and no
# machine has both. Nothing here reaches the internal NVMe: no `[disks]`
# row, and the only device any program claims is the PCI function below.

[boot]
start = ["logd", "netd", "sshd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]
# What lets `logd` serve this boot's log on the network, to whoever connects:
# without it the log is served on this machine only.
receives = ["netd"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:15fc"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

# The host replaces netd on this boot without rebooting it.
[programs.swap]
receives = ["swap"]

[programs.test-runner]
syscap = ["logread"]

# What `exec` is asked for over the cable. `power` because `reboot` is this
# binary under another name and it is the host's way of handing the machine
# back; `echo` is the command whose answer the host compares.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"
