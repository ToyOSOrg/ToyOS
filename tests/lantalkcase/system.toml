# The T14 answering the development host over its own cable: netstack serving the
# I219 for as long as the boot lasts, `logkeeper` streaming every record to the
# listener the parameter line names, and sshserver taking a command — `reboot`
# among them, which is how the host hands the machine back.
#
# Nothing here reaches the internal NVMe: no `[disks]` row, and the only
# device any program claims is the PCI function below.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "netstack", "sshserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]
# What lets `logkeeper` serve this boot's log on the network, to whoever connects:
# without it the log is served on this machine only.
receives = ["netstack"]

[programs.netstack]
service = true
serves = ["netstack"]
devices = ["pci:8086:15fc"]

[programs.sshserver]
service = true
receives = ["netstack"]
starts = ["toybox", "swap"]
login = true

# The host replaces netstack on this boot without rebooting it.
[programs.swap]
receives = ["swap"]

[programs.test-runner]
syscap = ["logread"]

# What `exec` is asked for over the cable. `power` because `reboot` is this
# binary under another name and it is the host's way of handing the machine
# back; `echo` is the command whose answer the host compares.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
