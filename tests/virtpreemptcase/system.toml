# One CPU and one job, `preempt`, whose line comes only after the timer has
# taken the CPU from a thread that never enters the kernel itself.
[boot]
start = ["logd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.test-runner]
receives = ["power"]
args = ["preempt"]

[programs.toybox]

[symlinks]
"bin/preempt" = "/system/bin/toybox"
