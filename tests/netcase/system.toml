# The one boot that runs netstack with a virtio NIC in front of it, with diskserver's
# NVMe controller beside it: `iommu_virtio_platform`'s machine.
#
# netstack's `main` opens the NIC before anything else and returns on `NotFound`,
# so a config with no NIC never reaches a line of the daemon proper.
#
# test-runner is here for the same reason it is in metalcase: it makes the boot
# announce itself.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "netstack", "test-runner"]

# `every_boot_config_runs_logkeeper` is what refuses a boot config without it: the
# kernel keeps the record ring and writes no file, so such a boot's `/log` is
# empty. It claims no device and serves no port.
[programs.logkeeper]
service = true
syscap = ["logread"]

# netstack holds the NIC's PCI function and drives it: the virtqueues, the register
# window and the interrupt are its own, and the kernel keeps only the claim.
# Named by vendor and device rather than by slot, so one row finds the card
# wherever firmware put it.
[programs.netstack]
service = true
serves = ["netstack"]
devices = ["pci:1af4:1041", "pci:8086:10d3"]

# `netstack` because `netstack_socket_churn` connects through it and reads its
# counts.
[programs.test-runner]
receives = ["netstack"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
