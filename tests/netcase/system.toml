# The one boot that runs netd with a virtio NIC in front of it.
#
# netd's `main` opens the NIC before anything else and returns on `NotFound`,
# so a config with no NIC never reaches a line of the daemon proper.
#
# test-runner is here for the same reason it is in metalcase: it makes the boot
# announce itself and lets an in-guest binary be driven over the
# ===TEST_START=== protocol.

[boot]
start = ["logd", "netd", "test-runner"]

# `every_boot_config_runs_logd` is what refuses a boot config without it: the
# kernel keeps the record ring and writes no file, so such a boot's `/log` is
# empty. It claims no device and serves no port; its whole authority is
# `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

# netd holds the NIC's PCI function and drives it: the virtqueues, the register
# window and the interrupt are its own, and the kernel keeps only the claim.
# Named by vendor and device rather than by slot, so one row finds the card
# wherever firmware put it.
[programs.netd]
serves = ["netd"]
devices = ["pci:1af4:1041"]

# `launcher` for `launcher_refusals`, whose subject is what a client can make
# `/system/bin/init` do — so the test estate has to be able to reach it somewhere.
# This is also the only config whose test binaries take the launcher path to
# `Command::spawn` at all: everywhere else test-runner holds no connector and
# every spawn is direct.
# `logread` is the log gate's own: a spawned test binary does not inherit a
# `SysCap` dup, so the gate that reads the kernel's records runs inside
# `test-runner` itself.
[programs.test-runner]
receives = ["netd", "launcher"]
syscap = ["logread"]
# The second claimant on netd's function, and the only one in the tree: what
# `pci_function_is_exclusive` reads is the kernel answering `Owned` to it while
# netd keeps driving the card. `src/build.rs` names this exact entry — config,
# program, device — as the one exception to
# `every_device_class_has_at_most_one_claimant`.
devices = ["pci:1af4:1041"]

# What `launcher_refusals` asks init to start. A declared program that serves
# nothing and provides nothing, so a refused launch of it takes no acceptor
# with it and a granted one is a clean round trip.
[programs.toybox]
