# `tests/e1000case` with netd's PHY probe armed: netd ends right after the
# bring-up with the PHY's outcome as its exit code, and on the 82574 QEMU
# models that outcome is the refusal by name. Nothing here receives `netd`,
# because there is no netd left to connect to once it has answered.

[boot]
start = ["logd", "netd", "test-runner"]

[programs.logd]
syscap = ["logread"]

[programs.netd]
serves = ["netd"]
devices = ["pci:8086:10d3"]
args = ["--exit-with-phy-outcome"]

[programs.test-runner]
syscap = ["logread"]
