# `tests/e1000talkcase` with QEMU's `igb` beside the 82574: a function that
# resets on release by an Express function level reset, held by netd so a swap
# of netd releases it and the replacement claims it again. The 82574 carries
# the swap's ssh; the igb is only held.

[boot]
start = ["logd", "blockd", "fsd", "netd", "sshd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]
# The record stream's authority: the address on the parameter line is
# information, and this row is the whole of what can act on it.
receives = ["netd"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:10d3", "pci:8086:10c9"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

[programs.swap]
receives = ["swap"]

[programs.test-runner]
syscap = ["logread"]

# `reboot` is this binary under another name and the host's way of ending the
# boot.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
