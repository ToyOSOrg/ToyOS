# A running service's binary replaced with no reboot, rehearsed on QEMU's
# virtio-net: `logd` streams every record to the host's listener, sshd runs
# `swap` for an authenticated login and it hands the binary to init, and netd is the
# service swapped — the one whose restart the stream and the ssh connection
# asking for it both have to outlive.
#
# `tests/e1000talkcase` is the same exchange in front of the T14's register
# file, and `tests/lantalkcase` the T14 itself.

[boot]
start = ["logd", "blockd", "fsd", "netd", "sshd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]
# The record stream's authority: the address on the parameter line is
# information, and this row is the whole of what can act on it.
receives = ["netd"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:1af4:1041"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

# `swap` is the authority to replace a service's binary, and no other program
# may hold it: the host runs it over ssh.
[programs.swap]
receives = ["swap"]

[programs.test-runner]
syscap = ["logread"]

# What `exec` is asked for over the cable. `power` because `reboot` is this
# binary under another name and it is the host's way of ending the boot with
# its log whole; `echo` is the command whose answer the host compares.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
