# The job list that never finishes, so nothing but the runner's own deadline
# ends this boot.
#
# `--bound-ms` is the one argument that is not a job. The T14 leaves the bound at
# `toyos_tco::JOB_BOUND_MS`; this shortens it for the suite's ceiling.
[boot]
start = ["logd", "test-runner"]

[programs.logd]
syscap = ["logread"]

[programs.test-runner]
# **`echo` is the job the deadline must never reach.** The deadline kills the
# job it was watching so the driver can end what it had in flight, and that kill
# releases the loop `spin` was blocking — so without `userland/test-runner`'s
# stand-down the loop starts this one, into a shutdown that has already written
# the boot's last word.
args = ["--bound-ms=3000", "spin", "echo"]
syscap = ["dup", "power"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"
"bin/spin" = "/system/bin/toybox"
"bin/echo" = "/system/bin/toybox"
