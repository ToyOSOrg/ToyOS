[package]
name = "toyos-rust-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-window = { path = "../../userland/toyos-window" }
libloading = { git = "https://github.com/ToyOSOrg/rust_libloading", branch = "toyos" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0-sdk-0.2" }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "logging"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pki-types = "1"
webpki-roots = "1"
sha2 = { version = "0.10", default-features = false }

# Separate workspace from userland/, so it needs its own redirects: the forks
# above depend on ToyOS crates by version, and only a patch maps those to the
# working tree.
[patch.crates-io]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2", package = "getrandom" }

[lints.rust]
warnings = "deny"

# The guest profile. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
