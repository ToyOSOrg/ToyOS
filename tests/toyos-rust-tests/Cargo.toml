[package]
name = "toyos-rust-tests"
description = "The Rust programs the harness runs inside a ToyOS guest: one binary per test, and the helpers they spawn."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-window = { path = "../../userland/toyos-window" }
# The desktop's furniture, for `consent`'s fullscreen window.
toyos-desktop = { path = "../../userland/compositor/desktop" }
toyos-tco = { path = "../../toyos-tco" }
toyos-inspect = { path = "../../toyos-inspect" }
# The log as logkeeper serves it, and the asking for it, for `counters_metal`'s
# wait on the log being quiet.
toyos-logstream = { path = "../../toyos-logstream" }
logkeeper-api = { path = "../../userland/logkeeper-api" }
# The ACPI server's count line, for `acpi_hold`'s wait on it.
acpiserver-api = { path = "../../userland/acpiserver-api" }
# The diary's decoder, for `trace_read` and `trace_flood`.
toyos-trace = { path = "../../toyos-trace" }
# The reader's asker, for `hda_client_stall`.
inspect = { path = "../../userland/inspect" }
libloading = { git = "https://github.com/ToyOSOrg/rust_libloading", branch = "toyos-sdk-0.12" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0" }
memmap2 = "0.9"
# An HTTPS client as any Rust program writes one, for `https_get`, and the
# primitives under it, for `ring_kat`'s known answers.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false }
ring = "0.17"

# Outside the workspace, so it needs its own redirects: the forks
# above depend on ToyOS crates by version, and only a patch maps those to the
# working tree.
[patch.crates-io]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
memmap2 = { git = "https://github.com/ToyOSOrg/memmap2-rs", branch = "toyos-0.9.11" }
ring = { git = "https://github.com/ToyOSOrg/ring", branch = "toyos-0.17.14" }
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2-sdk-0.12", package = "getrandom" }

[lints.rust]
warnings = "deny"

# The guest profile. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true
