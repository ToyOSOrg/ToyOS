[package]
name = "toyos-rust-tests"
description = "The Rust programs the harness runs inside a ToyOS guest: one binary per test, and the helpers they spawn."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-window = { path = "../../userland/toyos-window" }
toyos-tco = { path = "../../toyos-tco" }
toyos-inspect = { path = "../../toyos-inspect" }
# The log as logkeeper serves it, for `counters_metal`'s wait on the log being quiet.
toyos-logstream = { path = "../../toyos-logstream" }
# The reader's asker, for `hda_client_stall`.
inspect = { path = "../../userland/inspect" }
libloading = { git = "https://github.com/ToyOSOrg/rust_libloading", branch = "toyos-sdk-0.12" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0" }
memmap2 = "0.9"

# Separate workspace from userland/, so it needs its own redirects: the forks
# above depend on ToyOS crates by version, and only a patch maps those to the
# working tree.
[patch.crates-io]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
memmap2 = { git = "https://github.com/ToyOSOrg/memmap2-rs", branch = "toyos-0.9.11" }

[lints.rust]
warnings = "deny"

# The guest profile. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true
