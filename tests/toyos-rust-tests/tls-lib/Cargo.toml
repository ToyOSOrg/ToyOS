[package]
name = "tls-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[lints.rust]
warnings = "deny"

# The guest profile. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true
