# The boot `fsd_restart` judges: the test estate's shape, with every file
# server armed to end the moment it has taken a write through a file opened to
# append at `/home/fsd_end` and before it answers it, and at the first hello
# on `/apps` this boot — `test_rs_fs_restart` ends DATA's four times, the
# first through a launch init resolves, and init restarts it three.

[boot]
start = ["logd", "blockd", "fsd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

# `power` because `run shutdown` asks init through the `power` connector, and
# the host reads the DATA partition back once the machine is down; `launcher`
# for the launch of an `/apps` path the test ends DATA's server under.
[programs.test-runner]
receives = ["power", "launcher"]
syscap = ["dup", "logread", "power"]

# `power` for `run shutdown`, which the test-runner launches through init.
[programs.toybox]
receives = ["power"]

[symlinks]
"bin/shutdown" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports. `--end-on` and `--end-at-hello` are the test's
# actuators: a path on the DATA volume and a directory of DATA's, which
# neither other role's volume carries.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
args = ["--end-on", "home/fsd_end", "--end-at-hello", "/apps"]
