# `tests/lanaskcase` with a trail on both sides: netd's `--exit-with-ask-crumbs`
# puts the same question to §4.5.2's MDIO arbitration — same register, same bit,
# same order, same values — and appends one line to `/log/crumbs.txt` and
# flushes it to the stick immediately before and immediately after every
# register access from `EXTCNF_CTRL` on, and around the dwell it ends on. The
# card is never brought up on this boot. On a machine that dies inside one of
# those accesses, the last durable line names it. Like `tests/lancase`, nothing
# here reaches the internal NVMe: no `[disks]` row, and the only device any
# program claims is the PCI function named below.

[boot]
start = ["logd", "netd", "test-runner"]

[programs.logd]
syscap = ["logread"]

[programs.netd]
serves = ["netd"]
devices = ["pci:8086:15fc"]
args = ["--exit-with-ask-crumbs"]

[programs.test-runner]
syscap = ["logread"]
