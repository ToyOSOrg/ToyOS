# `tests/lancase` with netd's PHY probe armed, and nothing else: netd ends
# right after the bring-up with the PHY's outcome as its exit code, which the
# kernel's `exit:` record carries off a machine whose console reaches nobody.
# Like `tests/lancase`, nothing here reaches the internal NVMe: no `[disks]`
# row, and the only device any program claims is the PCI function named below.

[boot]
start = ["logd", "netd", "test-runner"]

[programs.logd]
syscap = ["logread"]

[programs.netd]
serves = ["netd"]
devices = ["pci:8086:15fc"]
args = ["--exit-with-phy-outcome"]

[programs.test-runner]
syscap = ["logread"]
