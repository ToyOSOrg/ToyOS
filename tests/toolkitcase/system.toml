# A desktop with a shell, for the clients the `toolkit_` tests carry and
# launch from it: an unmodified iced app, and the winit and waiter probes.

assets = ["assets"]

[boot]
start = ["logd", "blockd", "fsd", "compositor", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does — `every_boot_config_runs_logd` is what refuses one without.
[programs.logd]
syscap = ["logread"]

[programs.compositor]
service = true
serves = ["compositor"]
receives = ["launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["compositor", "surface", "launcher"]

# `stats` spawns the app and reports its CPU and peak memory once it leaves.
[programs.toybox]
receives = ["compositor", "surface"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/stats" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
