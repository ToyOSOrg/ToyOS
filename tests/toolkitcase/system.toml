# A desktop with a shell, and an unmodified iced app — the toolkit's own
# window, event loop, text and renderer, on the system fonts — beside the
# winit and waiter clients the `toolkit_` tests carry.
#
# The app is here and not in the shipping `system.toml`: it is a fixture for
# `toolkit_iced`.

assets = ["assets"]

[boot]
start = ["logd", "compositor", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does — `every_boot_config_runs_logd` is what refuses one without.
[programs.logd]
syscap = ["logread"]

[programs.compositor]
serves = ["compositor"]
receives = ["launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["compositor", "surface", "launcher"]

# `stats` spawns the app and reports its CPU and peak memory once it leaves.
[programs.toybox]
receives = ["compositor", "surface"]

[programs.iced-counter]
receives = ["compositor"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/stats" = "/system/bin/toybox"
