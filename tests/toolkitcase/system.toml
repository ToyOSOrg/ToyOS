# A desktop with a shell, and one unmodified app from each of iced, slint and
# egui — the third-party toolkits' own window, event loop, text and renderer,
# on the system fonts.
#
# The apps are here and not in the shipping `system.toml`: they are fixtures
# for `toolkit_*`, and slint is GPL-3.0 or its own royalty-free terms, which is
# an installable app's business and never the image's.

assets = ["assets"]

[boot]
start = ["logd", "compositor", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does — `every_boot_config_runs_logd` is what refuses one without.
[programs.logd]
syscap = ["logread"]

[programs.compositor]
serves = ["compositor"]
receives = ["launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["compositor", "surface", "launcher"]

# `stats` spawns the app and reports its CPU and peak memory once it leaves.
[programs.toybox]
receives = ["compositor", "surface"]

[programs.iced-counter]
receives = ["compositor"]

[programs.slint-hello]
receives = ["compositor"]

[programs.egui-hello]
receives = ["compositor"]

[symlinks]
"bin/echo" = "/system/bin/toybox"
"bin/stats" = "/system/bin/toybox"
