# The one boot that runs sshd with a network under it.
#
# sshd binds before it reads anything of its own, so on every other config it
# leaves at the bind: metal-sim has no NIC by design, and no other test image
# builds it at all. Between them nothing in the suite ever reached a line of
# the daemon past that bind — not the host key it mints, not the file it
# authenticates against.
#
# Its own config rather than a fourth program in `tests/netcase`, because
# netcase's test measures how many connections netd will hold and sshd's bind
# would spend one of them.

[boot]
start = ["logd", "netd", "sshd", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

# netd holds the NIC's PCI function and drives it: the virtqueues, the register
# window and the interrupt are its own, and the kernel keeps only the claim.
[programs.netd]
serves = ["netd"]
devices = ["pci:1af4:1041"]

[programs.sshd]
receives = ["netd", "launcher"]

# `logread` is the log gate's own: a spawned test binary does not inherit a
# `SysCap` dup, so the gate that reads the kernel's records runs inside
# `test-runner` itself.
[programs.test-runner]
receives = ["netd"]
syscap = ["logread"]

# What `exec` is asked for over the cable. A program with no authority at all:
# it serves nothing, receives nothing and claims no device, so what an `exec`
# arm proves is that the daemon ran the named binary and reported how it ended
# — never that it handed it something.
[programs.toybox]

# Created on ROOT at build time, so `exec echo …` resolves the way it does on a
# real machine: a bare name is `/system/bin/<name>`, and `/system/bin/echo` is
# this symlink. One applet, because one is what the gate asks for.
[symlinks]
"bin/echo" = "/system/bin/toybox"
