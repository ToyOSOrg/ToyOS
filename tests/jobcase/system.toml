# A boot that ends itself: no host is on the other end of the console, so the
# job list is the manifest's own and the last thing it does is hand the machine
# back to firmware. This is the shape a T14 boot has.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

# One binary name per job, never a command line: the stdin path's `run <name>`
# has the only parser. `power` because the one job ends the machine, asking
# the supervisor.
[programs.test-runner]
receives = ["power"]
args = ["reboot"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
