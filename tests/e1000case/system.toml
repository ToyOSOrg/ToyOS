# The one boot that runs netd in front of an Intel NIC.
#
# QEMU's `e1000e` is the 82574L at `8086:10d3`, whose register file is the one
# the ThinkPad T14's onboard I219 at `8086:15fc` has, so this config is what
# stands between `toyos-i219`'s host tests and the laptop.
#
# It is a second directory rather than a second `devices` row on
# `tests/netcase`, because a program that names a card this machine does not
# have costs an `init:` refusal line on every boot of the config that does.

[boot]
start = ["logd", "blockd", "fsd", "netd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]
# What lets `logd` serve this boot's log on the network, to whoever connects:
# without it the log is served on this machine only.
receives = ["netd"]

# netd holds the NIC's PCI function and drives it: the descriptor rings, the
# register window and the interrupt are its own, and the kernel keeps only the
# claim. Named by vendor and device rather than by slot, so one row finds the
# card wherever firmware put it.
[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:10d3"]

[programs.test-runner]
receives = ["netd"]
syscap = ["logread"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
