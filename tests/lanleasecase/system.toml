# `tests/lancase` with netd's lease probe armed, and nothing else: netd brings
# the card up and serves exactly as that boot does, leaves what happened on the
# log volume one durable line at a time, and ends with the lease's verdict as
# its exit code — which the kernel's `exit:` record carries off a machine whose
# console reaches nobody. Like `tests/lancase`, nothing here reaches the
# internal NVMe: no `[disks]` row, and the only device any program claims is
# the PCI function named below.

[boot]
start = ["logd", "netd", "test-runner"]

[programs.logd]
service = true
syscap = ["logread"]

[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:8086:15fc"]
args = ["--exit-with-lease"]

[programs.test-runner]
syscap = ["logread"]
