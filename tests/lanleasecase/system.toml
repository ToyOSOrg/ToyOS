# netstack in front of the ThinkPad T14's own NIC with its lease probe armed: netstack
# brings the card up and serves, leaves what happened on the log volume one
# durable line at a time, and ends with the lease's verdict as its exit code —
# which the kernel's `exit:` record carries off a machine whose console reaches
# nobody. Nothing here reaches the internal NVMe: no `[disks]` row, and the
# only device any program claims is the PCI function named below.

[boot]
start = ["logkeeper", "diskserver", "fileserver", "netstack", "test-runner"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.netstack]
service = true
serves = ["netstack"]
devices = ["pci:8086:15fc"]
args = ["--exit-with-lease"]

[programs.test-runner]
syscap = ["logread"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.diskserver]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fileserver]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
