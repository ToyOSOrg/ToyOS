[package]
name = "toyos-rust-tests"
description = "The Rust programs the harness runs inside a ToyOS guest: one binary per test, and the helpers they spawn."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../../sdk/abi" }
toyos = { path = "../../../sdk/toyos", features = ["std"] }
toyos-window = { path = "../../../sdk/window" }
toyos-tco = { path = "../../../lib/tco" }
toyos-inspect = { path = "../../../lib/inspect" }
# The reader's question to netstack, for `link_failover`'s per-link counts.
inspect = { path = "../../../system/inspect" }
# A login session opened by a job, for `app_view`'s grants.
toyos-session = { path = "../../../lib/session" }
# The log as logkeeper serves it, and the asking for it, for `counters_metal`'s
# wait on the log being quiet.
toyos-logstream = { path = "../../../lib/logstream" }
logkeeper-api = { path = "../../../lib/logkeeper-api" }
# The ACPI server's lines, for `acpi_hold`'s and `acpi_counted`'s waits on them.
acpiserver-api = { path = "../../../lib/acpiserver-api" }
# The diary's decoder, for `trace_read` and `trace_flood`.
toyos-trace = { path = "../../../lib/trace" }
# The I219's driver, the claim's register window and grant, and the kernel's
# capability walk, for `i219_msi`'s judgement of its interrupts on the T14.
toyos-i219 = { path = "../../../system/i219/driver" }
toyos-device-memory = { path = "../../../lib/device-memory" }
toyos-pci-claim = { path = "../../../lib/pci-claim" }
toyos-pci = { path = "../../../kernel/pci" }
libloading = { git = "https://github.com/ToyOSOrg/rust_libloading", branch = "toyos-sdk-0.12" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0" }
# Its ToyOS selector and waker, which no program in the image builds, for
# `mio_waker_coalesces`.
mio = { git = "https://github.com/ToyOSOrg/mio", branch = "toyos", features = ["os-poll"] }
memmap2 = "0.9"
# `ring`'s primitives, for `ring_kat`'s known answers and as `crypto_parity`'s
# reference.
ring = "0.17"
# What `crypto_parity` measures beside ring, the rule it is judged by, its
# ML-KEM reference, and the system's random bytes, where ring takes them.
toyos-crypto = { path = "../../../lib/crypto", features = ["sign"] }
toyos-parity = { path = "../../../lib/parity" }
ml-kem = { version = "0.3", features = ["hazmat"] }
# The ecosystem's way to pin a thread, for `affinity_pins`: its ToyOS arm is
# what holds that existing Rust pins as it does on Linux.
core_affinity = "0.8"
getrandom = "0.2"

# Outside the workspace, so it needs its own redirects: the forks
# above depend on ToyOS crates by version, and only a patch maps those to the
# working tree.
[patch.crates-io]
toyos-abi = { path = "../../../sdk/abi" }
toyos = { path = "../../../sdk/toyos" }
memmap2 = { git = "https://github.com/ToyOSOrg/memmap2-rs", branch = "toyos-0.9.11" }
ring = { git = "https://github.com/ToyOSOrg/ring", branch = "toyos-0.17.14" }
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2-sdk-0.12", package = "getrandom" }
core_affinity = { git = "https://github.com/ToyOSOrg/core_affinity", branch = "toyos-0.8.3" }

[lints.rust]
warnings = "deny"

# The guest profile. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
# DWARF stays out of the image: symbols name a frame, and `debug = true` is kept
# for the codegen it decides.
strip = "debuginfo"
debug-assertions = true
overflow-checks = true

# `crypto_parity`'s second column: the same build with debug assertions off,
# which decides nothing. The build stages it as `crypto_parity_unasserted`.
[profile.toyos-unasserted]
inherits = "toyos"
debug-assertions = false
