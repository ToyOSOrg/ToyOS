[package]
name = "osbench"
description = "System benchmarks run unchanged on ToyOS and on Linux, so the two can be compared on one machine: one result line per measured distribution."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# The work and crunch groups' compression, pure Rust and the same code on both systems.
miniz_oxide = "0.9"
# The crunch group's hashing: ToyOS's own SHA-256, which its ssh server runs;
# and the internet group's TLS provider, with its types and its entropy.
toyos-crypto = { path = "../../../lib/crypto", features = ["std", "rustls-provider"] }
rustls = { version = "0.23.45", default-features = false }
getrandom = "0.3"
# The internet group's HTTPS, with webpki's roots, on toyos-crypto's provider.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# The crunch group's compile-like task: parsing Rust, with no compiler to load.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
# The LAN group's two ends, and the rules readings are judged by.
osbench-lan = { path = "lan" }
osbench-rules = { path = "rules" }

[target.'cfg(target_os = "toyos")'.dependencies]
toyos-abi = { path = "../../../sdk/abi" }
# Native IPC (ports, connections, endowments) and the observation rights the
# tail group reads the diary, the counters and the roster with.
toyos = { path = "../../../sdk/toyos", features = ["std"] }
toyos-trace = { path = "../../../lib/trace" }
# netstack's counters, which the LAN group's transfer rows report, asked as the reader asks.
inspect = { path = "../../../system/inspect" }
toyos-inspect = { path = "../../../lib/inspect" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The upstream compiler that builds the Linux side knows no ToyOS target.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("toyos"))'] }
