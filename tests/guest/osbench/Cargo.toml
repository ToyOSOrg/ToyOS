[package]
name = "osbench"
description = "Scheduler and system benchmarks run unchanged on ToyOS and on Linux, so the two can be compared on one machine: one result line per measured distribution."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[target.'cfg(target_os = "toyos")'.dependencies]
toyos-abi = { path = "../../../sdk/abi" }
toyos = { path = "../../../sdk/toyos" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The upstream compiler that builds the Linux side knows no ToyOS target.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("toyos"))'] }
