[package]
name = "osbench-compare"
description = "Compares osbench runs of ToyOS and Linux on one machine: each benchmark's per-run medians, each system's run-to-run range, their ratio and an exact rank test."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A package of its own because osbench builds for ToyOS and Linux alone, and
# its runs are compared wherever they are collected.

[lib]
doctest = false

[[bin]]
name = "osbench-compare"
path = "src/main.rs"
