[package]
name = "osbench-lan"
description = "osbench's LAN measurement, both ends: a bench finds its peer by broadcast and times TCP to it; the peer, `osbench-peer`, echoes, sinks and sources for it on any host."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A package of its own because osbench builds for ToyOS and Linux alone, and
# the peer runs on whatever machine stands on the other end of the link.

[lib]
doctest = false

[[bin]]
name = "osbench-peer"
path = "src/main.rs"
