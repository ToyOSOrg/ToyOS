# The metal-sim boot: what `Profile::Metal` puts in front of userland.
#
# soundd, netd and sshd are here for exactly the reason they have no device:
# their graceful exit is half of what this config certifies, and with a console
# `metal_sim_compositor` reads their exit lines rather than assuming them.
# sshd is the one whose absence *is* the device absence — it has no device of
# its own and reaches the machine's shape only through netd — and it was the
# one this config left out, so nothing anywhere ran the branch where it finds
# no network. It costs the boot the second `NetdConn::connect_blocking` spends
# retrying a netd that will never come, which is the price of certifying the
# line at all.
# test-runner makes the boot announce itself, so the harness waits for a
# marker instead of guessing from pixels — and it is what lets an in-guest
# binary run on the machine shape that gets flashed. Under `mute` it simply
# parks on a console that never produces a byte.

assets = ["assets"]

[boot]
start = ["logd", "blockd", "fsd", "compositor", "soundd", "netd", "sshd", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its row's authority is `logread`,
# which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and init hands
# it every program's output beside that.
[programs.logd]
service = true
syscap = ["logread"]

[programs.compositor]
service = true
serves = ["compositor"]
receives = ["soundd", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
service = true
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# netd holds the NIC's PCI function and drives it: the virtqueues, the register
# window and the interrupt are its own, and the kernel keeps only the claim.
[programs.netd]
service = true
serves = ["netd"]
devices = ["pci:1af4:1041"]

[programs.sshd]
service = true
receives = ["netd", "launcher"]

# The union its guest binaries need on this machine shape.
[programs.test-runner]
receives = ["compositor", "soundd", "netd"]
syscap = ["logread"]

# The block service: the NVMe controller this machine's DATA is on, driven
# from userland through its claim. Started again when it ends; the claim goes
# back with the process and is minted again for the next.
[programs.blockd]
service = true
restart = true
serves = ["block"]
devices = ["pci:1b36:0010"]

# The file servers: DATA, the log and the running slot's volume, one process
# each, serving every program the directories of its role. Started again when
# one ends, on the same ports.
[programs.fsd]
restart = true
roles = ["data", "log", "boot"]
receives = ["block"]
