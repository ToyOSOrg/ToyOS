# A member of the host workspace (root `Cargo.toml`), like toyos-gpt and
# toyos-pci: the kernel depends on it by path and its tests run on the host.
# What lives here decodes bytes *firmware* wrote, at addresses firmware chose,
# and hands the answer to the code that decides which CPUs this machine brings
# up. A boot that works exercises exactly one firmware; the tables of every
# other one are reachable only from a host test over bytes.

[package]
name = "toyos-acpi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
