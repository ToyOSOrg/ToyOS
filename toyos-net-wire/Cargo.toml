# A member of the host workspace (root `Cargo.toml`). Nothing ships it yet: it
# is the wire-format ring of ToyOS's own TCP/IP stack, and netd takes it when
# the stack replaces smoltcp (`issues/design-debt/toyos-has-its-own-network-stack.md`).
# Every byte it parses came off a network, so its tests and its fuzzer run where
# they cost milliseconds rather than a boot.

[package]
name = "toyos-net-wire"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
