[package]
name = "bcachefs"
description = "The /home filesystem: a read side of the real bcachefs on-disk format, and the interim ToyOS format the kernel still links."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []

# Decompresses the committed fixtures. Already in the lockfile, and a
# dev-dependency only: nothing the kernel links pulls it in.
[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
