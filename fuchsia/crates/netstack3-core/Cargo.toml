[package]
name = "netstack3-core"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[lib]
path = "../../upstream/src/connectivity/network/netstack3/core/src/lib.rs"

[features]

[dependencies]
zerocopy = { version = "0.8.48", features = ["derive"] }
net-types = { path = "../net-types" }
packet-formats = { path = "../packet-formats" }
packet = { path = "../packet" }
lock-order = { path = "../lock-order" }
netstack3-hashmap = { path = "../netstack3-hashmap" }
netstack3-macros = { path = "../netstack3-macros" }
explicit = { path = "../explicit" }
netstack3-base = { path = "../netstack3-base" }
netstack3-filter = { path = "../netstack3-filter" }
netstack3-ip = { path = "../netstack3-ip" }
netstack3-trace = { path = "../netstack3-trace" }
netstack3-device = { path = "../netstack3-device" }
netstack3-datagram = { path = "../netstack3-datagram" }
netstack3-udp = { path = "../netstack3-udp" }
netstack3-icmp-echo = { path = "../netstack3-icmp-echo" }
netstack3-tcp = { path = "../netstack3-tcp" }
netstack3-sync = { path = "../netstack3-sync" }
assert_matches = "1.5.0"
derivative = { version = "2.2.0", features = ["use_core"] }
log = "0.4.29"

[lints.rust]
unexpected_cfgs = { level = "allow" }
