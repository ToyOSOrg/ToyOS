# A member of the host workspace (root `Cargo.toml`), like toyos-tco: the two
# things that decide where a band lands and what colour it is are arithmetic,
# and the two binaries that paint one are built for different targets. The
# bootloader and the kernel both depend on this by path.

[package]
name = "toyos-crumbs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../toyos-abi" }
