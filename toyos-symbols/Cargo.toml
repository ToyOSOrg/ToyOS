# A member of the host workspace (root `Cargo.toml`), like toyos-elf and
# toyos-gpt: the kernel and `userland/symbolize` depend on it by path and its
# tests run on the host, with no target-triple juggling. What lives here is
# every pure decision a backtrace frame needs over bytes: where in an ELF file
# its symbol tables live, how much of the record's budget a demangled name
# gets, the record a killed program's frame is written as, and the function a
# recorded offset names. The kernel keeps the raw-pointer table of its own symbols — it has to
# be readable from a panic, a double fault and an NMI, which is a static this
# crate cannot own and an `unsafe` this crate does not need.

[package]
name = "toyos-symbols"
description = "Backtrace frames: locating an ELF's symbol tables, budgeting the demangled name, and a killed program's file+offset record and its naming (no_std, no alloc, forbid(unsafe_code))."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
rustc-demangle = "0.1"
toyos-abi = { path = "../toyos-abi" }
toyos-elf = { path = "../toyos-elf" }
toyos-elide = { path = "../toyos-elide" }

[dev-dependencies]
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
