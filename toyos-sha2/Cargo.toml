[package]
name = "toyos-sha2"
description = "SHA-256 and SHA-512 from FIPS 180-4, scalar, and the buffering and padding toyos-sha2-hw's instruction path compresses inside: pure."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
# The differential oracle: RustCrypto's implementation, which shares no code
# with this crate. Already resolved here, where `ed25519-dalek` hashes with it.
sha2 = "0.10"
