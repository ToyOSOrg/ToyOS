[package]
name = "toyos-abi"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The ToyOS kernel ABI: syscall numbers, struct layouts and typed syscall wrappers."
repository = "https://github.com/ToyOSOrg/ToyOS"

[features]
rustc-dep-of-std = ["core"]

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
