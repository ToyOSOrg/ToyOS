disallowed-methods = [
    { path = "alloc::sync::Arc::into_raw", reason = "an object's lifetime is its Arc's, and a raw pointer out of one is a refcount nobody owns" },
    { path = "alloc::sync::Arc::from_raw", reason = "the other half of a refcount nobody owns" },
    { path = "alloc::sync::Arc::increment_strong_count", reason = "hand-rolled refcounting is the bug class the object layer deletes" },
    { path = "alloc::sync::Arc::decrement_strong_count", reason = "hand-rolled refcounting, and the half that frees" },
    { path = "core::mem::forget", reason = "a resource nobody gives back is a leak unless its site says why" },
    { path = "uefi::table::boot::BootServices::open_protocol_exclusive", reason = "EXCLUSIVE stops every driver holding the protocol, the firmware's graphics console among them: open through `exclusive::open`" },
]
