# A member of the host workspace (root `Cargo.toml`): the kernel depends on it
# by path and its tests run on the host. What lives here is every decision
# `kernel/src/block.rs` makes about a device's spans — who holds which, and
# whose flush answers for writes the disk lost. Its defects are orders of
# writes, flushes, departures and releases across several writers, and the
# only other machine that reaches one is a booted guest with a USB stick moved
# under it.

[package]
name = "toyos-blockhold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
