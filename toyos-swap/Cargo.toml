[package]
name = "toyos-swap"
description = "Replacing a running service's binary: what swap and the supervisor say about it, and the supervisor's decisions, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# The program-key bound a service name is held to, which is the manifest's.
toyos-manifest = { path = "../toyos-manifest" }
# The digest a swap is verified by.
toyos-sha2-hw = { path = "../toyos-sha2-hw" }
