# A member of the host workspace (root `Cargo.toml`), like toyos-desktop and
# toyos-hda: its tests run on the host with no target-triple juggling, and
# soundserver depends on it by path. What lives here is every decision soundserver makes
# about *samples* — decode, channel conversion, gain, the sum on the shared bus,
# dither and quantize — and the arithmetic those rest on.
#
# No dependencies, deliberately. `toyos-abi` is not one either: nothing here
# names a syscall, a handle or a shared-memory layout — a period arrives as a
# `&[u8]` and leaves as a `&mut [i16]`, and both belong to the caller.

[package]
name = "toyos-mixer"
description = "The mixer's decisions (samples, gain, dither, quantize), pure and corpus-certified."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lints.rust]
warnings = "deny"
