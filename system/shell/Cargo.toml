[package]
name = "shell"
description = "ToyOS's command-line shell."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos", features = ["std"] }
# The quit a `-c` shell asks of a child spawned past its own interrupt.
toyos-abi = { path = "../../sdk/abi" }

[package.metadata.toyos.host]
fails = ["linux", "macos", "windows"]
issue = "issues/apps-that-build-or-run-on-toyos-alone.md"
