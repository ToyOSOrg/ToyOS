[package]
name = "logkeeper"
description = "The machine's log: the kernel's records and every program's, written to /log by a process that can die without taking the kernel with it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos" }
toyos-abi = { path = "../../sdk/abi" }
toyos-logstream = { path = "../../lib/logstream" }
# The per-program allowance: how many records a second a program may put in the log.
toyos-elide = { path = "../../lib/elide" }
toyos-inspect = { path = "../../lib/inspect" }
toyos-wallclock = { path = "../../lib/wallclock" }

[package.metadata.toyos.host]
exempt.owns = "the kernel's record ring, read under the `logread` SysCap"
