[package]
name = "symbolize"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Names the frames of a killed program's crash record: the file and offset the kernel recorded, looked up in that file's own symbol table."

[dependencies]
toyos-symbols = { path = "../../lib/symbols" }
# The one ELF parser.
toyos = { path = "../../sdk/toyos" }

[dev-dependencies]
# The namer's outside judge: unaligned, since an include_bytes! fixture is
# aligned to 1 and object reads a header in place.
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
