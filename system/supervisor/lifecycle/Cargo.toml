[package]
name = "toyos-supervisor"
description = "The supervisor's lifecycle decisions, pure: which PCI functions a drives row has a process on, the function a devices entry names, and when an ended process is started again."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[dependencies]
toyos-abi = { path = "../../../sdk/abi" }
toyos-manifest = { path = "../../../lib/manifest" }

[lints.rust]
warnings = "deny"
