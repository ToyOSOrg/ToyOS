[package]
name = "supervisor"
description = "The one program the kernel starts: it builds every program's namespace and device claims from /system/etc/system.manifest and starts it."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos" }
toyos-abi = { path = "../../sdk/abi" }
toyos-manifest = { path = "../../lib/manifest" }
# Its lifecycle decisions: what an end owes, which claims a start mints, and
# which functions a `drives` row has a process on.
toyos-supervisor = { path = "lifecycle" }
toyos-osrelease = { path = "../../sdk/osrelease" }
toyos-wallclock = { path = "../../lib/wallclock" }
toyos-logstream = { path = "../../lib/logstream" }
toyos-swap = { path = "../../lib/swap" }
# The slot table and which slot is idle, for the one row that asks for it.
toyos-update = { path = "../../lib/update" }
# The partition types that name the running ROOT and the slot table.
toyos-gpt = { path = "../../lib/gpt" }
# The block service's port name, which marks a storage row, and the grant
# every connector to it is minted with.
toyos-blockring = { path = "../../lib/blockring" }
# The slot table, read through a session where the block service serves it.
diskserver = { path = "../diskserver" }
# How long a stop is prepared before the kernel is asked for it.
toyos-quiesce = { path = "../../lib/quiesce" }

[package.metadata.toyos.host]
exempt.owns = "the machine's system capability: the kernel starts it, and it builds every program's namespace"
