# A member of the host workspace (root `Cargo.toml`): pure, and its tests run
# on the host. The handshakes `wlan` runs with an access point, sans-IO.

[package]
name = "toyos-wlan-handshake"
description = "The WPA2-Personal supplicant's 4-way and group key handshakes over EAPOL-Key frames, sans-IO, refusing hostile frames by name (no_std with alloc, forbid(unsafe_code))."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
toyos-crypto = { path = "../../../lib/crypto", features = ["wpa2"] }
toyos-ieee80211 = { path = "../../../lib/ieee80211" }

# The test authenticator's HMAC-SHA1 (ring) and AES block cipher (aes), from
# code other than toyos-crypto's; its PRF and key wrap are the tests' own.
[dev-dependencies]
ring = "0.17.14"
aes = "0.8.4"

[lints.rust]
warnings = "deny"
