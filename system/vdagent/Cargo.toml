[package]
name = "vdagent"
description = "The shared clipboard with QEMU's host: the virtio-serial function its vdagent chardev is on, claimed from the kernel and driven here, bridged to the compositor's clipboard."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
toyos = { path = "../../sdk/toyos" }
toyos-vdagent = { path = "../../lib/vdagent" }
toyos-virtio-serial = { path = "../../lib/virtio-serial" }
toyos-virtio-serial-claim = { path = "../../lib/virtio-serial/claim" }
toyos-vdagent-bridge = { path = "bridge" }
toyos-manifest = { path = "../../lib/manifest" }
toyos-window = { path = "../../sdk/window" }

[package.metadata.toyos.host]
exempt.owns = "the virtio-serial function QEMU's clipboard channel is on, and the compositor's clipboard port"
