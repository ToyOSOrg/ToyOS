[package]
name = "compositor"
description = "The desktop's display server: it drives the display, keyboard and mouse it claims, composes its clients' windows and hands finished rectangles to the panel."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sprite = { path = "sprite" }
toyos = { path = "../../sdk/toyos" }
toyos-abi = { path = "../../sdk/abi" }
toyos-desktop = { path = "desktop" }
toyos-edid = { path = "../../lib/edid" }
toyos-input = { path = "../../lib/input" }
toyos-inspect = { path = "../../lib/inspect" }
toyos-font = { path = "../../sdk/font" }
toyos-manifest = { path = "../../lib/manifest" }
toyos-pci-claim = { path = "../../lib/pci-claim" }
toyos-virtio = { path = "../../lib/virtio" }
toyos-virtio-gpu = { path = "virtio-gpu" }
toyos-window = { path = "../../sdk/window" }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's display, keyboard and mouse: a virtio-gpu function or the framebuffer, claimed from the kernel"
