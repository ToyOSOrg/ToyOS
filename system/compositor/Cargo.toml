[package]
name = "compositor"
description = "The desktop's display server: it claims the framebuffer, keyboard and mouse, composes its clients' windows and hands finished rectangles to the panel."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sprite = { path = "sprite" }
toyos = { path = "../../sdk/toyos" }
toyos-abi = { path = "../../sdk/abi" }
toyos-desktop = { path = "desktop" }
toyos-edid = { path = "../../lib/edid" }
toyos-input = { path = "../../lib/input" }
toyos-inspect = { path = "../../lib/inspect" }
toyos-font = { path = "../../sdk/font" }
toyos-manifest = { path = "../../lib/manifest" }
toyos-window = { path = "../../sdk/window" }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's framebuffer, keyboard and mouse, claimed from the kernel"
