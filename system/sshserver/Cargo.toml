[package]
name = "sshserver"
description = "The machine's SSH server: a shell, a command, and files both ways over SFTP."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.10"
russh = { version = "0.60", default-features = false, features = ["rustcrypto", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "sync", "time"] }

[dev-dependencies]
# Test scratch that is gone on every way out; `--ci host` reds on any left behind.
toyos-tmpdir = { path = "../../lib/tmpdir" }

[lints.rust]
# The guest's target, whose `ExitStatusExt` names the signal that ended a child.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("toyos"))'] }
