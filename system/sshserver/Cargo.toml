[package]
name = "sshserver"
description = "The machine's SSH server: a shell, a command, and files both ways over SFTP."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# The protocol: everything a client's bytes touch before a program runs.
toyos-ssh = { path = "../../lib/ssh" }
# `Random`'s error, which the operating system's randomness answers with.
toyos-crypto = { path = "../../lib/crypto" }
# The operating system's randomness, for the protocol and a minted host key.
getrandom = "0.3"

[dev-dependencies]
# Test scratch that is gone on every way out; `--ci host` reds on any left behind.
toyos-tmpdir = { path = "../../lib/tmpdir" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("toyos"))'] }

[target.'cfg(target_os = "toyos")'.dependencies]
toyos = { path = "../../sdk/toyos", features = ["std"] }
# The handle a channel's end asks its program to quit through.
toyos-abi = { path = "../../sdk/abi" }
# Opening a login session per connection, and signing it out.
toyos-session = { path = "../../lib/session" }
