[package]
name = "acpiserver"
description = "The machine's ACPI, served from userland: its AML loaded, the PCI root bridges' memory declared, and the SCI, the power button and the embedded controller's events."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos" }
toyos-abi = { path = "../../sdk/abi" }
# The tables' decode, which the kernel reads its own of by.
toyos-acpi = { path = "../../lib/acpi" }
toyos-aml = { path = "aml" }
# Its own lines, as their readers spell them.
acpiserver-api = { path = "../../lib/acpiserver-api" }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's ACPI fixed hardware, claimed from the kernel with the SCI it raises"
