[package]
name = "console"
description = "The machine's console: /system/bin/shell on the raw framebuffer below this boot's log, for a machine with no serial port and no compositor."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
terminal = { path = "../terminal" }
toyos = { path = "../../sdk/toyos", features = ["std"] }
toyos-abi = { path = "../../sdk/abi" }
toyos-input = { path = "../../lib/input" }
toyos-font = { path = "../../sdk/font" }
toyos-window = { path = "../../sdk/window" }
toyos-logstream = { path = "../../lib/logstream" }
logkeeper-api = { path = "../../lib/logkeeper-api" }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's framebuffer, keyboard and mouse, claimed from the kernel, on which it runs the shell"
