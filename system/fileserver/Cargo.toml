[package]
name = "fileserver"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ToyOS's file server: one process per storage role — ROOT, DATA, the log or the boot volume — serves that role's paths."

# The library is the server's decisions — the block cache, the volumes and the
# resolver — so the host can test them; the service is `src/main.rs`.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fileserver"
path = "src/main.rs"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
toyos = { path = "../../sdk/toyos" }
toyos-manifest = { path = "../../lib/manifest" }
toyos-osrelease = { path = "../../sdk/osrelease" }
toyos-blockring = { path = "../../lib/blockring" }
toyos-gpt = { path = "../../lib/gpt" }
toyos-fat32 = { path = "../../lib/fat32" }
bcachefs = { path = "../../lib/bcachefs" }
diskserver = { path = "../diskserver" }
toyos-blockdev = { path = "../../lib/blockdev" }

[dev-dependencies]
# The volumes the FAT role leaves, judged by the checker that shares no code
# with the driver it wrote them with.
toyos-fat32-check = { path = "../../lib/fat32/check" }
# The draws a test ROOT's mkfs takes.
toyos-crypto = { path = "../../lib/crypto" }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's storage roles, served from the partitions ToyOS claims for it"
