[package]
name = "toyos-net-shard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "One shard of ToyOS's network stack, pure: toyos-net-ip, toyos-net-tcp and toyos-net-udp over every interface the caller adds, frames in by interface and frames pulled out with each link's credit."
publish = false

[dependencies]
toyos-net-ip = { path = "../ip" }
toyos-net-tcp = { path = "tcp" }
toyos-net-udp = { path = "../udp" }
toyos-net-wire = { path = "../wire" }

[dev-dependencies]
toyos-net-testnet = { path = "testnet" }
