[package]
name = "netstack"
description = "The network server: ToyOS's own stack (toyos-net-node) over the link a NIC driver brings, its DHCP lease, resolver and mDNS name, served to programs over IPC."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
toyos = { path = "../../sdk/toyos" }
toyos-link = { path = "../../lib/link" }
toyos-tco = { path = "../../lib/tco" }
toyos-mdns = { path = "mdns" }
toyos-dns = { path = "dns" }
toyos-dhcp = { path = "dhcp" }
toyos-inspect = { path = "../../lib/inspect" }
toyos-net-node = { path = "node" }
toyos-net-ip = { path = "ip" }
toyos-net-shard = { path = "shard" }
toyos-net-tcp = { path = "shard/tcp" }
toyos-net-udp = { path = "udp" }
toyos-net-wire = { path = "wire" }

[package.metadata.toyos.host]
exempt.manages = "the machine's network stack, over the links ToyOS's NIC drivers bring"
