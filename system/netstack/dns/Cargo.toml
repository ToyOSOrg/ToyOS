# A member of the host workspace (root `Cargo.toml`): netstack resolves with it on
# the guest, and its tests run on the host. What lives here is every decision a
# stub resolver makes — the question, which datagram answers it, what the
# answer says, when to ask again, how long an answer is kept and for whom —
# pure, so each is checked without a network.

[package]
name = "toyos-dns"
description = "A stub DNS resolver's decisions (RFC 1035): the question, which datagram answers it, what it says, when to ask again, and how long an answer is kept, and for whom, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
