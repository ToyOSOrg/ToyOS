[package]
name = "toyos-net-node"
description = "Netstack's decisions, pure: one interface of ToyOS's own stack, its DHCP lease, its clients' datagram sockets, streams and listeners and the one bound on all three, its mDNS name and its resolver, frames and time in, frames out against the device's credit."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
toyos-dhcp = { path = "../dhcp" }
toyos-dns = { path = "../dns" }
toyos-mdns = { path = "../mdns" }
toyos-net-ip = { path = "../ip" }
toyos-net-shard = { path = "../shard" }
toyos-net-tcp = { path = "../shard/tcp" }
toyos-net-udp = { path = "../udp" }
toyos-net-wire = { path = "../wire" }
# The stream protocol's one declaration, the region's layout, and the session's server end.
toyos = { path = "../../../sdk/toyos" }
toyos-transport = { path = "../../../sdk/transport" }

[dev-dependencies]
# The outside reader of every frame the node emits: a published Ethernet, ARP,
# IPv4, UDP and ICMP parser, used as a black box.
etherparse = "0.21.0"
# The host's own TCP as an oracle, on Linux, macOS and Windows alike, with no
# `unsafe`: `socket2` sets and reads a socket option std has no call for on a
# listener, and `mio` waits until a listener has a connection to accept, which
# std can learn only by accepting it.
mio = { version = "1", default-features = false, features = ["os-poll", "net"] }
socket2 = "0.6"
