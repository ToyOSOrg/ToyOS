# A member of the host workspace (root `Cargo.toml`), like toyos-i219: pure,
# and its tests run on the host against `model.rs`, a display engine written
# from Intel's Tiger Lake references.

[package]
name = "toyos-tgl-display"
description = "Every decision the Tiger Lake display driver makes, and none of the instructions that carry them out."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `Registers`: the boundary every userland driver is written against.
toyos-device-memory = { path = "../../../lib/device-memory" }
