[package]
name = "tgl-display"
description = "The Tiger Lake display driver: one process for the iGPU's display function, holding its claim and programming the display engine's power on the firmware's surface."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
toyos = { path = "../../sdk/toyos" }
toyos-device-memory = { path = "../../lib/device-memory" }
toyos-manifest = { path = "../../lib/manifest" }
toyos-pci-claim = { path = "../../lib/pci-claim" }
toyos-tgl-display = { path = "driver" }

[package.metadata.toyos.host]
exempt.owns = "the Tiger Lake iGPU's display function, claimed from the kernel, and the display engine's power programming"
