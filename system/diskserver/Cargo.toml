[package]
name = "diskserver"
description = "The block service: every partition a disk driver offers, listed and opened for the clients its grants admit, each session handed to its driver; the library is what a client links."
edition = "2024"
license = "MIT OR Apache-2.0"

# The library is what a client of the service needs — the session and a
# partition's blocks — so a program that opens a partition links it and
# nothing of the service.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "diskserver"
path = "src/main.rs"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
toyos = { path = "../../sdk/toyos" }
toyos-blockring = { path = "../../lib/blockring" }
# The session region, which a client maps as its driver does.
toyos-blockserve = { path = "../../lib/blockserve" }
# The device a served partition is.
toyos-blockdev = { path = "../../lib/blockdev" }
# The `--active` partitions, named as GUID text.
toyos-gpt = { path = "../../lib/gpt" }

[package.metadata.toyos.host]
exempt.owns = "the block service between ToyOS disk drivers and their clients"
