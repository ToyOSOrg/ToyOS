[package]
name = "terminal"
description = "A shell in a window: the terminal emulator, a library the console shares, and the program that runs it under the compositor."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos", features = ["std"] }
# The quit a closed window asks of the shell, by the handle std's `Child` holds.
toyos-abi = { path = "../../sdk/abi" }
toyos-font = { path = "../../sdk/font" }
toyos-window = { path = "../../sdk/window" }

[lib]
doctest = false

[package.metadata.toyos.host]
fails = ["linux", "macos", "windows"]
issue = "issues/apps-that-build-or-run-on-toyos-alone.md"
