[package]
name = "soundserver"
description = "The audio server: every client's stream mixed onto the output an audio driver offers on its sound-output port, or onto the virtio-sound function it claims itself."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../sdk/abi" }
# The matcher its claim is endowed under, spelled as the manifest spells it.
toyos-manifest = { path = "../../lib/manifest" }
toyos = { path = "../../sdk/toyos" }
toyos-sound-output = { path = "output" }
toyos-mixer = { path = "mixer" }
toyos-virtio-sound = { path = "virtio-sound" }
toyos-virtio = { path = "../../lib/virtio" }
toyos-pci-claim = { path = "../../lib/pci-claim" }
toyos-inspect = { path = "../../lib/inspect" }
toyos-resample = { path = "resample" }
rubato = { version = "0.16", default-features = false }

[package.metadata.toyos.host]
exempt.owns = "ToyOS's audio outputs: the drivers' offers on its sound-output port, and the virtio-sound function it claims"
