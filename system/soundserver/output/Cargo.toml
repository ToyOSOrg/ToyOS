# A member of the host workspace (root `Cargo.toml`), like `toyos-mixer`
# beside it: pure, and its tests run on the host. Every frame a driver or
# soundserver reads off the other is decoded here, once.

[package]
name = "toyos-sound-output"
description = "soundserver's output protocol: what an audio driver process offers on the sound-output port, the ring soundserver lends it, and the periods it reports played."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
# The device rates soundserver mixes at, best first: an offer at another is
# refused.
toyos-mixer = { path = "../mixer" }

[lints.rust]
warnings = "deny"
