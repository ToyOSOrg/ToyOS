[package]
name = "disks"
description = "List disks and explicitly initialize DATA through the block service under signed-image authorizations."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../sdk/toyos" }
toyos-blockring = { path = "../../lib/blockring" }
toyos-gpt = { path = "../../lib/gpt" }
toyos-manifest = { path = "../../lib/manifest" }
diskserver = { path = "../diskserver" }
bcachefs = { path = "../../lib/bcachefs" }
toyos-blockdev = { path = "../../lib/blockdev" }
toyos-blockserve = { path = "../../lib/blockserve" }
toyos-crypto = { path = "../../lib/crypto" }
getrandom = "0.3"

[package.metadata.toyos.host]
exempt.manages = "ToyOS's disks, through the block capabilities its signed-image row receives"
