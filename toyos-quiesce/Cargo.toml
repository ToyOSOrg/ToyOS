# A member of the host workspace (root `Cargo.toml`), like toyos-proclife and
# toyos-userbound: the kernel depends on it by path and its tests run on the
# host. What lives here is every decision the machine's stop makes — which
# thread must stop, when the stop is complete, and what the record says — and
# none of its effects, which are `kernel/src/quiesce.rs`'s.

[package]
name = "toyos-quiesce"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
