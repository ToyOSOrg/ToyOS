# A member of the host workspace (root `Cargo.toml`), like toyos-gpt and
# toyos-tco: the bootloader and the kernel depend on it by path and its tests
# run on the host.
# What lives here decides where a transient page table puts a machine's memory
# and its scanout, and how far the kernel's own direct map reaches — decisions
# with no instrument on the machine that gets them wrong, since a boot that
# mislays the panel says nothing about why.

[package]
name = "toyos-bootmap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
toyos-abi = { path = "../toyos-abi" }
