# A member of the host workspace (root `Cargo.toml`), like toyos-gpt and
# toyos-tco: the bootloader depends on it by path and its tests run on the host.
# What lives here decides where a transient page table puts a machine's memory
# and its scanout — a decision with no instrument on the machine that gets it
# wrong, since a boot that mislays the panel says nothing about why.

[package]
name = "toyos-bootmap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
