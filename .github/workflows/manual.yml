name: manual

# The manual (`docs/`) on GitHub Pages, from main and nothing else: a pull
# request never publishes it. mdBook is built from crates.io at a pinned
# version, with no cache.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - run: cargo install mdbook --version 0.5.4 --locked

      - run: mdbook build docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/manual

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The newest push publishes; one in progress is never cancelled half-way.
    concurrency:
      group: manual
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
