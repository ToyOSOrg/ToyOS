name: host tests

# The host suites, which own pure logic — decoders, validators, layouts, the
# build system's own gates, and the memory orderings x86 TSO hides
# (kernel-loom) — and are blind to everything that requires a booted kernel:
# everything that needs no ToyOS toolchain and boots no guest, so it answers
# before the toolchain job has finished restoring one.
#
# macOS because the dev host is macOS and `toyos-fat32` still builds its
# volumes with `newfs_msdos` and `hdiutil` — the judge is ours now
# (`toyos-fat32-check`), so that is the only macOS-only thing left here.
#
# `03:05 UTC`, five minutes behind `ci.yml`'s `03:00`; `nightly-red.sh`'s
# find-by-title idempotency, not the offset, is what guards against the two
# scheduled runs racing to open the same standing issue.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

# The nightly run gets its own group, same reason as `ci.yml`'s: a push to
# `main` must not be cancelled by, or wait behind, a scheduled run. And a push
# to `main` must not cancel the previous push's validation either — the
# merge-health backfill measured 8 of 27 landings whose required run this
# unconditional cancel killed before it started, which is how a red tip hides.
# Same guard `ci.yml` already carries.
concurrency:
  group: host-tests-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  host:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Full history: the issue tracker's citation gate derives deleted slugs
      # from `git log` and refuses to run over a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # `macos-latest` ships whatever toolchain it ships — this job installs
      # none — so the version is written to the job summary every run, pass or
      # red, rather than sitting only in a log nobody opens until it rolls.
      - name: rust
        run: |
          rustc -vV
          cargo -V
          { echo '```'; rustc -vV; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Cold, this job is 398 s and all of it is compilation — 594 s before the
      # host workspace, measured the same way, on the run that introduced it
      # (the eighteen deleted member lockfiles moved `hashFiles`, so that run
      # restored nothing and is a clean cold reading). The three steps below
      # were 133 s, 184 s and 48 s of it. A cache written on `main` is readable
      # from every branch, which is the only reason this helps a branch's first
      # run at all.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # One `target` per workspace, which is all there is: a member builds
          # into its workspace root's `target`, never its own. The sixteen
          # per-crate entries that used to be here are directories that stopped
          # existing when those crates joined the host workspace.
          #
          # `userland/sshd/target` was on this list and never existed at all —
          # `sshd` and `calc` are both members of `userland/Cargo.toml`'s
          # workspace, so their host builds land in `userland/target`, and the
          # step below has been recompiling them from scratch every run. The
          # gate in `src/hostws.rs` now reds on a path like that.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            userland/target
            toyos/target
            kernel/target
            bootloader/target
          key: host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-

      # **Default clippy, warnings denied, on every pull request.** A step of
      # this job rather than a job of its own, and that is the whole reason it
      # binds: `landing.yml`'s `gate-stage` reads main's required checks back out
      # of GitHub and reds on a name this repository claims that the ruleset does
      # not require. A new job would be a check nobody has required yet — visible
      # on the pull request, and skipped straight past by `gh pr merge --auto`.
      # Inside `host`, which is required today, a clippy finding blocks a merge
      # today.
      #
      # Three trees, five invocations — the kernel runs twice and `toyos-abi`
      # once more, both explained below; neither is a second opinion. The lint
      # set is default clippy everywhere, plus a short, individually-adopted list from
      # `pedantic`/`nursery` — never the groups themselves, and never
      # `restriction` as a group.
      # `issues/build/clippy-stage-two-is-lints-one-at-a-time.md` carries the full ledger:
      # every `pedantic`/`nursery` lint measured, each adoption or rejection
      # with its count and reason (`pedantic` + `nursery` together were 1,684
      # findings on the kernel alone — almost all of it stayed rejected).
      # Adopted so far, each earning its place on a *measured* finding, not a
      # guess: `checked_conversions`, `default_trait_access`, `manual_midpoint`,
      # `redundant_clone`, `unchecked_time_subtraction`, `unnecessary_semicolon`.
      #
      # **The kernel's default feature set is not what any guest boots.** Every
      # guest the harness boots is built with `boot-actuators`, and several
      # configs add `test-actuators`, so a clippy pass over the default set
      # alone never sees the code behind either `cfg` — six findings, in six
      # files, went unlinted this way until the gap was measured and closed
      # (2026-08-20). The fix is a second kernel invocation naming both
      # features, in the same step rather than a new job, for the reason
      # above. `boot-actuators,test-actuators` is the whole of what default
      # clippy was missing: `kernel/Cargo.toml` declares twelve more features
      # and no kernel build may ever enable any of them — `loom` and the eight
      # other `kernel-loom` model controls, `debug-wait`, `sched-check` and
      # `fpu-save-nothing` — so `cargo test --lib`, `kernel-loom`'s own suites
      # and `--debug` already close that set, and this gate has no business in
      # it. `toyos/` is not linted here either, for the same reason userland is
      # not: it is a sysroot source, excluded from the host workspace, and its
      # ordinary build is the custom target. Measured against a warm kernel target (`cargo clean -p kernel`,
      # then both invocations back to back, 2026-08-20): the added invocation
      # costs about **1.6 s** more — the same tree, checked twice, not a
      # second target directory.
      #
      # `rustup run stable` on all three, and no ToyOS toolchain: the kernel's
      # `x86_64-unknown-none` and the bootloader's `x86_64-unknown-uefi` are
      # both built-in targets, which is what makes this cost nothing. The reason
      # usually given for skipping the kernel — that the `toyos` toolchain ships
      # no clippy — was about the wrong toolchain.
      #
      # **Userland is not here, and cannot be yet**: `x86_64-unknown-toyos` is a
      # custom target, so linting `userland/` needs the fork's clippy and the
      # bootstrapped sysroot this job deliberately does not wait for. The fork's
      # `toyos` toolchain has no `cargo-clippy` component at all today — a
      # custom `rustup toolchain link` target can't `rustup component add` one,
      # it would need building from `rust/` by hand — so userland's
      # `undocumented_unsafe_blocks` count is still unmeasured, not measured
      # and deferred (`issues/build/clippy-stage-two-is-lints-one-at-a-time.md`).
      #
      # `--all-targets` on the workspace and *not* on the other two: it is what
      # reaches `tests/`, `examples/` and every crate's test targets, and on the
      # bootloader it fails outright, because a test target links `std` whose
      # `panic_impl` collides with the one `uefi_services` provides. The kernel
      # is the same shape.
      #
      # `--keep-going` so the report is the whole tree. Without it a crate that
      # fails stops every crate behind it, and the first measurement taken here
      # was a prefix, not a workspace: `toyos-ld` failed and hid `toyos-cc`,
      # `toyos-build`'s own targets and the entire QEMU harness.
      #
      # The other two run from their own directory rather than by
      # `--manifest-path`, because `.cargo/config.toml` is found from the working
      # directory: `cd kernel` is what applies that file's `-Dwarnings`, and the
      # `-- -D warnings` here is deliberately the same wall said twice.
      #
      # `undocumented_unsafe_blocks` (a `restriction` lint, cherry-picked, never
      # the group) is adopted per area as each area's justifications land — the
      # plan `issues/build/clippy-stage-two-is-lints-one-at-a-time.md` records. The bootloader
      # (10 blocks) is documented and gated below, inline. `toyos-abi` (19
      # blocks) is documented too, but gated as its own `-p` invocation rather
      # than folded into the workspace one: the workspace command lints every
      # other host-workspace crate as well, and none of *those* unsafe blocks
      # has been reviewed, so enabling the lint there would silently gate crates
      # nobody has looked at.
      #
      # The kernel has no `-p` (it is one crate) and no directory scoping on
      # the clippy command line, so a kernel *area* is gated at the source
      # instead of the invocation — and since the root-file sweep landed
      # (2026-08-22) the default is **on**: `kernel/src/main.rs` opens with a
      # crate-level `#![warn(clippy::undocumented_unsafe_blocks)]` and carries
      # an `#[allow(...)]` on each `mod` line whose tree is not swept yet, and
      # **when the last of those goes the kernel is gated whole and the list is
      # empty** — which is the end state this comment is already written for.
      # Composing with the `-D warnings` both kernel invocations below already
      # carry turns that `warn` into a hard error, with no new flag here.
      # Everything else — the root files, plus `arch::`, `drivers::`, `mm::`,
      # `object::`, `elf::` and `loader::`, which each also open with their own
      # `#![warn(...)]` from their own sweep — is gated, and a new file added
      # beside `main.rs` is gated the day it appears. To read *through* whatever
      # `allow`s are left and re-measure what is owed, add
      # `--force-warn clippy::undocumented_unsafe_blocks`;
      # `issues/build/clippy-stage-two-is-lints-one-at-a-time.md` carries the per-area ledger
      # and the counts. **They are not restated here**, and that is the point:
      # this comment kept a per-area list twice and both copies went stale
      # inside a day, because an area's status changes on somebody else's
      # landing and nothing makes a prose count follow it.
      #
      # Measured on the dev host with three fresh `CARGO_TARGET_DIR`s and a warm
      # cargo registry: **19.2 s** for the workspace (139 crates checked),
      # **2.2 s** for the kernel (19), **3.7 s** for the bootloader (20) — 25 s
      # of wall clock for all three, against this job's 398 s cold. It is placed
      # before the test steps so a lint finding answers without waiting for
      # them, and it pays for the three target directories the cache now keeps.
      #
      # `cargo run -- --clippy` runs exactly these five invocations on the dev
      # host, so a branch verifies this gate's claim before a push rather than a
      # narrower `cargo clippy -p <crate>`. `src/clippy.rs` holds that list and a
      # `cargo test --lib` gate that reds if it and this step drift, so the two
      # cannot verify different sets — keep any edit here in step with that file.
      - name: clippy
        run: |
          set -e -o pipefail
          rustup component add clippy
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          ADOPTED="-W clippy::checked_conversions -W clippy::default_trait_access -W clippy::manual_midpoint -W clippy::redundant_clone -W clippy::unchecked_time_subtraction -W clippy::unnecessary_semicolon"
          echo "=== clippy: host workspace" | tee -a /tmp/host.log
          cargo clippy --workspace --all-targets --keep-going -- $ADOPTED -D warnings 2>&1 \
            | tee -a /tmp/host.log
          echo "=== clippy: kernel (x86_64-unknown-none)" | tee -a /tmp/host.log
          (cd kernel && cargo clippy --target x86_64-unknown-none -- $ADOPTED -D warnings) 2>&1 \
            | tee -a /tmp/host.log
          echo "=== clippy: kernel (x86_64-unknown-none, boot-actuators+test-actuators)" | tee -a /tmp/host.log
          (cd kernel && cargo clippy --target x86_64-unknown-none \
            --features boot-actuators,test-actuators -- $ADOPTED -D warnings) 2>&1 \
            | tee -a /tmp/host.log
          echo "=== clippy: bootloader (x86_64-unknown-uefi)" | tee -a /tmp/host.log
          (cd bootloader && cargo clippy --target x86_64-unknown-uefi -- $ADOPTED -W clippy::undocumented_unsafe_blocks -D warnings) 2>&1 \
            | tee -a /tmp/host.log
          echo "=== clippy: toyos-abi unsafe blocks" | tee -a /tmp/host.log
          cargo clippy -p toyos-abi --all-targets --keep-going -- -W clippy::undocumented_unsafe_blocks -D warnings 2>&1 \
            | tee -a /tmp/host.log

      # The build system's own gates: the two lock scopes, the landing
      # protocol, the sysroot witness, and the format check on the two volumes
      # the image builder writes.
      - name: build system
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee -a /tmp/host.log

      # Every host-tested crate, and **this step no longer holds the list of
      # them** — root `Cargo.toml`'s `[workspace] members` does, and
      # `--workspace` reads it from there.
      #
      # That is the repair, not a tidy-up. This used to be a shell loop naming
      # sixteen crates, and the same set was also the set of standalone
      # workspace roots, so it was a list in two places. The two drifted three
      # times: nine of thirteen until 2026-08-08 (`toyos-elf`, `toyos-ld`,
      # `toyos-pci` and `toyos-desktop` missing — pure crates whose whole point
      # is that a decision is testable without a guest, so a CI that skipped
      # them skipped exactly the tests it was cheapest to run); `toyos-keymap`
      # and `bcachefs` until 2026-08-14, 108 tests reaching no gate; and
      # `toyos-abi` and `toyos-manifest`, 23 tests, which were named in no
      # workflow at all until the workspace landed.
      #
      # `--exclude toyos-build` because the root package's integration test is
      # the QEMU harness — `ci.yml` runs that, sharded, on Linux with a guest.
      # `cargo test --lib` above is the root package's half that belongs here,
      # and one of the gates it runs (`src/hostws.rs`) reds on a `Cargo.toml`
      # in the tree that joined neither `members` nor `exclude`. So a crate
      # added and forgotten is a red in this job rather than a silent gap in
      # it, which is the property the loop could never have.
      - name: host crates
        run: |
          set -e -o pipefail
          cargo test --workspace --exclude toyos-build 2>&1 | tee -a /tmp/host.log

      # **`kernel-loom`'s supported matrix is two commands, and the `--workspace`
      # step above is one of them.** The `loom` feature is default-on and is what makes the
      # crate's atomics loom's instrumented ones; `log_zeroed_init` is about
      # byte-zeroability, which loom's atomics do not have, and `log_body_words`
      # about a message wider than the one word `MSG_WORDS` is under loom. Both
      # are gated `cfg(not(feature = "loom"))`, so the default invocation runs
      # *nothing* from either — which read as a pass for as long as nobody
      # counted.
      #
      # Scoped to those targets rather than the crate: every other
      # loom::model file is gated cfg(feature = "loom"), so a bare
      # --no-default-features invocation at the crate root would run
      # nothing from them either.
      - name: kernel-loom without loom
        run: |
          set -e -o pipefail
          echo "=== kernel-loom --no-default-features --test log_zeroed_init --test log_body_words" \
            | tee -a /tmp/host.log
          cargo test --manifest-path kernel-loom/Cargo.toml --no-default-features \
            --test log_zeroed_init --test log_body_words 2>&1 | tee -a /tmp/host.log

      # **The wake edge's teeth, run rather than recorded.** The obligation is
      # that no committed record is ever left with a parked reader, and it is
      # store-buffer shaped: `wake-fence-off` removes the two `SeqCst` fences
      # from `shard.rs`'s wake pair and `log_wake` must red under it; a model
      # that has never failed proves nothing, and this is the only obligation in
      # the tree whose *negative* no guest test can express — on x86 a build
      # with either fence gone behaves identically, which is the whole reason it
      # is a model.
      #
      # **A non-zero exit is not the check, and until 2026-08-15 it was the
      # whole of it.** Anything that stops `cargo test` before a model runs — a
      # syntax error in `shard.rs`, a `wake-fence-off` block that no longer
      # compiles, a manifest path that moved — exits non-zero and read here as
      # proof that the model has teeth. That is the one failure mode a negative
      # control must not have: the less it ran, the greener it looked. So the
      # step demands the model's own verdict line by name, and a build that
      # produced no verdict fails whichever way it exited.
      - name: kernel-loom wake fences have teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features wake-fence-off --test log_wake (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features wake-fence-off --test log_wake 2>&1 \
               | tee /tmp/wake-fence-off.log | tee -a /tmp/host.log; then
            echo "log_wake passed with both fences removed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_commit_and_an_arm_cannot_both_miss \.\.\. FAILED' \
               /tmp/wake-fence-off.log; then
            echo "the fence-off build failed without a_commit_and_an_arm_cannot_both_miss reaching a verdict: this step proved nothing, and whatever stopped the model from running is what to fix" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The five obligations that shared `kernel-loom`'s crate with W3 but not
      # its control, until 2026-08-17.** `ticket_lock`, `tlb_shootdown`,
      # `reap_gate`, `log_record` and `log_publish` were green in every run with
      # nothing proving any of the five could red — the same gap `wake-fence-off`
      # closed for W3 above, five more times over. Each feature relaxes the one
      # edge its model's own property rests on (`kernel-loom/Cargo.toml` carries
      # the argument for each), and each step below is `wake-fence-off`'s shape
      # exactly: a pass is "the model has no teeth" and a fail that never reached
      # the named verdict line is "this step proved nothing" — both exit 1, so a
      # compile error or a moved manifest path cannot read as a red.
      - name: kernel-loom ticket lock's acquire edge has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features lock-acquire-off --test ticket_lock (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features lock-acquire-off --test ticket_lock 2>&1 \
               | tee /tmp/lock-acquire-off.log | tee -a /tmp/host.log; then
            echo "ticket_lock passed with the acquire relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'try_lock_observes_the_previous_owners_writes \.\.\. FAILED' \
               /tmp/lock-acquire-off.log; then
            echo "the acquire-off build failed without try_lock_observes_the_previous_owners_writes reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom poison bank has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features poison-overwrite --test poison_set (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features poison-overwrite --test poison_set 2>&1 \
               | tee /tmp/poison-overwrite.log | tee -a /tmp/host.log; then
            echo "poison_set passed with the erasing swap restored: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_second_death_banks_beside_the_first \.\.\. FAILED' \
               /tmp/poison-overwrite.log; then
            echo "the overwrite build failed without a_second_death_banks_beside_the_first reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom reap gate's enrolment edge has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features reap-raise-relaxed --test reap_gate (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features reap-raise-relaxed --test reap_gate 2>&1 \
               | tee /tmp/reap-raise-relaxed.log | tee -a /tmp/host.log; then
            echo "reap_gate passed with the raise relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_claim_sees_the_enrolled_work \.\.\. FAILED' \
               /tmp/reap-raise-relaxed.log; then
            echo "the raise-relaxed build failed without a_claim_sees_the_enrolled_work reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom shootdown acknowledgement has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features shootdown-serve-relaxed --test tlb_shootdown (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features shootdown-serve-relaxed --test tlb_shootdown 2>&1 \
               | tee /tmp/shootdown-serve-relaxed.log | tee -a /tmp/host.log; then
            echo "tlb_shootdown passed with the serve load relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'an_acknowledged_flush_postdates_the_page_table_write \.\.\. FAILED' \
               /tmp/shootdown-serve-relaxed.log \
             || ! grep -q 'one_serve_answers_two_concurrent_shootdowns \.\.\. FAILED' \
               /tmp/shootdown-serve-relaxed.log; then
            echo "the serve-relaxed build failed without both shootdown models reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom CPU roster publication has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features roster-commit-relaxed --test smp_bringup (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features roster-commit-relaxed --test smp_bringup 2>&1 \
               | tee /tmp/roster-commit-relaxed.log | tee -a /tmp/host.log; then
            echo "smp_bringup passed with the count published relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_committed_count_never_outruns_its_slot \.\.\. FAILED' \
               /tmp/roster-commit-relaxed.log; then
            echo "the roster-commit-relaxed build failed without the publication model reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom release-and-answer are one word
        run: |
          set -o pipefail
          echo "=== kernel-loom --features smp-ready-split --test smp_bringup (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features smp-ready-split --test smp_bringup 2>&1 \
               | tee /tmp/smp-ready-split.log | tee -a /tmp/host.log; then
            echo "smp_bringup passed with release and answer split into two stores: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_released_machine_is_answering \.\.\. FAILED' \
               /tmp/smp-ready-split.log; then
            echo "the smp-ready-split build failed without the release model reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom W1 record publication has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features log-commit-release-off --test log_record (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features log-commit-release-off --test log_record 2>&1 \
               | tee /tmp/log-commit-release-off.log | tee -a /tmp/host.log; then
            echo "log_record passed with the publishing store relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_committed_record_is_whole_or_absent \.\.\. FAILED' \
               /tmp/log-commit-release-off.log \
             || ! grep -q 'a_key_and_the_record_it_names_come_from_one_generation \.\.\. FAILED' \
               /tmp/log-commit-release-off.log; then
            echo "the commit-release-off build failed without both log_record models reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      - name: kernel-loom W5 shard publication has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features shard-publish-relaxed --test log_publish (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features shard-publish-relaxed --test log_publish 2>&1 \
               | tee /tmp/shard-publish-relaxed.log | tee -a /tmp/host.log; then
            echo "log_publish passed with the pointer's publication relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_reader_that_finds_a_shard_finds_it_built \.\.\. FAILED' \
               /tmp/shard-publish-relaxed.log; then
            echo "the shard-publish-relaxed build failed without a_reader_that_finds_a_shard_finds_it_built reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The completion core's three controls, arriving with the code they
      # stage.** `inbox.rs` and `sleep_lock.rs` are new models, and each ships
      # with the feature that makes it red rather than with a comment claiming
      # it would — the rule the five steps above exist to have enforced from the
      # start. Every step below is `wake-fence-off`'s shape exactly: a pass is
      # "the model has no teeth", and a failure that never reached the named
      # verdict line is "this step proved nothing".
      - name: kernel-loom inbox publication has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features inbox-release-off --test inbox (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features inbox-release-off --test inbox 2>&1 \
               | tee /tmp/inbox-release-off.log | tee -a /tmp/host.log; then
            echo "inbox passed with the record's publication relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_record_reaches_its_taker_intact \.\.\. FAILED' \
               /tmp/inbox-release-off.log; then
            echo "the inbox-release-off build failed without a_record_reaches_its_taker_intact reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # The log's producer is the one path that posts to an inbox holding no
      # lock, so `Inbox::signal` is a single atomic store where `post` is a
      # sequence of plain writes. This control puts the producer back on `post`
      # — the shape that shipped before it — and loom answers with the data race
      # x86's TSO hides from every guest test in the tree.
      - name: kernel-loom lock-free post has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features inbox-signal-as-post --test inbox (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features inbox-signal-as-post --test inbox 2>&1 \
               | tee /tmp/inbox-signal-as-post.log | tee -a /tmp/host.log; then
            echo "inbox passed with two unlocked producers on Inbox::post: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'two_unlocked_producers_are_a_race_and_a_signal_is_not \.\.\. FAILED' \
               /tmp/inbox-signal-as-post.log; then
            echo "the inbox-signal-as-post build failed without two_unlocked_producers_are_a_race_and_a_signal_is_not reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **Two verdict lines demanded, not one.** Relaxing the sleep lock's
      # acquire reds all four of `sleep_lock.rs`'s models, and the two named
      # here are the ones the *ordering* breaks rather than the ticket
      # arithmetic: the contended parking acquire, which is the path
      # `ticket_lock.rs` cannot reach at all, and mutual exclusion itself.
      - name: kernel-loom sleep lock's acquire edge has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features sleeplock-acquire-off --test sleep_lock (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features sleeplock-acquire-off --test sleep_lock 2>&1 \
               | tee /tmp/sleeplock-acquire-off.log | tee -a /tmp/host.log; then
            echo "sleep_lock passed with the acquire relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_parking_contender_observes_the_holders_writes \.\.\. FAILED' \
               /tmp/sleeplock-acquire-off.log \
             || ! grep -q 'two_holders_never_overlap \.\.\. FAILED' \
               /tmp/sleeplock-acquire-off.log; then
            echo "the sleeplock-acquire-off build failed without both named sleep_lock models reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # Both two-threaded durability models must red under the blind clear:
      # the page-flush model (F6's lost mid-flush write) and the commit-debt
      # model (F5's forgotten failed device flush).
      - name: kernel-loom durability settle has teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features durability-settle-blind --test durability (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features durability-settle-blind --test durability 2>&1 \
               | tee /tmp/durability-settle-blind.log | tee -a /tmp/host.log; then
            echo "durability passed with the settle blind: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_page_marked_clean_is_on_the_device \.\.\. FAILED' \
               /tmp/durability-settle-blind.log \
             || ! grep -q 'a_settled_commit_covers_only_flushed_writes \.\.\. FAILED' \
               /tmp/durability-settle-blind.log; then
            echo "the durability-settle-blind build failed without both named durability models reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **`toyos-sched-loom`'s own controls, wired for the first time
      # 2026-08-17.** The mandatory preempt-disabled push has
      # carried `no-preempt-guard` since before this file existed, and it was
      # never once run here — a control run only by hand is a control CI has
      # never shown has teeth, the same fact this whole batch of steps repairs.
      #
      # **Its shape is `wake-fence-off`'s upside down.** `no-preempt-guard`
      # models the guard away entirely rather than relaxing one ordering, and
      # `preempted_producer_strands_suffix` (`toyos-sched/loom/tests/loom_mailbox.rs`)
      # already wraps the model in `catch_unwind` and turns the caught panic
      # into its own assertion — so *this* step's teeth are a green run, and a
      # step that instead demanded red would be checking the opposite of what
      # the test means. The verdict line is still demanded by name, for
      # `wake-fence-off`'s reason: a compile error or a moved test name also
      # exits non-zero and must not read as "the model has teeth."
      - name: toyos-sched-loom preempt guard has teeth
        run: |
          set -o pipefail
          echo "=== toyos-sched-loom --features no-preempt-guard --test loom_mailbox (must pass — it catches its own red)" \
            | tee -a /tmp/host.log
          if ! cargo test -p toyos-sched-loom --features no-preempt-guard \
               --test loom_mailbox 2>&1 \
               | tee /tmp/no-preempt-guard.log | tee -a /tmp/host.log; then
            echo "loom_mailbox failed with the preempt guard modelled away: either the internal catch itself failed or something else broke, so this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'preempted_producer_strands_suffix \.\.\. ok' \
               /tmp/no-preempt-guard.log; then
            echo "loom_mailbox passed without preempted_producer_strands_suffix reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The sleep handshake's own control, same gap as the five above but in
      # `toyos-sched-loom`.** `doorbell-kick-relaxed` relaxes `Doorbell::ring`'s
      # read to `Relaxed`, so a producer can miss a target's freshly published
      # SLEEPING bit and elide the IPI that would have woken it — the
      # sleep-through `a_halted_cpu_with_queued_work_was_kicked` exists to
      # refuse.
      #
      # **No `... FAILED` line here, and that is the finding rather than a
      # miss.** The assertion's own panic unwinds into the model's `World`,
      # whose `MailboxNode` drop bomb (N2) fires on the still-queued message and
      # panics a second time mid-unwind — a double panic aborts the process
      # before the harness prints a summary line. So this step's verdict is the
      # first panic's message, grepped directly rather than a `FAILED` suffix;
      # a non-zero exit alone would accept a compile error exactly as
      # `wake-fence-off`'s comment above warns against.
      - name: toyos-sched-loom doorbell kick edge has teeth
        run: |
          set -o pipefail
          echo "=== toyos-sched-loom --features doorbell-kick-relaxed --test loom_sleep (must red)" \
            | tee -a /tmp/host.log
          if cargo test -p toyos-sched-loom \
               --features doorbell-kick-relaxed --test loom_sleep 2>&1 \
               | tee /tmp/doorbell-kick-relaxed.log | tee -a /tmp/host.log; then
            echo "loom_sleep passed with the kick read relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'halted with 2 of 2 messages queued and no IPI in flight' \
               /tmp/doorbell-kick-relaxed.log; then
            echo "the kick-relaxed build failed without a_halted_cpu_with_queued_work_was_kicked reaching its verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The balance path's push half, which is a candidate and not shipped.**
      # `cpu::Balance::PushOnSurplus` rests on one CPU observing another's
      # SLEEPING bit while that CPU observes its surplus — the store-buffer
      # litmus test — and `cpu::balance_fence`'s `SeqCst` fence is what forbids
      # both sides missing. `push-fence-relaxed` weakens it to a release fence,
      # which orders stores against stores and nothing against a later load, and
      # `loom_push` must red.
      #
      # It is wired here rather than left to whoever adopts the policy, for the
      # reason `no-preempt-guard` and `doorbell-kick-relaxed` were: a control
      # nothing runs is a control nobody can trust on the day it matters. This
      # model's panic unwinds cleanly — nothing is queued in it — so unlike the
      # step above it does print a `FAILED` line; the verdict is still grepped
      # by the assertion's own words, because a non-zero exit alone would accept
      # a compile error.
      - name: toyos-sched-loom push-on-surplus fence has teeth
        run: |
          set -o pipefail
          echo "=== toyos-sched-loom --features push-fence-relaxed --test loom_push (must red)" \
            | tee -a /tmp/host.log
          if cargo test -p toyos-sched-loom \
               --features push-fence-relaxed --test loom_push 2>&1 \
               | tee /tmp/push-fence-relaxed.log | tee -a /tmp/host.log; then
            echo "loom_push passed with the balance fence relaxed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'published and no push behind it' /tmp/push-fence-relaxed.log; then
            echo "the fence-relaxed build failed without a_cpu_that_halts_without_seeing_the_surplus_was_pushed reaching its verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The one control here that models nothing away.** Its three siblings
      # relax an ordering or delete a guard and demand that the model catches
      # the lie. `victim-retires-mid-probe` changes no rule: it lets the mailbox
      # model's victim stop taking passes, which is what a CPU that stops does,
      # and the model must then fail because `MailboxNode::in_flight` is the
      # consumer's to clear and a retired consumer clears nothing.
      #
      # So it reproduces an open defect —
      # `issues/kernel/steal-probe-node-dies-with-its-victim.md` — rather than
      # proving a lie is caught, and this step and its feature go away with the
      # fix. Its shape is `no-preempt-guard`'s: the case catches its own panic
      # and turns it into an assertion, so the step's teeth are a green run.
      #
      # **The verdict is grepped, not the `... ok` line**, for the reason the two
      # red-expecting steps above grep theirs: a different panic inside the same
      # case is caught by the same `catch_unwind` and would read as the control
      # passing. The case refuses a payload that is not the stranded probe and
      # prints what it caught, which `--nocapture` is here to let out.
      - name: toyos-sched-loom probe-outlives-its-victim reproduces
        run: |
          set -o pipefail
          echo "=== toyos-sched-loom --features victim-retires-mid-probe --test loom_mailbox (must pass — it catches its own red)" \
            | tee -a /tmp/host.log
          if ! cargo test -p toyos-sched-loom --features victim-retires-mid-probe \
               --test loom_mailbox -- --nocapture 2>&1 \
               | tee /tmp/victim-retires.log | tee -a /tmp/host.log; then
            echo "loom_mailbox failed with the victim retiring: either the internal catch itself failed or something else broke, so this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'caught the verdict: the victim retired with a probe still linked in its queue' \
               /tmp/victim-retires.log; then
            echo "loom_mailbox passed without a_probe_outstanding_when_its_victim_retires_is_never_reclaimed catching the stranded-probe verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The process lifecycle's two controls.** Not loom, and the reason is
      # worth stating: nothing in `toyos-proclife` is lock-free — every decision
      # it makes is made under `PROCESS_TABLE` — so what the model explores is
      # which CPU takes that lock next, not which store another CPU has seen.
      # The steps have `wake-fence-off`'s shape all the same, and for its
      # reason: a control nothing runs is a control nobody has shown can fail.
      #
      # `mutate-spawn-skips-the-insert-recheck` asks `spawn_thread`'s teardown
      # question once instead of twice, so a thread lands in the table behind a
      # retire sweep already under way — the process publishes an exit with a
      # thread of its own still schedulable, and the address space that thread's
      # page tables map is freed under it. That is the shape
      # `issues/kernel/spawned-process-never-starts.md` has been open on since
      # August with no QEMU reproduction; the model reaches it in milliseconds
      # and prints the schedule that did it.
      - name: toyos-proclife spawn's second teardown check has teeth
        run: |
          set -o pipefail
          echo "=== toyos-proclife --features mutate-spawn-skips-the-insert-recheck (must red)" \
            | tee -a /tmp/host.log
          if cargo test -p toyos-proclife \
               --features mutate-spawn-skips-the-insert-recheck 2>&1 \
               | tee /tmp/proclife-spawn.log | tee -a /tmp/host.log; then
            echo "toyos-proclife passed with the insert's teardown check gone: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_published_exit_leaves_no_unretired_thread \.\.\. FAILED' \
               /tmp/proclife-spawn.log \
             || ! grep -q 'a_kill_racing_a_spawn_leaves_no_unretired_thread \.\.\. FAILED' \
               /tmp/proclife-spawn.log; then
            echo "the spawn-recheck build failed without both interleaving models reaching a verdict: this step proved nothing, and whatever stopped them from running is what to fix" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # `mutate-claim-teardown-always-wins` takes the exclusion out of
      # `claim_teardown`, so an exit and a kill both tear one process down and
      # both publish. `ProcessObject::publish_exit` asserts against the second
      # publish at run time — in a guest, on whichever boot the two happen to
      # meet — and the model asserts it in every ordering of the two paths.
      - name: toyos-proclife teardown claim has teeth
        run: |
          set -o pipefail
          echo "=== toyos-proclife --features mutate-claim-teardown-always-wins (must red)" \
            | tee -a /tmp/host.log
          if cargo test -p toyos-proclife \
               --features mutate-claim-teardown-always-wins 2>&1 \
               | tee /tmp/proclife-claim.log | tee -a /tmp/host.log; then
            echo "toyos-proclife passed with the teardown claim shared: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'an_exit_and_a_kill_never_both_tear_a_process_down \.\.\. FAILED' \
               /tmp/proclife-claim.log; then
            echo "the claim-always-wins build failed without an_exit_and_a_kill_never_both_tear_a_process_down reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # **The scheduler's staleness rule, and it is the simulator rather than
      # loom.** What `CpuHandle::answering` decides is not an ordering — it is
      # whether a CPU's published load is still a claim about the present — so
      # the model that can show it wrong is a whole machine with a CPU that
      # takes no passes, which is `scenarios::stopped_cpu`.
      # `placement-ignores-staleness` answers `true` for every CPU, which is
      # what every path that chooses one believed before the rule existed, and
      # `a_stopped_cpu_stops_taking_work` must red.
      - name: toyos-sched-sim placement staleness has teeth
        run: |
          set -o pipefail
          echo "=== toyos-sched-sim --features placement-ignores-staleness --test policy (must red)" \
            | tee -a /tmp/host.log
          if cargo test -p toyos-sched-sim \
               --features placement-ignores-staleness --test policy 2>&1 \
               | tee /tmp/placement-staleness.log | tee -a /tmp/host.log; then
            echo "the policy suite passed with a stopped cpu's load believed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi
          if ! grep -q 'a_stopped_cpu_stops_taking_work \.\.\. FAILED' \
               /tmp/placement-staleness.log; then
            echo "the staleness-ignored build failed without a_stopped_cpu_stops_taking_work reaching a verdict: this step proved nothing" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # `userland/.cargo/config.toml` cross-compiles by default, so a userland
      # crate's host tests have to name the host. `calc` is here for the reason
      # the pure crates above are: its arithmetic is decided without a guest,
      # so a CI that skipped it would skip the cheapest tests it has.
      #
      # `soundd` for the same reason, and it arrived here already carrying two
      # tests that ran nowhere: the mixer's bit-exact passthrough and its
      # full-scale clamp compiled and passed on the host while no workflow ever
      # invoked them. Everything decided without a device — the deferral floor,
      # the device shapes it refuses, which witness of a client's departure
      # wins — is decided here, where a weakening reds in seconds instead of
      # waiting for a nightly audio boot.
      #
      # `logd` since 2026-08-22: what a refused batch does to this boot's log
      # volume is a function of three values (`logd::policy::fate`), and the
      # distinction it turns on — a flush the kernel would not start on the
      # caller's clock against a stick that cannot flush — has no guest that
      # stages both arms cheaply.
      #
      # `pkg` because everything a downloaded archive can say is decided in its
      # `lib.rs`: the ustar names that leave the package directory, the entry
      # types it refuses, the `SHA256SUMS` line it will not take twice. Those
      # are the boundary the installer's write path rests on, and a guest boot
      # runs one archive against it while these run the hostile ones.
      #
      # These stay a loop, and cannot stop being one: that same
      # `.cargo/config.toml` is why `userland` is *excluded* from the host
      # workspace, and cargo refuses to merge an inherited `build.target` away.
      # They are named in `userland/Cargo.toml`'s own workspace, so the list
      # here is a list in two places — a smaller instance of the defect above,
      # left standing deliberately rather than papered over.
      - name: userland host crates
        run: |
          set -e -o pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          for crate in sshd calc soundd logd pkg; do
            echo "=== userland/$crate" | tee -a /tmp/host.log
            cargo test --manifest-path "userland/$crate/Cargo.toml" --target "$host" 2>&1 \
              | tee -a /tmp/host.log
          done

      # The SDK's own decisions. `toyos/` is excluded from the host workspace
      # because it compiles against the ToyOS sysroot and is a path dependency
      # of `rust/library/std` — but *some* of what it holds is a total function
      # over kernel words, and `net::hangup` is the one that decides whether a
      # program whose netd has gone leaves quietly or panics across the boot.
      # Its `lib.rs` is `no_std` for every build but this one, and this one
      # links no syscall.
      #
      # Named here rather than folded into the loop above: it is not under
      # `userland/`, it has its own lockfile and its own workspace, and it needs
      # `--target` for a different reason — there is no `.cargo/config.toml`
      # beside it, so this is the host triple said out loud rather than one
      # overridden.
      - name: toyos SDK host tests
        run: |
          set -e -o pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "=== toyos" | tee -a /tmp/host.log
          cargo test --manifest-path toyos/Cargo.toml --target "$host" 2>&1 \
            | tee -a /tmp/host.log

      # The root package's `--lib`, one `--workspace` over the other host-tested
      # members, `kernel-loom`'s no-loom command, one negative-control run per
      # control any model crate declares — `cargo test --lib`'s
      # `every_model_control_is_wired_into_host_tests` is what holds the two
      # lists together, and no count is restated here because a landing in
      # another area moves it —
      # the three userland crates and the SDK. A red is still one line somewhere among them,
      # and `--workspace` prints a `Running ...` line naming the binary rather
      # than the `=== <crate>` the other steps echo, so the summary matches both
      # shapes.
      - name: failure summary
        if: failure()
        run: |
          {
            echo "### host tests"
            echo ""
            echo '```'
            grep -E '^(=== |error(\[|:)|test .* FAILED|failures:$|    [a-z_:]+$|test result: FAILED| +Running )' \
              /tmp/host.log | tail -40 || echo "(nothing matched; read the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The same standing issue `ci.yml`'s `nightly-red` files or updates. Only on
  # `schedule` — a dispatched run is somebody watching it directly. Named
  # `nightly-red-host`, not `nightly-red`: a job id becomes a check run name,
  # and two jobs sharing one id across workflows would collide under it.
  nightly-red-host:
    needs: [host]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.host.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: file or update "nightly is red"
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_RESULT: ${{ needs.host.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export TITLE="nightly is red"
          export BODY="Run: $RUN_URL"$'\n'"Failed jobs: host($HOST_RESULT)"
          .github/nightly-red.sh
