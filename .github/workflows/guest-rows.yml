name: guest-rows
# What a dispatcher finds its own run by.
run-name: guest-rows ${{ github.ref_name }} ${{ inputs.filter }}

# Guest rows on demand: `cargo test --test toyos-build -- <args>` at the
# dispatched branch's commit, on the guest runner (`cargo run -- --ci rows`,
# build/ci.rs). The runner is a dedicated, otherwise idle host that takes one
# job at a time, so this queue is the only one its guests wait in. It keeps its
# workspace and its toolchain store (`~/.cache/toyos`) between jobs, and that
# is its only cache; a revision whose toolchain is not in the store builds it
# here first.
#
# `workflow_dispatch` alone, never callable, refused on main, with no
# permissions and no `actions/cache`: a dispatch needs write access to the
# repository, no pull request reaches this runner's label from this
# repository's workflows, and code that outlives a job on this machine never
# holds a token of main's cache scope (build/ci.rs's
# `only_a_dispatch_reaches_a_self_hosted_runner`). The job reads no secret.
#
# The host provides: x86-64 Linux with `/dev/kvm` the runner's user opens; QEMU
# at build/ci/qemu-version for both architectures, with the firmware
# descriptors of its x86-64 and AArch64 UEFI firmware; rustup's stable on
# `PATH`; git, a C and C++ toolchain, CMake and Python 3 for a toolchain build.
# The runner runs as a dedicated user with no sudo; job code can read that
# user's files, the runner's `.credentials` among them. Its log is public: the
# job masks what identifies the machine in all it says and keeps, but the
# runner names the runner and the host before the job's first step, so neither
# name may identify anybody.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: The harness's arguments after `--`, split at whitespace; empty runs the whole suite
        required: false
        type: string

permissions: {}

jobs:
  rows:
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, toyos-guest]
    # A wedge guard, wide enough for a toolchain the store does not hold.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `target/` is the warm build; `git clean -ffdx` would remove it.
          clean: false
          # The fork a toolchain the store lacks is built from; the build
          # fetches its nested submodules itself.
          submodules: true
          # Nothing on this machine outlives the job holding the token.
          persist-credentials: false

      # One argument, which the driver splits at whitespace.
      - env:
          FILTER: ${{ inputs.filter }}
        run: cargo run -- --ci rows "$FILTER"

      # The serial logs of a run that was not green: only this run's, since
      # the driver removed what earlier runs kept.
      - name: serial logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serial
          path: target/red-run-serial/**/uart-*.log
          if-no-files-found: warn
          retention-days: 7
