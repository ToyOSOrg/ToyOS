name: nightly

# Every job's logic is `cargo run -- --ci <job>` (src/ci.rs); this file says
# where each one runs.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: &host-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            userland/target
            toyos/target
            kernel/target
            bootloader/target
          key: host-linux-${{ github.run_id }}
          restore-keys: host-linux-

      - run: cargo run -- --ci host

      # The host cache's one writer. Only main's entries are readable from
      # every branch.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: *host-paths
          key: host-linux-${{ github.run_id }}

  toolchain:
    uses: ./.github/workflows/toolchain.yml

  release:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ needs.toolchain.outputs.sysroot-path }}
          key: ${{ needs.toolchain.outputs.sysroot-key }}
          fail-on-cache-miss: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run -- --ci release

  tcg:
    needs: toolchain
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/guest.yml
    with:
      kvm: false
      sysroot-key: ${{ needs.toolchain.outputs.sysroot-key }}
      sysroot-path: ${{ needs.toolchain.outputs.sysroot-path }}

  # `cargo run -- --build-only` from a fresh machine. `sid` as it stands,
  # image and archive both, and no cache — a fresh machine is the premise.
  portability-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: debian:sid
    steps:
      - name: deps
        run: |
          for attempt in 1 2 3; do
            apt-get update -qq > /tmp/apt.log 2>&1 \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates \
                   build-essential qemu-system-x86 python3 cmake >> /tmp/apt.log 2>&1 \
              && break
            [ "$attempt" = 3 ] && { cat /tmp/apt.log; exit 1; }
            sleep 20
          done
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: cargo run -- --build-only

  portability-macos:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - *checkout
      # Homebrew keeps one QEMU; `cargo run` notes it if it is not the declared one.
      - run: |
          brew install qemu cmake
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo run -- --build-only
      # The host suite's macOS arms run here alone: `ci.yml`'s `host` is Linux.
      - run: cargo run -- --ci host
