name: nightly

# Everything that boots a guest, the host gate again to write the cache the
# merge queue restores, and portability.
# Every job's logic is `cargo run -- --ci <job>` (src/ci.rs); this file says
# where each one runs.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Never cancelled: `build` may be an hour into a bootstrap.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The host cache's writer: only main's entries are readable from every
  # branch, and it restores nothing, so its tree is one cold build's and
  # src/cicache.rs seals it. On a branch it would only repeat that branch's
  # pull request.
  host:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - run: cargo run --target-dir target/ci-driver -- --ci host

      - if: hashFiles('target/ci-sources') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            userland/target
            toyos/target
            kernel/target
            bootloader/target
          key: host-sealed-${{ runner.os }}-${{ github.run_id }}

      - env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --target-dir target/ci-driver -- --ci prune

  # Publishes this tree's toolchain if nobody has, and on main moves the SDK
  # alias onto it. Bare `ubuntu-24.04`, not a container: its glibc is the
  # release's floor.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: disk, QEMU and CMake
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 zstd \
                      cmake=3.28.3-1build7

      - env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run -- --ci toolchain

  guest:
    needs: build
    runs-on: ubuntu-24.04
    # A wedge guard, not a budget.
    timeout-minutes: 60
    # The digest is the instrument's one pin: a dated image names the snapshot
    # archive it was built from, and `deps` installs QEMU from that archive.
    # The node ships `crw-rw---- root:kvm` and root opens it.
    container: &kvm
      image: &image debian:sid-20260918@sha256:a2aa46262453eba3f464d8b1c7a8c31db85eb15af180ae34dd400615d7208547
      options: --device=/dev/kvm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before the checkout, which wants git. Three attempts, because the
      # archive is fixed and the network to it is not.
      - &deps
        name: deps
        run: |
          snap=$(sed -n 's|^# \(http://snapshot\.debian\.org/archive/debian/[0-9]*T[0-9]*Z\)$|\1|p' \
                   /etc/apt/sources.list.d/debian.sources)
          test -n "$snap"
          echo "deb $snap sid main" > /etc/apt/sources.list
          rm /etc/apt/sources.list.d/debian.sources
          for attempt in 1 2 3; do
            apt-get -o Acquire::Check-Valid-Until=false update -qq > /tmp/apt.log 2>&1 \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates \
                   zstd build-essential qemu-system-x86 ovmf-generic qemu-system-arm \
                   qemu-efi-aarch64 >> /tmp/apt.log 2>&1 \
              && break
            [ "$attempt" = 3 ] && { cat /tmp/apt.log; exit 1; }
            sleep 20
          done
          # `actions/checkout` sets this only in a config it discards.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - &guest-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: &guest-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            kernel/target
            bootloader/target
            userland/target
            tests/target
            tests/toyos-rust-tests/*/target
          key: guest-${{ github.run_id }}
          restore-keys: guest-

      - run: cargo run -- --ci guest

      # Every boot's 16550 log: what a guest that died early still leaves.
      - &serial
        name: serial logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serial-${{ github.job }}
          path: target/red-run-serial/**/uart-*.log
          if-no-files-found: warn
          retention-days: 7

  # The guest suite again with no `/dev/kvm`, so the only lane that decodes the
  # paths a KVM host's CPU never does; and the guest cache's one writer, since
  # what it builds does not depend on the accelerator.
  tcg:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: *image
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - *deps
      - *checkout
      - *guest-cache
      - run: cargo run -- --ci guest
      # After the test: what is worth keeping is a tree that built and booted.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: *guest-paths
          key: guest-${{ github.run_id }}
      - *serial

  # `cargo run -- --build-only` from a fresh machine. `sid` as it stands,
  # image and archive both, and no cache — a fresh machine is the premise.
  portability-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: debian:sid
    steps:
      - name: deps
        run: |
          for attempt in 1 2 3; do
            apt-get update -qq > /tmp/apt.log 2>&1 \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates \
                   build-essential qemu-system-x86 python3 cmake >> /tmp/apt.log 2>&1 \
              && break
            [ "$attempt" = 3 ] && { cat /tmp/apt.log; exit 1; }
            sleep 20
          done
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - *checkout

      - run: env -u GITHUB_ACTIONS -u CI cargo run -- --build-only

  portability-macos:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - *checkout
      # Homebrew keeps one QEMU; `cargo run` notes it if it is not the declared one.
      - run: |
          brew install qemu cmake
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: env -u GITHUB_ACTIONS -u CI cargo run -- --build-only
