name: ci

# A pull request and the merge queue: the host tests, and no guest. Each step
# is `cargo run -- --ci <job>` (src/ci.rs), which runs the same on a dev host;
# nightly.yml boots the guests.

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS, because `toyos-fat32`'s fixtures are formatted with `newfs_msdos`
  # and `hdiutil`.
  host:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # Full history: `abi-split` reads the branch's own commits, and the
      # tracker's citation gate reads deleted slugs out of `git log`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # nightly.yml's `host` is the one writer; the paths are the cache's
      # version, so they are the writer's list.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            userland/target
            toyos/target
            kernel/target
            bootloader/target
          key: host-${{ github.run_id }}
          restore-keys: host-

      - run: cargo run -- --ci host

      - if: ${{ !cancelled() }}
        run: cargo run -- --ci abi-split

      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run -- --ci gate-stage

  # `main`'s ruleset still requires these four names, and none of them is a
  # check any more: the toolchain and every guest are nightly.yml's, and
  # abi-split and gate-stage are steps of `host`. Each reports green, so
  # `host` alone decides a merge; they go when the ruleset requires `host`
  # alone.
  build: &placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "a name the ruleset requires with nothing behind it; host is the gate"
  guest-suite: *placeholder
  abi-split: *placeholder
  gate-stage: *placeholder
