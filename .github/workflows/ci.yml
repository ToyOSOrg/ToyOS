name: ci

# A pull request and the merge queue: the host tests, and no guest. Each step
# is `cargo run -- --ci <job>` (src/ci.rs), which runs the same on a dev host;
# nightly.yml boots the guests.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS, because `toyos-fat32`'s fixtures are formatted with `newfs_msdos`
  # and `hdiutil`.
  host:
    if: github.event_name == 'merge_group' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # An entry is read by content (src/cicache.rs): main's, which
      # nightly.yml's `host` writes, or one this pull request saved when it
      # found none. The paths are the cache's version, so they are the
      # writer's list.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: &host-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            userland/target
            toyos/target
            kernel/target
            bootloader/target
          key: host-sealed-${{ runner.os }}-${{ github.run_id }}
          restore-keys: host-sealed-${{ runner.os }}-

      - run: cargo run --target-dir target/ci-driver -- --ci host

      # Only a run that restored nothing leaves a manifest, and what a pull
      # request saves only its own later runs read.
      - if: github.event_name == 'pull_request' && hashFiles('target/ci-sources') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: *host-paths
          key: host-sealed-${{ runner.os }}-${{ github.run_id }}
