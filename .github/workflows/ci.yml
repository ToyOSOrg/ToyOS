name: ci

# CI runs once per pull request, in the merge queue: the host checks and every
# architecture's shipped image. The guest suite is nightly's. On `pull_request`
# every job is skipped, which a required check reads as green. A merge group
# that changes documentation alone against its parent (`build/ci.rs`'s `scope`;
# sound only under the ruleset's `ALLGREEN` grouping) runs the host checks that
# read it and skips `toolchain` and `image`.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# No job here writes: a toolchain release is main's publisher's alone.
permissions:
  contents: read

jobs:
  # The required check: green when every part of the host checks is. The parts
  # run in parallel (build/ci.rs's `Part`); a part that failed, was cancelled or
  # never ran reds it. `always()`, so a cancelled run reaches this job too: a
  # required job its condition skipped would read as success.
  host:
    needs: host-part
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.host-part.result != 'success'
        env:
          RESULT: ${{ needs.host-part.result }}
        run: |
          echo "a part of the host checks concluded $RESULT"
          exit 1

  host-part:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        part: [tests, lint, models, userland]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The driver's own target, and no step's: it says this job carries the
      # host cache (build/cicache.rs).
      CARGO_TARGET_DIR: target/ci-driver
      # The writer's: a unit built with other debuginfo is not the entry's.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # nightly.yml's `host` is the one writer; the paths are the cache's
      # version, so they are the writer's list.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: host-sealed-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: host-sealed-${{ runner.os }}-${{ runner.arch }}-

      # `--locked`: this cargo resolves before the driver runs, so it alone sees
      # the committed `Cargo.lock`. A merge that is clean as text can leave one
      # cargo would rewrite.
      - run: cargo run --locked -- --ci host ${{ matrix.part }}

  scope:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: scope
        run: cargo run -- --ci scope

  # Skipped where `build` is `false` and nowhere else: a `scope` that failed
  # leaves it empty, and everything builds.
  toolchain:
    needs: scope
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.scope.outputs.build != 'false' }}
    uses: ./.github/workflows/toolchain.yml

  # A required check that is skipped reads as green, so this runs whatever
  # `toolchain` concluded.
  image:
    needs: [scope, toolchain]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.scope.outputs.build != 'false' }}
    # Bare, as `toolchain / build` is: the sysroot is built for its glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ needs.toolchain.outputs.sysroot-path }}
          key: ${{ needs.toolchain.outputs.sysroot-key }}
          fail-on-cache-miss: true

      - run: cargo run -- --ci image
