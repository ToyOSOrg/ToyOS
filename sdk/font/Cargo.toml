[package]
name = "toyos-font"
version = "0.2.0" # never bumped; crates.io's is assigned on publish (build/sdkversion.rs)
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A monospace font's glyphs rasterized into one cell size, and drawn into a pixel buffer, for ToyOS programs."
repository = "https://github.com/ToyOSOrg/ToyOS"

# `font` is taken on crates.io, so the package is `toyos-font`; the lib target
# keeps the name every caller spells, which the sysroot's own `sdk/toyos/src`
# citations are written in and no branch of this shape may edit.
[lib]
name = "font"
doctest = false

[features]
# Rasterizing a TTF at any cell (`Font::from_ttf`). A crate that only draws a
# prebuilt raster, as `toyos-window` does, goes without it, and so does every
# program that reaches the font through `toyos-window` alone.
default = ["ttf"]
ttf = ["dep:fontdue", "dep:toyos-keymap"]

[dependencies]
fontdue = { version = "0.9", optional = true }
# The codepoints a shipped layout can type, which every raster carries.
toyos-keymap = { path = "../keymap", optional = true }
