[package]
name = "toyos-std-copies"
description = "A host test of std's ToyOS platform: its modules that name nothing but core and std's own sync, compiled as they are."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A package of its own because `sdk/std` is std's, built into the sysroot by
# a `#[path]` out of the fork: this compiles only the files that name nothing
# std alone has, the way `toyos-libc-copies` compiles libc's.

[lib]
doctest = false
