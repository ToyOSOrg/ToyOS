# A member of the host workspace (root `Cargo.toml`): the kernel
# depends on it by path and its tests run on the host, with no target-triple
# juggling.

[package]
name = "toyos-keymap"
version = "0.1.0" # never bumped; crates.io's is assigned on publish (build/sdkversion.rs)
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Keyboard layouts, dead-key composition and key translation for ToyOS."
repository = "https://github.com/ToyOSOrg/ToyOS"

[lints.rust]
warnings = "deny"
