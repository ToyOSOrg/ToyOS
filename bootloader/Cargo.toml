[package]
name = "bootloader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
toyos-abi = { path = "../toyos-abi" }
# The ECAM window's address, and the TCO block the loader arms in it: the two
# pure crates the kernel reads the same answers out of.
toyos-acpi = { path = "../toyos-acpi" }
# Where the transient page tables put memory and the scanout, decided apart
# from the pointers that write it and host-tested against machines this one is
# not.
toyos-bootmap = { path = "../toyos-bootmap" }
# The bands either side of `ExitBootServices`, declared where the kernel's entry
# stub and the harness read the same three rows and colours.
toyos-bootband = { path = "../toyos-bootband" }
toyos-elf = { path = "../toyos-elf" }
toyos-tco = { path = "../toyos-tco" }
uefi = { version = "0.26.0", default-features = false }
uefi-services = { version = "0.23.0", features = ["panic_handler", "logger"] }

# The one profile every guest binary is built with. Optimised, because an
# unoptimised guest mismeasures everything under TCG;
# debug-assertions and overflow-checks on, because fail-fast beats speed here
# and both crafted-ELF kernel panics in `issues/` were *found* by
# an overflow check. `--release` would turn the last two off silently, so this
# build system no longer has the flag.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
