[package]
name = "bootloader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
toyos-abi = { path = "../toyos-abi" }
# The ECAM window's address, and the TCO block the loader arms in it: the two
# pure crates the kernel reads the same answers out of.
toyos-acpi = { path = "../toyos-acpi" }
# Where the transient page tables put memory and the scanout, decided apart
# from the pointers that write it and host-tested against machines this one is
# not.
toyos-bootmap = { path = "../toyos-bootmap" }
toyos-blackbox = { path = "../toyos-blackbox" }
toyos-wallclock = { path = "../toyos-wallclock" }
toyos-elf = { path = "../toyos-elf" }
# ROOT is picked off the boot disk with the kernel's own readers: the GPT, and
# the superblock `Superblock::read` decides, which is the kernel's mount too.
toyos-gpt = { path = "../toyos-gpt" }
# Which ROOT, how it is read in bounded chunks, and the handoff the kernel
# checks: host-tested there.
toyos-rootimage = { path = "../toyos-rootimage" }
bcachefs = { path = "../bcachefs", default-features = false }
toyos-tco = { path = "../toyos-tco" }
# The signed image, the slot table and the anti-rollback floor: every decision
# this loader makes about which slot to boot, host-tested there.
toyos-update = { path = "../toyos-update" }
# `force-soft`, unified into the SHA-256 and SHA-512 `toyos-update` hashes
# with: this target is soft-float, and the x86 backend reaches for SSE and
# SHA-NI registers a UEFI application may not assume are its own.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# `alloc`: `variable_keys` and `get_variable_boxed`, which are how the boot
# entry pointing at this image is found among the firmware's own variables.
uefi = { version = "0.26.0", default-features = false, features = ["alloc"] }
uefi-services = { version = "0.23.0", features = ["panic_handler", "logger"] }

# The one profile every guest binary is built with. Optimised, because an
# unoptimised guest mismeasures everything under TCG;
# debug-assertions and overflow-checks on, because fail-fast beats speed here
# and both crafted-ELF kernel panics in `issues/` were *found* by
# an overflow check. `--release` would turn the last two off silently, so this
# build system no longer has the flag.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
