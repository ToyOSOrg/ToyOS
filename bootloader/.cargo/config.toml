[build]
target = "x86_64-unknown-uefi"
rustflags = [
    "-Dwarnings",
    "-Cforce-frame-pointers=yes",
    # `ed25519-dalek`'s field arithmetic in plain 64-bit integers: its default
    # on x86-64 is the AVX2 backend, which this soft-float target has no
    # registers for.
    "--cfg=curve25519_dalek_backend=\"serial\"",
    # `/Brepro` stamps the image with a hash of itself rather than the clock,
    # and `/DEBUG:NONE` writes no PDB, whose GUID the image would otherwise
    # carry and whose contents name the target directory: without both, two
    # builds of one tree are two images.
    "-Clink-arg=/Brepro",
    "-Clink-arg=/DEBUG:NONE",
]
