# The diagnostic boot: a machine that reaches `Boot: complete` and then leaves
# the kernel's boot log on the panel, for a machine that has no serial port.
#
# `panic_console::boot_checkpoint` paints the tail of the log ring at every boot
# phase boundary and returns immediately once anything claims
# DEVICE_FRAMEBUFFER. On the image that was flashed to the T14 the compositor
# claimed it tens of milliseconds after the last checkpoint, so every line the
# kernel logged — including the one `i8042:` line that says why the integrated
# keyboard is dead — was on screen for about a tenth of a second and then gone.
#
# `/system/bin/supervisor` is in every image and holds the one `SysCap`, so the
# guarantee is that this config declares no `devices`, which
# `no_diag_program_claims_the_screen` checks.
[boot]
start = ["logkeeper", "fileserver", "toybox"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and the console and writes no
# file at all, so a boot config without `logkeeper` is a boot whose `/log` is empty —
# `every_boot_config_runs_logkeeper` is what refuses one. It claims no device and
# serves no port: its row's authority is `logread`, which is
# `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate, and the supervisor hands it every
# program's output beside that.
[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.toybox]
args = ["pwd"]

# `/log`'s file server, and only it: the log partition is the kernel's
# partition claim on the boot stick, so this row declares no `devices`, and
# DATA's block service would be one.
[programs.fileserver]
restart = true
roles = ["log"]
