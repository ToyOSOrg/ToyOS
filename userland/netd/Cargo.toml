[package]
name = "netd"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-i219 = { path = "../../toyos-i219" }
toyos-tco = { path = "../../toyos-tco" }
toyos-mdns = { path = "../../toyos-mdns" }
toyos-dns = { path = "../../toyos-dns" }
toyos-inspect = { path = "../../toyos-inspect" }
# Fuchsia's Netstack3 core, from its packaging mirror (`forks.toml`).
netstack3-core = { git = "https://github.com/ToyOSOrg/netstack3", branch = "toyos" }
net-types = { git = "https://github.com/ToyOSOrg/netstack3", branch = "toyos" }
packet = { git = "https://github.com/ToyOSOrg/netstack3", branch = "toyos" }
packet-formats = { git = "https://github.com/ToyOSOrg/netstack3", branch = "toyos" }
rand = { version = "0.10.2", default-features = false }
zerocopy = "0.8.48"

