[package]
name = "netd"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-i219 = { path = "../../toyos-i219" }
toyos-tco = { path = "../../toyos-tco" }

[dependencies.smoltcp]
version = "0.12"
default-features = false
features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    # A lease carries up to `wire::DHCP_MAX_DNS_SERVER_COUNT` resolvers and the
    # resolver socket's default holds one; `netd/src/dhcp.rs` asserts the two.
    "dns-max-server-count-3",
    "alloc",
]
