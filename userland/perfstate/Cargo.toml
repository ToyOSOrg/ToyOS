[package]
name = "perfstate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The library is the read and its check, so the guest test that mints its own
# claim runs exactly what `/system/bin/perfstate` runs.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "perfstate"
path = "src/main.rs"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-perfstate = { path = "../../toyos-perfstate" }
