[package]
name = "calc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The engine is a library so it can be tested without a window, and the binary
# beside it is the window. `doctest = false` because the `toyos` toolchain
# builds rustc and no rustdoc: a doc-test target is one no machine that builds
# this tree could run.
[lib]
doctest = false

# The window, built for ToyOS alone: winit and softbuffer, default features off,
# have no Linux backend. `test = false` keeps it out of `cargo test` only while
# the package has no `tests/`, for which cargo builds every binary.
[[bin]]
name = "calc"
path = "src/main.rs"
test = false

[dependencies]
toyos-font = { path = "../toyos-font" }

[target.'cfg(target_os = "toyos")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

[build-dependencies]
fontdue = "0.9"
