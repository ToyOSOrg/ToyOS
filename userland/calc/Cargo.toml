[package]
name = "calc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The engine is a library so it can be tested without a window, and the binary
# beside it is the window. `doctest = false` because the `toyos` toolchain
# builds rustc and no rustdoc: a doc-test target is one no machine that builds
# this tree could run.
[lib]
doctest = false

[dependencies]
toyos-font = { path = "../toyos-font" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

# With default features off, neither has a Linux backend. These load the X11
# and Wayland client libraries at run time, so building installs none of them.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[build-dependencies]
fontdue = "0.9"
