[package]
name = "calc-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "calc without its window: exact arithmetic, the keypad as a state machine, and the layout at any size."

# `doctest = false` because the `toyos` toolchain builds rustc and no rustdoc: a
# doc-test target is one no machine that builds this tree could run.
[lib]
doctest = false

[dependencies]
toyos-font = { path = "../toyos-font" }

[build-dependencies]
fontdue = "0.9"
