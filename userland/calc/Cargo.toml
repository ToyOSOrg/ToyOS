[package]
name = "calc"
description = "A calculator: exact rationals in Calc, 64-bit two's-complement integers in Prog; the engine is a library tested on the host, and the window is winit and softbuffer."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The engine is a library so it can be tested without a window, and the binary
# beside it is the window. `doctest = false` because the `toyos` toolchain
# builds rustc and no rustdoc: a doc-test target is one no machine that builds
# this tree could run.
[lib]
doctest = false

[dependencies]
toyos-font = { path = "../toyos-font" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }

[build-dependencies]
fontdue = "0.9"
