[package]
name = "calc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "calc's window: the keys and the display, drawn with winit and softbuffer over calc-core."

# A package apart from calc-core, so the host tests that one without building
# this: winit and softbuffer, default features off, have no Linux backend.
[dependencies]
calc-core = { path = ".." }
toyos-font = { path = "../../toyos-font" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
