[package]
name = "pkg"
description = "The installer: an archive checked against its release's SHA256SUMS and unpacked as one directory under /apps; the decoders are a library tested on the host."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The decoders are a library so the archive and the sums file can be attacked
# without a guest, and the binary beside it is the filesystem. `doctest = false`
# because the `toyos` toolchain builds rustc and no rustdoc.
[lib]
doctest = false

[dependencies]
toyos-manifest = { path = "../../toyos-manifest" }
toyos-sha2 = { path = "../../toyos-sha2" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Test scratch that is gone on every way out; `--ci host` reds on any left behind.
toyos-tmpdir = { path = "../../toyos-tmpdir" }
