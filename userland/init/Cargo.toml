[package]
name = "init"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
toyos = { path = "../../toyos" }
toyos-abi = { path = "../../toyos-abi" }
toyos-manifest = { path = "../../toyos-manifest" }
toyos-logstream = { path = "../../toyos-logstream" }
toyos-swap = { path = "../../toyos-swap" }
# The slot table and which slot is idle, for the one row that asks for it.
toyos-update = { path = "../../toyos-update" }
# The partition types that name the running ROOT and the slot table.
toyos-gpt = { path = "../../toyos-gpt" }
# The block service's port name, which marks a storage row.
toyos-blockring = { path = "../../toyos-blockring" }
# How long a stop is prepared before the kernel is asked for it.
toyos-quiesce = { path = "../../toyos-quiesce" }
