fontique = { git = "https://github.com/ToyOSOrg/parley", branch = "toyos-0.11.1" }
wgpu = { git = "https://github.com/ToyOSOrg/wgpu", branch = "toyos-27.0.4" }
i-slint-backend-winit = { git = "https://github.com/ToyOSOrg/slint", branch = "toyos-1.18.1" }
i-slint-backend-linuxkms = { git = "https://github.com/ToyOSOrg/slint", branch = "toyos-1.18.1" }
i-slint-backend-selector = { git = "https://github.com/ToyOSOrg/slint", branch = "toyos-1.18.1" }
