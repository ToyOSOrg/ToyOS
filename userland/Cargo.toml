[workspace]
resolver = "2"
members = [
    "calc",
    "compositor",
    "console",
    "doom",
    "egui-hello",
    "editor",
    "filepicker",
    "filepicker-api",
    "files",
    "host",
    "iced-counter",
    "init",
    "input-test",
    "inspect",
    "logd",
    "metalprobe",
    "netd",
    "paint",
    "pkg",
    "proctest",
    "shell",
    "slint-hello",
    "snake",
    "soundd",
    "sprite",
    "sshd",
    "terminal",
    "test-runner",
    "toybox",
    "toyos-font",
    "toyos-window",
]
exclude = [
    # no_std C runtime — uses panic=abort (own Cargo.toml profile)
    "libc",
]

[patch.crates-io]
# ToyOS's own crates: the forks below depend on these by version so they can be
# consumed as git dependencies (a path escaping the fork's own repo cannot
# resolve once cargo checks it out alone). These redirects keep local builds
# on the working tree. Publishing them to crates.io is only needed for real
# upstream PRs, not for building here.
toyos-abi = { path = "../toyos-abi" }
toyos = { path = "../toyos" }
toyos-window = { path = "toyos-window" }

# Ecosystem forks — see forks.toml for upstream base, tier, and PR status.
getrandom = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.2-sdk-0.12", package = "getrandom" }
getrandom_03 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.3-sdk-0.12", package = "getrandom" }
getrandom_04 = { git = "https://github.com/ToyOSOrg/getrandom", branch = "toyos-0.4-sdk-0.12", package = "getrandom" }
mio = { git = "https://github.com/ToyOSOrg/mio", branch = "toyos-sdk-0.13" }
tokio = { git = "https://github.com/ToyOSOrg/tokio", branch = "toyos" }
russh = { git = "https://github.com/ToyOSOrg/russh", branch = "toyos" }
russh-cryptovec = { git = "https://github.com/ToyOSOrg/russh", branch = "toyos" }
socket2 = { git = "https://github.com/ToyOSOrg/socket2", branch = "toyos-sdk-0.13" }
raw-window-handle = { git = "https://github.com/ToyOSOrg/raw-window-handle", branch = "toyos-0.6.2" }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0-sdk-0.13" }
softbuffer = { git = "https://github.com/ToyOSOrg/softbuffer", branch = "toyos-0.4.8-sdk-0.15" }
