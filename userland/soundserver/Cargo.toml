[package]
name = "soundserver"
description = "The audio server: ToyOS's audio devices claimed from the kernel, and every client's stream mixed onto them."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-hda = { path = "../../toyos-hda" }
toyos-mixer = { path = "mixer" }
toyos-virtio-sound = { path = "virtio-sound" }
toyos-virtio = { path = "../../toyos-virtio" }
toyos-pci-claim = { path = "../toyos-pci-claim" }
toyos-inspect = { path = "../../toyos-inspect" }
rubato = "0.16"

[package.metadata.toyos.host]
exempt.owns = "ToyOS's audio devices, claimed from the kernel"
