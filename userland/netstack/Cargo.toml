[package]
name = "netstack"
description = "The network server: one Ethernet device claimed from the kernel, ToyOS's own stack over it (toyos-net-node), its DHCP lease, resolver and mDNS name, served to programs over IPC."
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-device-memory = { path = "../../toyos-device-memory" }
toyos-i219 = { path = "../../toyos-i219" }
toyos-virtio = { path = "../../toyos-virtio" }
toyos-pci-claim = { path = "../toyos-pci-claim" }
toyos-tco = { path = "../../toyos-tco" }
toyos-mdns = { path = "mdns" }
toyos-dns = { path = "../../toyos-dns" }
toyos-dhcp = { path = "../../toyos-dhcp" }
toyos-inspect = { path = "../../toyos-inspect" }
toyos-net-node = { path = "node" }
toyos-net-ip = { path = "../../toyos-net-ip" }
toyos-net-shard = { path = "../../toyos-net-shard" }
toyos-net-tcp = { path = "../../toyos-net-shard/tcp" }
toyos-net-udp = { path = "../../toyos-net-udp" }
toyos-net-wire = { path = "../../toyos-net-wire" }

[package.metadata.toyos.host]
exempt.owns = "the NIC ToyOS claims for it"
