[package]
name = "toyos-net-node"
description = "Netstack's decisions, pure: one interface of ToyOS's own stack, its DHCP lease and its clients' streams, frames and time in, frames out against the device's credit."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
toyos-dhcp = { path = "../../../toyos-dhcp" }
toyos-net-ip = { path = "../../../toyos-net-ip" }
toyos-net-shard = { path = "../../../toyos-net-shard" }
toyos-net-tcp = { path = "../../../toyos-net-shard/tcp" }
toyos-net-udp = { path = "../../../toyos-net-udp" }
toyos-net-wire = { path = "../../../toyos-net-wire" }

[dev-dependencies]
# The outside reader of every frame the node emits: a published Ethernet, ARP,
# IPv4, UDP and ICMP parser, used as a black box.
etherparse = "0.21.0"
