[package]
name = "filepicker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
filepicker-api = { path = "../filepicker-api" }
toyos = { path = "../../toyos" }
toyos-font = { path = "../toyos-font" }
toyos-window = { path = "../toyos-window" }

[package.metadata.toyos.host]
exempt = "init starts it at boot to serve ToyOS's machine-wide `filepicker` port"
