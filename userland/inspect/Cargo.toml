[package]
name = "inspect"
description = "/system/bin/inspect: what each owner of a device or service, and the kernel's inventory and counters, say about themselves now."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The library is the question the reader puts to one owner, so a program that
# waits on an owner's state asks as the reader does; the reader is
# `src/main.rs`.
[lib]
doctest = false

[dependencies]
toyos = { path = "../../toyos" }
toyos-abi = { path = "../../toyos-abi" }
toyos-inspect = { path = "../../toyos-inspect" }

[package.metadata.toyos.host]
exempt.manages = "ToyOS's machine inventory and counters: what every owner's port and the kernel's `inventory` and `counters` SysCap rights report"
