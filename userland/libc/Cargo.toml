[package]
name = "toyos-libc"
description = "ToyOS's C library, ours and not a fork: the POSIX layer a C program links, over toyos-abi and toyos, built into the sysroot."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Enable when linking with Rust std (skips panic_handler and global_allocator)
std-runtime = []

[dependencies]
toyos-abi = { path = "../../toyos-abi" }
toyos = { path = "../../toyos" }
toyos-elf = { path = "../../toyos-elf" }
toyos-osrelease = { path = "../../toyos-osrelease" }
dlmalloc = "0.2.7"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lib]
doctest = false
