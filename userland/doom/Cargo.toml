[package]
name = "doom"
description = "DOOM: doomgeneric's C engine in a winit and softbuffer window, its music played through rustysynth and cpal."
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
cpal = "0.18"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
rustysynth = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }

[build-dependencies]
cc = "1.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

[package.metadata.toyos.host]
fails = ["linux", "macos", "windows"]
issue = "issues/apps-that-build-or-run-on-toyos-alone.md"
