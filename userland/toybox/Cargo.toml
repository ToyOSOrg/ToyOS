[package]
name = "toybox"
description = "A multi-call binary of command-line utilities (cat, ls, grep, ps and the rest), each run by the name it is invoked under."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
cpal = "0.18"
toyos-abi = { path = "../../toyos-abi" }
toyos-keymap = { path = "../../toyos-keymap" }
toyos = { path = "../../toyos" }
toyos-window = { path = "../toyos-window" }

[package.metadata.toyos.host]
fails = ["linux", "macos", "windows"]
issue = "issues/apps-that-build-or-run-on-toyos-alone.md"
