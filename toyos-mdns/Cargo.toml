# A member of the host workspace (root `Cargo.toml`): netd answers with it on
# the guest, and its tests run on the host. What lives here is the wire form of
# one machine answering for its own name — pure, so every byte of a reply is
# checked without a network.

[package]
name = "toyos-mdns"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# The wire reader: a question's name is read by the same code, under the same
# rules, as a resolver's reply.
toyos-dns = { path = "../toyos-dns" }
