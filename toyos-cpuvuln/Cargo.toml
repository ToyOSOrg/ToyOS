# A member of the host workspace (root `Cargo.toml`):
# `no_std` so the kernel can depend on it by path, and its tests run on the host.

[package]
name = "toyos-cpuvuln"
description = "Linux's verdicts from a CPU's CPUID and MSR facts, pure: each speculative-execution vulnerability and its mitigation choice, and which model-specific counters the CPU has."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
