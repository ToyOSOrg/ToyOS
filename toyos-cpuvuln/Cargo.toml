# A member of the host workspace (root `Cargo.toml`), like toyos-userbound:
# `no_std` so the kernel can depend on it by path, and its tests run on the host.

[package]
name = "toyos-cpuvuln"
description = "Linux's verdict on each speculative-execution vulnerability and its mitigation choice, from a CPU's CPUID and MSR facts, pure."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
