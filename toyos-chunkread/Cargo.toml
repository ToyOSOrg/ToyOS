# A member of the host workspace (root `Cargo.toml`), like toyos-bootmap: the
# bootloader depends on it by path and its tests run on the host. What lives
# here is how the loader reads an extent off firmware block I/O — in bounded
# chunks, saying how far it got, and stopping at the first chunk that fails —
# a decision whose only other instrument is a real machine's firmware.

[package]
name = "toyos-chunkread"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
