# A member of the host workspace (root `Cargo.toml`), like toyos-pci and
# toyos-hda: the kernel depends on it by path and its tests run on the host.
# What lives here is where a chipset keeps its TCO watchdog and what timer value
# a bound in milliseconds comes to — arithmetic that decides which I/O port the
# kernel writes on a real laptop, which is exactly the decision a guest cannot
# exercise and a host test can.

[package]
name = "toyos-tco"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
