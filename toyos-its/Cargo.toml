# A member of the host workspace (root `Cargo.toml`), like toyos-acpi and
# toyos-smmu: it is pure, it has no dependencies, and its tests run on the
# host.
#
# What lives here is every word a GICv3 ITS and its driver exchange, and the
# two tables a redistributor reads an LPI's configuration and pending state
# from. The ITS is what makes a message a claimed function writes arrive as
# that claim's interrupt and no other's, so its commands are held on the host
# to the specification's field positions.

[package]
name = "toyos-its"
description = "The GICv3 ITS's encodings: commands, table sizing, LPI configuration and pending tables and register fields, pure, forbid(unsafe_code)."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
