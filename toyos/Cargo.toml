[package]
name = "toyos"
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The ToyOS userland SDK: typed handles, IPC, ports, namespaces, surfaces and net."
repository = "https://github.com/ToyOSOrg/ToyOS"

[features]
rustc-dep-of-std = ["core", "toyos-abi/rustc-dep-of-std"]
# The negative control for the log ring's publication. It makes the store that
# publishes a record `Relaxed`, and `kernel-loom`'s `log_ring` model must red:
#
#   cargo test --manifest-path kernel-loom/Cargo.toml --features log-ring-publish-relaxed \
#     --test log_ring
#
# Declared here only so `cfg` checking knows the name; nothing enables it.
log-ring-publish-relaxed = []

[lints.rust]
# The guest's target: its stream sinks are compiled only for it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("toyos"))'] }

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
toyos-abi = { path = "../toyos-abi", version = "0.13.0", default-features = false }
