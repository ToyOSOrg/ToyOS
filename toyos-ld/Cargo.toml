[package]
name = "toyos-ld"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The linker toyos-cc links through inside ToyOS. Frozen: everything the host builds links through rust-lld, and this goes when LLD runs on ToyOS."
repository = "https://github.com/ToyOSOrg/ToyOS"
# Off crates.io: no Rust target names it any more.
publish = false

[dependencies]
object = { version = "0.38", default-features = false, features = ["read", "write", "elf", "coff", "pe", "macho", "std"] }
sha2 = "0.10"
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
# Test scratch that is gone on every way out; `--ci host` reds on any left behind.
# A path alone, so `cargo publish` drops it.
toyos-tmpdir = { path = "../toyos-tmpdir" }

[lints.rust]
warnings = "deny"

# `[profile.toyos]` used to be declared here. Cargo ignores `[profile]` in a
# workspace member and this is one — it now lives in the root `Cargo.toml`,
# verbatim, and reaches this crate from there. `src/hostws.rs` reds on a member
# that declares one.
